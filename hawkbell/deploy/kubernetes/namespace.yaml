# Namespace of the hawkbell node sensor.
#
# The sensor needs hostPID and two capabilities outside the Pod Security
# Standards' "baseline" list (SYS_PTRACE, DAC_READ_SEARCH), so the namespace
# must admit "privileged" pods. Keep nothing else in it: whoever can create
# pods here can create pods with the same access to every process on the node.
apiVersion: v1
kind: Namespace
metadata:
  name: hawkbell
  labels:
    app.kubernetes.io/name: hawkbell
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/audit: privileged
