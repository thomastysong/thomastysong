# goreleaser configuration of spoor releases (goreleaser v2).
#
#   goreleaser release --clean                 # from a tag, in CI
#   goreleaser release --snapshot --clean --skip=sign,sbom,publish   # local dry run
#
# Produces, for linux, darwin and windows on amd64 and arm64:
#   - raw binaries spoor_<os>_<arch>[.exe]: what deploy/fleet/scripts/install-spoor.*
#     download and check against their pinned SHA-256;
#   - archives spoor_<version>_<os>_<arch>.tar.gz (.zip on Windows) with the
#     service definitions from packaging/;
#   - a darwin universal binary (input of packaging/macos/build-pkg.sh, which
#     needs macOS and is not run here);
#   - deb and rpm packages spoor_<version>_linux_<arch>.{deb,rpm} (the names
#     deploy/fleet/software/*.package.yml use), built by nfpm with the same
#     contents and scripts as packaging/linux/nfpm.yaml
#     (packaging/packaging_test.go keeps them in step);
#   - checksums.txt (SHA-256), SBOMs (syft) and a keyless cosign signature of
#     the checksum file.
# The container image is built from the Dockerfile (make image; CI), not
# here: its file capabilities are applied in the Dockerfile's build stage.
#
# Reproducible: CGO off, -trimpath, empty build id, version/commit/date from
# git, file times from the commit time. The project lives in a subdirectory
# of its repository today; tags and the release target must be set when it
# moves to its own repository (see .github/workflows/ci.yml).
version: 2
project_name: spoor

before:
  hooks:
    - go mod verify

builds:
  - id: spoor
    main: ./cmd/spoor
    binary: spoor
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w -buildid= -X main.version={{ .Version }} -X main.commit={{ .ShortCommit }} -X main.date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

universal_binaries:
  - id: spoor-darwin-universal
    ids: [spoor]
    name_template: spoor
    replace: false
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: archives
    ids: [spoor]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - packaging/systemd/spoor.service
      - packaging/launchd/com.github.thomastysong.spoor.plist
      - packaging/windows/install-service.ps1
  - id: binaries
    ids: [spoor]
    formats: [binary]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

nfpms:
  - id: linux
    ids: [spoor]
    package_name: spoor
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [deb, rpm]
    mtime: "{{ .CommitDate }}"
    vendor: spoor
    homepage: https://github.com/thomastysong/thomastysong/tree/main/spoor
    # UNVERIFIED: placeholder maintainer address (.invalid is reserved); set
    # the real contact before the first release.
    maintainer: spoor maintainers <maintainers@spoor.invalid>
    description: |-
      AI coding agent detection sensor.
      spoor collects what AI coding agents do (hooks, session transcripts,
      processes), detects risky behaviour on the endpoint, reports sensor health
      and hook coverage, and hands findings to Fluent Bit and Fleet/osquery.
    license: Apache-2.0
    section: admin
    priority: optional
    release: "1"
    bindir: /usr/bin
    contents:
      - src: packaging/systemd/spoor.service
        dst: /usr/lib/systemd/system/spoor.service
        file_info:
          mode: 0644
          owner: root
          group: root
      - src: LICENSE
        dst: /usr/share/doc/spoor/LICENSE
        file_info:
          mode: 0644
          owner: root
          group: root
    scripts:
      preinstall: packaging/linux/preinstall.sh
      postinstall: packaging/linux/postinstall.sh
      preremove: packaging/linux/preremove.sh
      postremove: packaging/linux/postremove.sh

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - artifacts: archive
  - id: packages
    artifacts: package

signs:
  # Keyless signing (Sigstore) with the CI job's OIDC identity: verify with
  #   cosign verify-blob --certificate checksums.txt.pem --signature checksums.txt.sig \
  #     --certificate-identity-regexp '<repository workflow>' \
  #     --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt
  - cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - --yes
      - --output-signature=${signature}
      - --output-certificate=${certificate}
      - ${artifact}
    artifacts: checksum

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: git
  sort: asc

release:
  draft: true
  prerelease: auto
