# Named lists referenced by rules through |in_list and |any_in_list.
# Matching ignores case. "*.example.com" matches any subdomain of
# example.com (not example.com itself); "prefix*" matches by prefix.
# Bundles replace a list by name (Set.Merge), so an operator extends a list
# by shipping the whole list in a bundle.
#
# |in_list on a list-valued field requires EVERY element to be listed: one
# trusted host never vouches for another host in the same command.
lists:
  # Hosts whose curl | sh installers are documented by the vendor on its
  # own site, and on which nobody else can publish (SPR-EXEC-001). Matched
  # against parsed hosts, never against URL text. A shared host is never
  # listed here: raw.githubusercontent.com serves every repository, and
  # deno.land/x/ serves third-party modules; list exact URLs below instead.
  trusted_installer_hosts:
    - sh.rustup.rs
    - claude.ai
    - bun.sh
    - astral.sh
    - get.pnpm.io
    - install.python-poetry.org
    - get.docker.com
    - ollama.com

  # Installer URLs on shared hosts. An entry is an exact URL or a prefix
  # that ends at a path boundary ("/" before the *): a prefix without one,
  # such as "https://sh.rustup.rs*", also matches
  # https://sh.rustup.rs.evil.example/. SPR-EXEC-001 applies these only
  # when every host of the command is in trusted_installer_url_hosts and no
  # URL carries userinfo, dot segments or escapes, so add the host there
  # too. Pin a GitHub repository to a named ref (HEAD, a release tag), not
  # to any ref: raw.githubusercontent.com serves a commit id from any fork
  # of the repository under the upstream's name.
  # UNVERIFIED: fork commits by id under raw.githubusercontent.com (shown
  # for github.com commit pages and for Actions "impostor commits").
  trusted_installer_urls:
    - "https://raw.githubusercontent.com/Homebrew/install/HEAD/*"
    - "https://raw.githubusercontent.com/nvm-sh/nvm/v*"
    - "https://deno.land/install.sh"
    - "https://deno.land/install.ps1"

  # The hosts of trusted_installer_urls.
  trusted_installer_url_hosts:
    - raw.githubusercontent.com
    - deno.land

  # Hosts whose content is not treated as untrusted input
  # (SPR-FLOW-001): vendor documentation and language references. Package
  # registries are excluded by the feature itself. Add the organisation's
  # own code and wiki hosts here through a bundle: a third party cannot
  # author content on them. Public code hosts (github.com, gitlab.com) are
  # deliberately absent: issues, READMEs and gists there are attacker-
  # authorable and are the documented injection channel.
  trusted_content_hosts:
    - docs.python.org
    - go.dev
    - pkg.go.dev
    - developer.mozilla.org
    - docs.docker.com
    - kubernetes.io
    - learn.microsoft.com
    - docs.github.com
    - code.claude.com
    - docs.anthropic.com
    - docs.claude.com
    - nodejs.org
    - doc.rust-lang.org
    - docs.rs
    - man7.org
    - www.rfc-editor.org
    - datatracker.ietf.org
    - docs.fluentbit.io
    - osquery.readthedocs.io
    - fleetdm.com
    - attack.mitre.org
    - atlas.mitre.org

  # Hosts an upload to is ordinary engineering (SPR-EXFIL-005): object
  # stores and registries the organisation uses. Ship the organisation's
  # own endpoints through a bundle.
  approved_upload_hosts:
    - localhost
    - 127.0.0.1
    - "::1"
    - "*.amazonaws.com"
    - storage.googleapis.com
    - "*.blob.core.windows.net"
    - registry.npmjs.org
    - upload.pypi.org
    - ghcr.io
    - uploads.github.com
    - api.github.com

  # Package registries an install may name explicitly (--registry,
  # --index-url) without it being a dependency-confusion signal
  # (SPR-SUPPLY-003). Add the organisation's mirrors through a bundle.
  approved_package_indexes:
    - "https://registry.npmjs.org*"
    - "https://registry.yarnpkg.com*"
    - "https://pypi.org/simple*"
    - "https://files.pythonhosted.org*"
    - "https://download.pytorch.org/*"
    - "https://proxy.golang.org*"
    - "https://index.crates.io*"
    - "https://rubygems.org*"

  # Packages named in incident reports (research/threats.md section 2).
  # Entries carry the version when only one release was malicious. This is
  # a seed for an OSV MAL-* / OpenSSF malicious-packages feed delivered by
  # bundle, not a feed in itself.
  malicious_packages:
    - "function-color"        # row 33: AGENTS.md in ~/Downloads tells Codex to install it (Oct 2026)
    - "function-color@*"
    - "postmark-mcp@1.0.16"   # row 35: one-line BCC added after 15 clean versions (Sep 2025)

  # Search, listing and inspection commands. A command line made only of
  # these that names a worm indicator is someone hunting for it, which is
  # what every advisory asked developers to do (SPR-SUPPLY-006). gh is
  # listed for gh search / gh repo list; gh repo create with an indicator
  # name is SPR-SUPPLY-001 whatever else is on the line.
  ioc_hunt_commands:
    - find
    - fd
    - locate
    - mdfind
    - grep
    - egrep
    - fgrep
    - rg
    - ag
    - ack
    - git
    - ls
    - stat
    - file
    - cat
    - head
    - tail
    - less
    - wc
    - sort
    - uniq
    - xargs
    - sha256sum
    - sha1sum
    - shasum
    - md5sum
    - jq
    - gh
    - npm
    - pnpm
    - yarn

  # Offensive security tools (SPR-OFFSEC-001), by command name. Hosts
  # tagged offsec (Options.HostTags) are exempt in the rule itself.
  offensive_tools:
    - nmap
    - masscan
    - rustscan
    - nxc
    - netexec
    - crackmapexec
    - "impacket-*"
    - secretsdump.py
    - psexec.py
    - wmiexec.py
    - ntlmrelayx.py
    - getuserspns.py
    - certipy
    - certipy-ad
    - responder
    - proxychains
    - proxychains4
    - sqlmap
    - hydra
    - medusa
    - hashcat
    - john
    - kerbrute
    - evil-winrm
    - bloodhound-python
    - linpeas.sh
    - winpeas.exe
    - mimikatz
    - mimikatz.exe
    - rubeus.exe
    - nuclei
    - ffuf
    - gobuster
    - feroxbuster
    - nikto
    - enum4linux
    - smbmap
    - ligolo-ng
    - sliver-client
    - msfconsole
    - msfvenom

  # AI agent command-line programs that can be told to run without
  # approvals (SPR-AGENT-012, SPR-PROC-*).
  agent_clis:
    - claude
    - codex
    - gemini
    - q
    - kiro-cli
    - copilot
    - cursor-agent
    - opencode
    - goose
    - aider
    - amp
    - qwen

  # Secret kinds that are shapes rather than provider formats (a value
  # under a key named "password", a secret-named URL parameter). Rules that
  # flag credential literals stay quiet when every kind found is one of
  # these: they are mostly fixtures and placeholders.
  weak_secret_kinds:
    - password
    - generic_secret
    - url_param
    - sensitive_key

  # kubectl spellings of "every namespace".
  all_namespace_flags:
    - "-A"
    - "--all-namespaces"
    - "--all-namespaces=true"

  # Flags that turn off approvals, the sandbox or hook trust for an agent
  # CLI, as single argv tokens (catalog risky_flags; research/threats.md
  # section 3 BYPASS_FLAGS). Two-token spellings (--permission-mode
  # bypassPermissions) are also listed in their "=" form.
  agent_bypass_flags:
    - "--dangerously-skip-permissions"
    - "--allow-dangerously-skip-permissions"
    - "--permission-mode=bypassPermissions"
    - "--yolo"
    - "--approval-mode=yolo"
    - "--trust-all-tools"
    - "--dangerously-bypass-approvals-and-sandbox"
    - "--dangerously-bypass-hook-trust"
    - "--sandbox=danger-full-access"
    - "--ask-for-approval=never"
    - "--allow-all-tools"
    - "--allow-all"
    - "--allow-all-paths"
    - "--allow-all-urls"
    - "--yes-always"
    - "--force"

  # The same flags in catalog spelling, as the process monitor reports
  # them in process.flags (a flag that takes a value is "--flag value").
  # Only flags that remove approvals, the sandbox or hook trust are here;
  # attributes such as --bare or --no-session-persistence are coverage
  # facts, not bypasses (internal/catalog/data/agents.yaml risky_flags).
  agent_bypass_risky_flags:
    - "--dangerously-skip-permissions"
    - "--allow-dangerously-skip-permissions"
    - "--permission-mode bypassPermissions"
    - "--yolo"
    - "--approval-mode yolo"
    - "--trust-all-tools"
    - "--dangerously-bypass-approvals-and-sandbox"
    - "--dangerously-bypass-hook-trust"
    - "--sandbox danger-full-access"
    - "--ask-for-approval never"
    - "--allow-all-tools"
    - "--allow-all"
    - "--allow-all-paths"
    - "--allow-all-urls"
    - "--autopilot"
    - "--no-ask-user"
    - "--yes-always"
    - "--force"

  # Process names that open URLs and protocol links (browsers and the OS
  # URL dispatchers). An agent started below one of these was started by a
  # link, not by a user at a terminal (SPR-PROC-005).
  url_handler_processes:
    - chrome
    - google-chrome
    - google chrome
    - chromium
    - chromium-browser
    - firefox
    - safari
    - msedge
    - brave
    - brave-browser
    - opera
    - vivaldi
    - arc
    - xdg-open
    - gio
    - kde-open
    - open
    - explorer.exe
    - rundll32.exe

  # Inventory risk flags that mean "tools run without asking" when a
  # repository chose them (project: prefix from discovery's catalog
  # probes) or that discovery computes for project files directly.
  escalation_risk_flags:
    - settings_escalate_permissions
    - ide_auto_approve
    - "project:bypass_permissions_default"
    - "project:auto_approve_default"
    - "project:auto_approve_all_tools"
    - "project:approvals_disabled"
    - "project:allow_all_tools_env"
    - "project:sandbox_disabled"
    - "project:hooks_disabled"
    - "project:hook_consent_bypassed"
    - "project:unsandboxed_commands_allowed"

  # Destinations on this machine: data sent there has not left it.
  local_hosts:
    - localhost
    - "*.localhost"
    - 127.0.0.1
    - "::1"
    - 0.0.0.0
    - host.docker.internal

  # Package registries whose content does not set untrusted_input
  # (SPR-FLOW-001): counting them made the flag near-constant on benign
  # sessions. Ship an empty list in a bundle to treat registry READMEs as
  # untrusted. Hosts, not the package_registry host class: an unknown host
  # has no class, so a class test cannot see an attacker's URL next to a
  # registry URL in one command. Every host of the result must be listed
  # here (or every host in trusted_content_hosts). These are the package
  # indexes and metadata hosts of classify's package_registry class, each
  # with its subdomains. Left out of that class: CDNs that serve any
  # repository's files (cdn.jsdelivr.net/gh/, esm.sh/gh/, unpkg.com),
  # user-submitted build recipes (aur.archlinux.org), extension
  # marketplaces, and skill and MCP directories, whose pages are the text
  # an agent is steered by.
  trusted_registry_hosts:
    - registry.npmjs.org
    - npmjs.com
    - "*.npmjs.com"
    - npmjs.org
    - "*.npmjs.org"
    - registry.yarnpkg.com
    - yarnpkg.com
    - "*.yarnpkg.com"
    - jsr.io
    - registry.npmmirror.com
    - pypi.org
    - "*.pypi.org"
    - pythonhosted.org
    - "*.pythonhosted.org"
    - conda.anaconda.org
    - repo.anaconda.com
    - anaconda.org
    - crates.io
    - "*.crates.io"
    - proxy.golang.org
    - sum.golang.org
    - pkg.go.dev
    - rubygems.org
    - "*.rubygems.org"
    - repo.maven.apache.org
    - repo1.maven.org
    - central.sonatype.com
    - plugins.gradle.org
    - packagist.org
    - "*.packagist.org"
    - nuget.org
    - "*.nuget.org"
    - pub.dev
    - hex.pm
    - metacpan.org
    - cran.r-project.org
    - hackage.haskell.org
    - hub.docker.com
    - registry-1.docker.io
    - ghcr.io
    - quay.io
    - mcr.microsoft.com
    - public.ecr.aws
    - registry.k8s.io
    - formulae.brew.sh
    - deb.debian.org
    - archive.ubuntu.com
    - security.ubuntu.com
    - dl-cdn.alpinelinux.org
    - packages.microsoft.com
    - dl.fedoraproject.org
    - download.opensuse.org
    - archlinux.org
    - cache.nixos.org
