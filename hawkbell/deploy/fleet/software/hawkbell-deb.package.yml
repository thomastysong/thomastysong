# EXAMPLE, Fleet Premium only (software deployment; self-hosted Fleet also
# needs an S3 bucket). Not validated against a server: the verification
# server runs Fleet Free. Replace url with your build's and pin its hash.
# The package installs the binary and service; the post-install script
# registers the osquery extension in /etc/osquery/extensions.load (tier 3).
# It fails, and Fleet rolls the install back, on hosts where Fleet manages
# osquery extensions (orbit's own extensions.load is in use). For tier 2
# (ATC) remove post_install_script.
- url: https://downloads.example.com/hawkbell/0.1.0/hawkbell_0.1.0_linux_amd64.deb
  # Pin the package: Fleet refuses it when the download's hash differs.
  # hash_sha256: <SHA-256 of the package file>
  post_install_script:
    path: ../scripts/register-extension.sh
