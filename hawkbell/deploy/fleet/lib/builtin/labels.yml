- name: AI agents present
  description: Fleet's ai_tools table (fleetd 1.59.0 or later) lists an AI agent, app, IDE plugin, MCP server or browser extension. Needs no hawkbell table, so it can scope the hawkbell rollout.
  query: |-
    SELECT 1 FROM ai_tools WHERE type IN ('agents', 'apps', 'ide_plugins', 'mcp_server', 'browser_extension') LIMIT 1;
