      ev AS MATERIALIZED (SELECT time, pid, ppid AS parent, path, cmdline, '' AS cwd, username AS uid FROM process_etw_events WHERE type = 'ProcessStart')
    SELECT e.time, e.pid, e.parent, e.path, e.cmdline, e.cwd, e.uid, a.agent_id, a.user AS agent_user, a.session_ref, 1 AS depth
