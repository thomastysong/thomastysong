# Fluent Bit DaemonSet fragment for the hawkbell node sensor.
#
# The node sensor writes one JSON record per line to its own stdout; the
# kubelet stores it in /var/log/containers like any other container log.
# This fragment picks out the sensor's container log, strips the CRI framing
# and parses the record. Merge it into the Fluent Bit Helm chart's config
# (config.inputs / config.filters) or a ConfigMap you mount.
#
# The tail DB MUST be on a hostPath: on an emptyDir it is lost with the pod,
# and with read_from_head a lost tail DB replays every file still on disk.
# Measured with the outbox inputs (hawkbell-inputs.yaml), not this fragment:
# 5,000 records delivered, tail DBs deleted, Fluent Bit restarted: all 5,000
# delivered again, 10,000 received (deploy/fluent-bit/VERIFIED.md,
# "Measurements added 2026-11-12"). hawkbell record ids are deterministic,
# so a destination that deduplicates on "id" absorbs replays.
#
# UNTESTED on a real cluster in this release (see docs/LIMITATIONS.md).
parsers:
  - name: hawkbell_ndjson
    format: json
    time_key: ts
    time_format: '%Y-%m-%dT%H:%M:%S.%L%z'
    time_keep: on

pipeline:
  inputs:
    - name: tail
      alias: hawkbell_node
      path: /var/log/containers/hawkbell-node-*_hawkbell_*.log
      multiline.parser: cri
      tag: hawkbell.k8s
      db: /var/lib/fluent-bit/hawkbell-node.db
      db.locking: false
      db.compare_filename: true
      read_from_head: true
      refresh_interval: 5
      buffer_max_size: 1M
      skip_long_lines: on
      storage.type: filesystem
  filters:
    - name: parser
      match: hawkbell.k8s
      key_name: message
      parser: hawkbell_ndjson
      reserve_data: off
    - name: rewrite_tag
      match: hawkbell.k8s
      rule: '$kind ^(activity|detection|inventory|posture|health|summary)$ hawkbell.$kind false'
