# spoor Fleet content: Opt-in exec-event reports.
#
# GENERATED by internal/fleetgen from the state table definitions and
# catalog 2026.11.11. Do not edit: regenerate with
#   go test ./internal/fleetgen -run TestGolden -update
# or write a copy for your hosts' paths with `spoor export fleet`.
# Heartbeat windows: sensor policy 30 minutes, every other spoor policy 24 hours.
#
# PRIVACY WARNING - OPT-IN EXAMPLE ONLY.
# These reports schedule osquery's evented process tables through Fleet. Every
# row carries the full command line, working directory and user of a process
# an AI agent started, and Fleet sends those rows to the Fleet server and to
# its log destination, outside spoor's privacy profiles (minimal, standard,
# full), its secret redaction and its exclusions. Command lines routinely
# contain tokens and passwords. This is why spoor's daemon reads the same
# tables locally over the osquery extension socket and applies its privacy
# policy before anything leaves the host. Deploy these only with a documented
# purpose, a retention limit at the log destination and, where it applies,
# your works council's or DPO's agreement.

- name: spoor opt-in - agent child processes (Linux, audit)
  description: 'OPT-IN, sends raw command lines to Fleet: processes started by an AI agent''s root process (depth 1) or by its direct children (depth 2), from process_events joined to spoor_agent_processes. Needs disable_events: false, disable_audit: false, audit_allow_process_events: true, audit_persist: true (command_line_flags; orbit restarts osquery when they change). A pid reused within 1 hour of the agent exiting can be misattributed.'
  query: |-
    WITH agents AS MATERIALIZED (
        SELECT CAST(pid AS INTEGER) AS pid, agent_id, user, session_ref
        FROM spoor_agent_processes
        WHERE CAST(running AS INTEGER) = 1 OR last_seen >= strftime('%Y-%m-%dT%H:%M:%S.000000Z', 'now', '-3600 seconds')),
      ev AS MATERIALIZED (SELECT time, pid, parent, path, cmdline, cwd, uid FROM process_events)
    SELECT e.time, e.pid, e.parent, e.path, e.cmdline, e.cwd, e.uid, a.agent_id, a.user AS agent_user, a.session_ref, 1 AS depth
    FROM ev e JOIN agents a ON e.parent = a.pid
    UNION ALL
    SELECT e.time, e.pid, e.parent, e.path, e.cmdline, e.cwd, e.uid, a.agent_id, a.user AS agent_user, a.session_ref, 2 AS depth
    FROM ev e JOIN ev c ON e.parent = c.pid JOIN agents a ON c.parent = a.pid;
  interval: 600
  platform: linux
  logging: differential_ignore_removals
  automations_enabled: true
  discard_data: true
  observer_can_run: false
