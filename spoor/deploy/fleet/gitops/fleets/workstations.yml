# Example fleet file, Fleet Premium only (fleets, per-fleet agent options,
# software deployment and policy automations are Premium). Hosts run fleetd
# 1.59 or later, so the "fleetd" profile also reads Fleet's ai_tools table.
# Not validated against a server: the verification server runs Fleet Free
# (deploy/fleet/VERIFIED.md records what its dry run said).
name: "💻 Workstations"
settings:
  secrets:
    - secret: $FLEET_WORKSTATIONS_ENROLL_SECRET
agent_options:
  path: ../../lib/agent-options.example.yml
controls:
  scripts:
    - path: ../../scripts/install-spoor.sh
    - path: ../../scripts/install-spoor.ps1
policies:
  - path: ../../lib/fleetd/policies.yml
  # Install automations: a host failing one of these gets the package.
  # The queries are the "spoor installed" label's, one OS each (a test in
  # internal/fleetgen keeps them in step with the generated label).
  - name: spoor installed (Linux deb)
    description: The spoor binary is installed. Fails on Debian-family hosts without it, which installs the deb.
    resolution: Fleet installs the spoor package automatically.
    query: SELECT 1 FROM file WHERE path IN ('/usr/bin/spoor', '/var/lib/spoor/state.db') LIMIT 1;
    platform: linux
    critical: false
    labels_include_any:
      - Ubuntu Linux
    install_software:
      package_path: ../../software/spoor-deb.package.yml
  - name: spoor installed (Linux rpm)
    description: The spoor binary is installed. Fails on Red Hat-family hosts without it, which installs the rpm.
    resolution: Fleet installs the spoor package automatically.
    query: SELECT 1 FROM file WHERE path IN ('/usr/bin/spoor', '/var/lib/spoor/state.db') LIMIT 1;
    platform: linux
    critical: false
    labels_include_any:
      - Red Hat Linux
      - CentOS Linux
      - Fedora Linux
    install_software:
      package_path: ../../software/spoor-rpm.package.yml
  - name: spoor installed (macOS)
    description: The spoor binary is installed. Fails on Macs without it, which installs the pkg.
    resolution: Fleet installs the spoor package automatically.
    query: SELECT 1 FROM file WHERE path IN ('/usr/local/bin/spoor', '/Library/Application Support/spoor/state.db') LIMIT 1;
    platform: darwin
    critical: false
    install_software:
      package_path: ../../software/spoor-pkg.package.yml
reports:
  - path: ../../lib/fleetd/reports.yml
software:
  packages:
    - path: ../../software/spoor-deb.package.yml
    - path: ../../software/spoor-rpm.package.yml
    - path: ../../software/spoor-pkg.package.yml
    - path: ../../software/spoor-msi.package.yml
