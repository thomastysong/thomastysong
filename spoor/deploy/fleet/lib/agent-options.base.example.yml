# spoor Fleet content: agent options example for the extension tier (no ATC).
#
# GENERATED by internal/fleetgen from the state table definitions and
# catalog 2026.11.11. Do not edit: regenerate with
#   go test ./internal/fleetgen -run TestGolden -update
# or write a copy for your hosts' paths with `spoor export fleet`.
# Heartbeat windows: sensor policy 30 minutes, every other spoor policy 24 hours.
#
# EXAMPLE for tier 3 (the spoor osquery extension): a typical base
# configuration (fleetgen.ExampleBaseAgentOptions) WITHOUT spoor's ATC
# tables. What matters is what is absent: osquery refuses the extension
# when ATC already provides the spoor_* tables ("Registry item
# spoor_agent_processes conflicts with another item of the same name"),
# so agent options for hosts that register the extension must not carry
# them; fleetgen.StripAgentOptions removes them from existing options.
# agent-options.example.yml is this base with the ATC fragment merged in
# (tier 2). Replace the base with your own options.

config:
  decorators:
    load:
      - SELECT uuid AS host_uuid FROM system_info;
      - SELECT hostname AS hostname FROM system_info;
  options:
    distributed_interval: 10
    distributed_plugin: tls
    distributed_tls_max_attempts: 3
    logger_tls_endpoint: /api/osquery/log
    logger_tls_period: 10
    pack_delimiter: /
overrides: {}
