# spoor catalog: editor extensions and plugins (VS Code family, JetBrains).
# Provenance and conventions are described at the top of agents.yaml.
#
# Extension ids were cross-checked with uber/ADR catalog.json (Apache-2.0)
# and the classification table of karmine05/agentic-detector as vendored in
# fleetdm/fleet orbit/pkg/table/ai_tools/internal/classify/kb.json (MIT).
# VS Code extension ids are case-insensitive; they are written here the way
# the marketplace shows them where known.
version: "2026.11.11"

products:
  - id: github-copilot
    name: GitHub Copilot
    vendor: GitHub
    kind: ide_extension
    # copilot-cli: Copilot in VS Code reads the CLI's ~/.copilot files.
    aliases: [copilot-cli]
    extension_ids: [GitHub.copilot, GitHub.copilot-chat]
    jetbrains_ids: [com.github.copilot]
    mcp:
      - {paths: ["~/.copilot/mcp-config.json"], format: mcpServers, scope: user}
    skills: ["~/.copilot/skills"]
    rules: ["./.github/copilot-instructions.md"]
    api_hosts: [api.githubcopilot.com]
    capabilities: [executes_shell, edits_files, mcp_client]
    notes: Agent mode hooks are the Copilot CLI hook files; see copilot-cli.
    sources:
      - research:adr-discovery.md#3
      - research:agent-surfaces-a.md#4
    unverified: [api_hosts]

  - id: claude-code-vscode
    name: Claude Code for VS Code
    vendor: Anthropic
    kind: ide_extension
    extension_ids: [anthropic.claude-code]
    jetbrains_ids: [com.anthropic.code.plugin]
    capabilities: [executes_shell, edits_files, mcp_client]
    notes: A front end for the Claude Code CLI; sessions, settings and hooks are the CLI's.
    sources: ["repo:fleetdm/fleet orbit/pkg/table/ai_tools/internal/classify/kb.json"]
    unverified: [jetbrains_ids]

  - id: chatgpt-vscode
    name: Codex (OpenAI) for VS Code
    vendor: OpenAI
    kind: ide_extension
    extension_ids: [openai.chatgpt]
    capabilities: [executes_shell, edits_files, mcp_client]
    notes: The Codex IDE extension; it shares ~/.codex with the CLI.
    sources: ["repo:fleetdm/fleet orbit/pkg/table/ai_tools/internal/classify/kb.json"]

  - id: continue
    name: Continue
    vendor: Continue
    kind: ide_extension
    # continue-cli shares ~/.continue.
    aliases: [continue-cli]
    extension_ids: [Continue.continue]
    jetbrains_ids: [com.github.continuedev.continueintellijextension]
    state_dirs: ["~/.continue"]
    mcp:
      - {paths: ["~/.continue/config.yaml", "~/.continue/config.json"], format: continue.yaml, scope: user}
      - {project_paths: [".continue/mcpServers/*.yaml", ".continue/mcpServers/*.json"], format: continue.yaml, scope: project}
    rules: ["./.continue/rules"]
    capabilities: [executes_shell, edits_files, mcp_client]
    sources:
      - research:adr-discovery.md#3
      - research:agent-surfaces-b.md#1b
    unverified: [rules]

  - id: cline
    name: Cline
    vendor: Cline
    kind: ide_extension
    aliases: [claude-dev]
    extension_ids: [saoudrizwan.claude-dev]
    mcp:
      - paths:
          darwin: ["~/Library/Application Support/Code/User/globalStorage/saoudrizwan.claude-dev/settings/cline_mcp_settings.json"]
          linux: ["~/.config/Code/User/globalStorage/saoudrizwan.claude-dev/settings/cline_mcp_settings.json"]
          windows: ['%APPDATA%\Code\User\globalStorage\saoudrizwan.claude-dev\settings\cline_mcp_settings.json']
        format: mcpServers
        scope: user
    rules: ["./.clinerules"]
    transcript:
      format: cline-json
      globs:
        darwin: ["~/Library/Application Support/Code/User/globalStorage/saoudrizwan.claude-dev/tasks/*/api_conversation_history.json"]
        linux: ["~/.config/Code/User/globalStorage/saoudrizwan.claude-dev/tasks/*/api_conversation_history.json"]
        windows: ['%APPDATA%\Code\User\globalStorage\saoudrizwan.claude-dev\tasks\*\api_conversation_history.json']
    hooks:
      user_paths: ["~/Documents/Cline/Hooks/*"]
      project_paths: [".clinerules/hooks/*"]
      notes: The editor hook directory needs the Hooks tab toggle. No spoor dialect.
    capabilities: [executes_shell, edits_files, browses, mcp_client]
    notes: Also published as a JetBrains plugin (marketplace number 28247).
    sources:
      - research:adr-discovery.md#2
      - https://raw.githubusercontent.com/perplexityai/numbat/main/docs/agent-coverage.md
    unverified: [transcript]

  - id: roo-code
    name: Roo Code
    vendor: Roo Code
    kind: ide_extension
    status: discontinued
    aliases: [roo-cline]
    extension_ids: [RooVeterinaryInc.roo-cline]
    mcp:
      - paths:
          darwin: ["~/Library/Application Support/Code/User/globalStorage/rooveterinaryinc.roo-cline/settings/mcp_settings.json"]
          linux: ["~/.config/Code/User/globalStorage/rooveterinaryinc.roo-cline/settings/mcp_settings.json"]
          windows: ['%APPDATA%\Code\User\globalStorage\rooveterinaryinc.roo-cline\settings\mcp_settings.json']
        format: mcpServers
        scope: user
      - {project_paths: [".roo/mcp.json"], format: mcpServers, scope: project}
    rules: ["./.roo/rules", "./.roorules"]
    capabilities: [executes_shell, edits_files, browses, mcp_client]
    notes: Shut down on 2026-05-15; Zoo Code is the community fork. An installed copy no longer receives fixes.
    sources: [research:agent-surfaces-b.md#1b]
    unverified: [rules]

  - id: zoo-code
    name: Zoo Code
    vendor: Zoo Code
    kind: ide_extension
    extension_ids: [ZooCodeOrganization.zoo-code]
    capabilities: [executes_shell, edits_files, browses, mcp_client]
    notes: Fork of Roo Code.
    sources: [research:agent-surfaces-b.md#1b]

  - id: kilo-code
    name: Kilo Code
    vendor: Kilo Code
    kind: ide_extension
    extension_ids: [kilocode.kilo-code]
    plugins: ["~/.kilo/extensions"]
    capabilities: [executes_shell, edits_files, browses, mcp_client]
    notes: Also published as a JetBrains plugin (marketplace number 28350).
    sources: [research:adr-discovery.md#3, "research:agent-surfaces-b.md#1b"]
    unverified: [plugins]

  - id: jetbrains-ai
    name: JetBrains AI Assistant
    vendor: JetBrains
    kind: ide_extension
    jetbrains_ids: [com.intellij.ml.llm]
    mcp:
      - {paths: {linux: ["~/.config/JetBrains/options/mcp.json"]}, scope: user}
    capabilities: [edits_files, mcp_client]
    sources: [research:adr-discovery.md#3]
    unverified: [mcp]

  - id: gemini-code-assist
    name: Gemini Code Assist
    vendor: Google
    kind: ide_extension
    extension_ids: [Google.geminicodeassist]
    capabilities: [edits_files, mcp_client]
    sources: ["repo:fleetdm/fleet orbit/pkg/table/ai_tools/internal/classify/kb.json"]

  - id: cody
    name: Sourcegraph Cody
    vendor: Sourcegraph
    kind: ide_extension
    extension_ids: [sourcegraph.cody-ai]
    jetbrains_ids: [com.sourcegraph.jetbrains]
    capabilities: [edits_files]
    sources: ["repo:fleetdm/fleet orbit/pkg/table/ai_tools/internal/classify/kb.json"]

  - id: windsurf-plugin
    name: Windsurf Plugin (Codeium)
    vendor: Cognition
    kind: ide_extension
    aliases: [codeium]
    extension_ids: [Codeium.codeium, Exafunction.windsurf, windsurf.windsurf]
    jetbrains_ids: [com.codeium.intellij]
    capabilities: [edits_files]
    sources: ["repo:fleetdm/fleet orbit/pkg/table/ai_tools/internal/classify/kb.json"]

  - id: tabnine
    name: Tabnine
    vendor: Tabnine
    kind: ide_extension
    extension_ids: [TabNine.tabnine-vscode]
    jetbrains_ids: [com.tabnine.TabNine]
    capabilities: [edits_files]
    sources: ["repo:fleetdm/fleet orbit/pkg/table/ai_tools/internal/classify/kb.json"]

  - id: supermaven
    name: Supermaven
    vendor: Supermaven
    kind: ide_extension
    extension_ids: [supermaven.supermaven]
    capabilities: [edits_files]
    sources: ["repo:fleetdm/fleet orbit/pkg/table/ai_tools/internal/classify/kb.json"]

  - id: amazon-q-ide
    name: Amazon Q Developer (IDE)
    vendor: Amazon Web Services
    kind: ide_extension
    extension_ids: [AmazonWebServices.amazon-q-vscode]
    jetbrains_ids: [amazon.q]
    capabilities: [executes_shell, edits_files, mcp_client]
    sources: ["repo:fleetdm/fleet orbit/pkg/table/ai_tools/internal/classify/kb.json"]

  - id: augment
    name: Augment Code
    vendor: Augment Code
    kind: ide_extension
    # auggie: the CLI of the same vendor.
    aliases: [auggie]
    extension_ids: [augment.vscode-augment]
    capabilities: [executes_shell, edits_files, mcp_client]
    sources: ["repo:fleetdm/fleet orbit/pkg/table/ai_tools/internal/classify/kb.json"]

  - id: blackbox-ai
    name: Blackbox AI
    vendor: Blackbox
    kind: ide_extension
    extension_ids: [Blackboxapp.blackbox]
    capabilities: [edits_files]
    sources: ["repo:fleetdm/fleet orbit/pkg/table/ai_tools/internal/classify/kb.json"]

  - id: codegpt
    name: CodeGPT
    vendor: CodeGPT
    kind: ide_extension
    extension_ids: [DanielSanMedium.dscodegpt]
    capabilities: [edits_files]
    sources: ["repo:fleetdm/fleet orbit/pkg/table/ai_tools/internal/classify/kb.json"]

  - id: qodo-gen
    name: Qodo Gen
    vendor: Qodo
    kind: ide_extension
    aliases: [codiumai]
    jetbrains_ids: [ai.codium.intellij]
    capabilities: [edits_files]
