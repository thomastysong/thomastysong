# Fluent Bit DaemonSet fragment for the spoor node sensor.
#
# The node sensor writes one JSON record per line to its own stdout; the
# kubelet stores it in /var/log/containers like any other container log.
# This fragment picks out the sensor's container log, strips the CRI framing
# and parses the record. Merge it into the Fluent Bit Helm chart's config
# (config.inputs / config.filters) or a ConfigMap you mount.
#
# The tail DB MUST be on a hostPath: on an emptyDir it is lost with the pod,
# and in testing a lost tail DB replayed every retained record (5,000
# delivered records became 10,000). spoor record ids are deterministic, so
# a destination that deduplicates on "id" absorbs replays.
#
# UNTESTED on a real cluster in this release (see docs/LIMITATIONS.md).
parsers:
  - name: spoor_ndjson
    format: json
    time_key: ts
    time_format: '%Y-%m-%dT%H:%M:%S.%L%z'
    time_keep: on

pipeline:
  inputs:
    - name: tail
      alias: spoor_node
      path: /var/log/containers/spoor-node-*_spoor_*.log
      multiline.parser: cri
      tag: spoor.k8s
      db: /var/lib/fluent-bit/spoor-node.db
      db.locking: false
      db.compare_filename: true
      read_from_head: true
      refresh_interval: 5
      buffer_max_size: 1M
      skip_long_lines: on
      storage.type: filesystem
  filters:
    - name: parser
      match: spoor.k8s
      key_name: message
      parser: spoor_ndjson
      reserve_data: off
    - name: rewrite_tag
      match: spoor.k8s
      rule: '$kind ^(activity|detection|inventory|posture|health|summary)$ spoor.$kind false'
