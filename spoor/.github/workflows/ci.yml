# spoor CI.
#
# NOTE: this file lives under the project directory (spoor/.github/...),
# where GitHub does not run it. Move it to the repository root's
# .github/workflows/ when spoor gets its own repository; until then, a copy
# at the root needs `defaults.run.working-directory: spoor` and
# `go-version-file: spoor/go.mod`. It has not run on GitHub yet: the jobs
# mirror the Makefile targets that were run locally (Linux).
#
# Actions are referenced by major version tags; pin them to commit SHAs for
# a release pipeline.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "0"

jobs:
  test:
    name: build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Git for Windows checks out with core.autocrlf=true. The shell scripts
      # and manifests must stay LF (packaging/.gitattributes and
      # deploy/kubernetes/.gitattributes say so for those trees; this covers
      # the rest of the checkout until the repository root has its own).
      - name: keep LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - name: gofmt
        if: runner.os == 'Linux'
        run: make fmt-check

  cross:
    name: cross-compile (${{ matrix.goos }}/${{ matrix.goarch }})
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath -buildvcs=false -o /dev/null ./cmd/spoor
          go vet ./...

  rules:
    name: rules test, lint and bench gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make rules
      - name: scenario benchmark gate
        run: make bench
      - uses: actions/upload-artifact@v4
        with:
          name: bench-report
          path: dist/bench

  packages:
    name: packages and container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.49.0 && echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: deb and rpm
        run: make package
      - name: images used by the container tests
        run: |
          docker pull mirror.gcr.io/library/redis:7
          docker pull mirror.gcr.io/library/rockylinux:9
      - name: node sensor image, in-image hook mode, deb/rpm install and removal
        run: SPOOR_E2E_CONTAINER=1 go test -tags e2e ./test/e2e -run 'Container|Package' -count=1 -v -timeout 30m

  e2e-linux:
    name: end-to-end (Fluent Bit, osquery, Fleet scripts, CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Fluent Bit image
        run: docker pull fluent/fluent-bit:latest
      - name: osquery
        # UNVERIFIED download path: check https://osquery.io/downloads for the
        # current package before relying on this step.
        run: |
          curl -fsSL -o /tmp/osquery.deb https://pkg.osquery.io/deb/osquery_5.19.0-1.linux_amd64.deb
          sudo dpkg -i /tmp/osquery.deb
          sudo systemctl stop osqueryd || true
          sudo systemctl stop auditd || true
      - name: CLI end to end
        run: go test -tags e2e ./test/e2e -run 'CLI' -count=1 -v
      - name: Fluent Bit transport contract
        run: SPOOR_E2E_FLUENTBIT=1 go test -tags e2e ./test/e2e -run 'FluentBit' -count=1 -v -timeout 20m
      - name: Fleet install scripts
        run: |
          docker pull mirror.gcr.io/library/redis:7
          SPOOR_E2E_FLEET=1 go test -tags e2e ./test/e2e -run 'FleetInstallScripts' -count=1 -v
      - name: osquery exec provider (root, audit netlink)
        run: sudo -E env "PATH=$PATH" SPOOR_E2E_OSQUERY=1 SPOOR_OSQUERYD=/opt/osquery/bin/osqueryd go test ./internal/procmon -run 'TestE2EOsquery' -count=1 -v
