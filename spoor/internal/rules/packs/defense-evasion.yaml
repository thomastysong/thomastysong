# Defense evasion: stopping or blinding security tooling, the sensor and
# the agent's own guard rails. ATT&CK v19+ moved most of these to the
# Defense Impairment tactic (T1685, T1686, T1690); the revoked T1562 ids
# are not used.
pack: defense-evasion
version: "2026.11.0"
description: Security tooling, the sensor, agent guard rails, logs and path tricks.
rules:
  - id: SPR-EVADE-001
    title: Security tool stopped or killed
    description: >-
      A command stops, unloads or kills an EDR agent, osquery, Fleet's
      orbit, Fluent Bit, auditd, Santa or this sensor. An agent asked to
      write code does not need to; an agent told by injected content to
      "fix" a monitoring problem will try.
    kind: activity
    class: finding
    severity: high
    confidence: high
    maturity: stable
    category: defense_evasion
    tags: [attack.t1685, attack.t1685.007, owasp.asi10]
    references:
      - "research/threats.md section 2 row 25: agents disabled monitoring (Oct 2026)"
      - "research/threats.md section 3 R37"
    falsepositives:
      - "IT administrators restarting their own agents"
      - "Operations work on the monitoring stack itself (restarting osqueryd after a config change)"
    when:
      type: [tool.pre, process.exec]
    match:
      shell.defense_evasion: stop_security_tool
    response: ask
    dedup: [shell.argv]
    evidence: [target.command, shell.defense_evasion]
    remedy: Confirm with the user; security tooling should be restarted by its owner, not by an agent.
    tests:
      - name: systemctl stop falcon
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "systemctl stop falcon-sensor" } }
        expect: match
      - name: pkill osqueryd
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "pkill -f \"osqueryd --flagfile\"" } }
        expect: match
      - name: status query
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "systemctl status osqueryd" } }
        expect: no_match
      - name: stopping an app container
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "docker stop web-1" } }
        expect: no_match
      - name: sensor hooks uninstalled
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "spoor hooks uninstall --agent claude-code" } }
        expect: match
      - name: usage of the uninstall subcommand
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "spoor hooks uninstall --help" } }
        expect: no_match
      - name: osqueryctl reads only its first word, so a trailing --help still stops osqueryd
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "sudo osqueryctl stop --help" } }
        expect: match
      - name: osqueryctl stop with -h
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "osqueryctl stop -h" } }
        expect: match
      - name: osqueryctl usage
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "osqueryctl --help" } }
        expect: no_match
      - name: orbit stop with a trailing --help
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "orbit stop --help" } }
        expect: match

  - id: SPR-EVADE-002
    title: Sensor files deleted or modified
    description: >-
      A command deletes, writes, moves, creates or changes the permissions
      of spoor's own configuration, state, spool, socket or binary at its
      installed locations: the system directories of internal/platform
      (/etc/spoor, /var/lib/spoor, /run/spoor on Linux; /Library/Application
      Support/spoor and /var/run/spoor on macOS; C:\ProgramData\spoor on
      Windows), the per-user directories (~/.local/state/spoor,
      ~/Library/Application Support/spoor, %LOCALAPPDATA%\spoor), the
      binary, the service unit and the launchd plist. Creating the file
      "disabled" in the configuration directory is the documented kill
      switch. Whoever can change the sensor decides what it reports. A link
      or bind mount that reaches the sensor's configuration, state, spool,
      socket or service files counts (shell.aliases), because a later write
      through the new name changes them without naming them; a link to the
      binary or the logs does not. A write through a link made earlier on
      the same command line is also recorded under the path it reaches.
      The path list is
      explicit and anchored because the sensor_files path class and the
      analyser's sensor_tamper fact also match any path that merely
      contains these names, which in the benign replay meant this project's
      own source tree, packaging staging roots and test fixtures (8 false
      alerts before tuning). The anchors hold because every path the rule
      reads is in canonical form (shell.writes, shell.deletes,
      shell.changes, path.targets: "." and ".." resolved, duplicate
      separators collapsed, /proc/<id>/root stripped, joined with a
      directory a cd on the same line set, a one-character bracket glob
      replaced by its character, Windows drive paths with backslashes and
      the trailing dots Win32 drops removed). /bin, /sbin and /lib are
      listed beside their /usr counterparts because they are the same
      directories on merged-/usr systems, and the canonical form does not
      follow symlinks. Two spellings need more than one canonical string:
      a glob ("/etc/spo?r/disabled", "/e*/spoor/x") and a shell path
      relative to the session directory ("touch disabled" in /etc/spoor).
      The sensor_self path class covers both: it holds the same locations,
      rooted, and classify matches globs against them and joins relative
      paths with the session directory. A bare wildcard in the sensor's own
      name ("/usr/local/bin/*", "/var/log/*") is not enough for that class.
    kind: activity
    class: alert
    severity: critical
    confidence: high
    maturity: stable
    category: defense_evasion
    tags: [attack.t1685, attack.t1685.007, atlas.aml.t0138, owasp.asi10]
    references:
      - "research/threats.md section 2 row 25"
      - "research/threats.md section 3 R37"
    falsepositives:
      - "Installing, upgrading or uninstalling the sensor from an agent session"
      - "A link or read-only bind mount of the sensor's configuration made to inspect it"
    when:
      type: [tool.pre, process.exec]
    match:
      any:
        - shell.deletes|any_re: '(?i)^(/etc/spoor|/var/lib/spoor|(/private)?/var/run/spoor|/run/spoor|/var/log/spoor|/opt/spoor|/(usr/(local/)?)?(s?bin|lib|libexec)/spoor|(/usr/lib|/lib|/etc)/systemd/system/spoor\.service(\.d)?|/Library/(Application Support|Logs)/spoor|/Library/LaunchDaemons/com\.github\.thomastysong\.spoor\.plist|[a-z]:\\(program files|programdata)\\spoor|(%(programdata|programfiles|localappdata)%|\$env:(programdata|programfiles|localappdata))[\\/]spoor|(~|\$\{?home\}?|/root|/var/root|/home/[^/]+|/Users/[^/]+)/(\.local/state|Library/Application Support)/spoor|(~|\$\{?home\}?|%userprofile%|\$env:userprofile|[a-z]:\\users\\[^\\]+)[\\/]appdata[\\/]local[\\/]spoor)([/\\]|$)'
        - shell.writes|any_re: '(?i)^(/etc/spoor|/var/lib/spoor|(/private)?/var/run/spoor|/run/spoor|/var/log/spoor|/opt/spoor|/(usr/(local/)?)?(s?bin|lib|libexec)/spoor|(/usr/lib|/lib|/etc)/systemd/system/spoor\.service(\.d)?|/Library/(Application Support|Logs)/spoor|/Library/LaunchDaemons/com\.github\.thomastysong\.spoor\.plist|[a-z]:\\(program files|programdata)\\spoor|(%(programdata|programfiles|localappdata)%|\$env:(programdata|programfiles|localappdata))[\\/]spoor|(~|\$\{?home\}?|/root|/var/root|/home/[^/]+|/Users/[^/]+)/(\.local/state|Library/Application Support)/spoor|(~|\$\{?home\}?|%userprofile%|\$env:userprofile|[a-z]:\\users\\[^\\]+)[\\/]appdata[\\/]local[\\/]spoor)([/\\]|$)'
        # touch, mkdir, chmod, chown, chattr, setfacl, icacls, New-Item,
        # Set-Acl, the source of a move or rename, a mount point, and the
        # existing path a new link or bind mount points at.
        - shell.changes|any_re: '(?i)^(/etc/spoor|/var/lib/spoor|(/private)?/var/run/spoor|/run/spoor|/var/log/spoor|/opt/spoor|/(usr/(local/)?)?(s?bin|lib|libexec)/spoor|(/usr/lib|/lib|/etc)/systemd/system/spoor\.service(\.d)?|/Library/(Application Support|Logs)/spoor|/Library/LaunchDaemons/com\.github\.thomastysong\.spoor\.plist|[a-z]:\\(program files|programdata)\\spoor|(%(programdata|programfiles|localappdata)%|\$env:(programdata|programfiles|localappdata))[\\/]spoor|(~|\$\{?home\}?|/root|/var/root|/home/[^/]+|/Users/[^/]+)/(\.local/state|Library/Application Support)/spoor|(~|\$\{?home\}?|%userprofile%|\$env:userprofile|[a-z]:\\users\\[^\\]+)[\\/]appdata[\\/]local[\\/]spoor)([/\\]|$)'
        # A link or bind mount that reaches the sensor's configuration,
        # state, spool, socket or service definitions: a later write
        # through the new name, in this tool call or the next, changes
        # them without naming them. The binary and the logs are left out:
        # linking them elsewhere (the CLI onto the PATH, a log into a
        # scratch directory) is how they are used.
        - shell.aliases|any_re: '(?i)^(/etc/spoor|/var/lib/spoor|(/private)?/var/run/spoor|/run/spoor|/opt/spoor|(/usr/lib|/lib|/etc)/systemd/system/spoor\.service(\.d)?|/Library/Application Support/spoor|/Library/LaunchDaemons/com\.github\.thomastysong\.spoor\.plist|[a-z]:\\programdata\\spoor|(%(programdata|localappdata)%|\$env:(programdata|localappdata))[\\/]spoor|(~|\$\{?home\}?|/root|/var/root|/home/[^/]+|/Users/[^/]+)/(\.local/state|Library/Application Support)/spoor|(~|\$\{?home\}?|%userprofile%|\$env:userprofile|[a-z]:\\users\\[^\\]+)[\\/]appdata[\\/]local[\\/]spoor)([/\\]|$)'
        # The same locations as a path class: globs that can reach them and
        # shell paths relative to the session directory.
        - shell.delete_classes|contains: sensor_self
        - shell.write_classes|contains: sensor_self
        - shell.change_classes|contains: sensor_self
        - all:
            - tool.kind|in: [file_write, file_edit]
            - path.targets|any_re: '(?i)^(/etc/spoor|/var/lib/spoor|(/private)?/var/run/spoor|/run/spoor|/var/log/spoor|/opt/spoor|/(usr/(local/)?)?(s?bin|lib|libexec)/spoor|(/usr/lib|/lib|/etc)/systemd/system/spoor\.service(\.d)?|/Library/(Application Support|Logs)/spoor|/Library/LaunchDaemons/com\.github\.thomastysong\.spoor\.plist|[a-z]:\\(program files|programdata)\\spoor|(%(programdata|programfiles|localappdata)%|\$env:(programdata|programfiles|localappdata))[\\/]spoor|(~|\$\{?home\}?|/root|/var/root|/home/[^/]+|/Users/[^/]+)/(\.local/state|Library/Application Support)/spoor|(~|\$\{?home\}?|%userprofile%|\$env:userprofile|[a-z]:\\users\\[^\\]+)[\\/]appdata[\\/]local[\\/]spoor)([/\\]|$)'
    response: ask
    dedup: [shell.deletes, shell.writes, shell.changes, shell.aliases, path.targets]
    evidence: [target.command, target.path, path.targets, shell.deletes, shell.writes, shell.changes, shell.aliases, shell.proc_root, path.proc_root]
    remedy: Restore the sensor from its package and find out why the agent touched it.
    tests:
      - name: state directory removed
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "rm -rf /var/lib/spoor" } }
        expect: match
      - name: config directory removed
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "rm -rf /etc/spoor" } }
        expect: match
      - name: kill switch created with touch
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "sudo touch /etc/spoor/disabled" } }
        expect: match
      - name: kill switch created as a directory
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "sudo mkdir /etc/spoor/disabled" } }
        expect: match
      - name: kill switch in the per-user directory
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "touch ~/.local/state/spoor/disabled" } }
        expect: match
      - name: binary made unexecutable
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "sudo chmod 000 /usr/bin/spoor" } }
        expect: match
      - name: configuration moved away
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "sudo mv /etc/spoor/spoor.toml /tmp/x" } }
        expect: match
      - name: macOS per-user state directory removed
        event: { type: tool.pre, host: { os: darwin }, tool: { kind: shell, name: Bash }, target: { command: "rm -rf ~/Library/Application\\ Support/spoor" } }
        expect: match
      - name: macOS per-user spool removed by absolute path
        event: { type: tool.pre, host: { os: darwin }, tool: { kind: shell, name: Bash }, target: { command: "rm -rf '/Users/tester/Library/Application Support/spoor/spool'" } }
        expect: match
      - name: macOS hook socket removed
        event: { type: tool.pre, host: { os: darwin }, tool: { kind: shell, name: Bash }, target: { command: "rm -f /var/run/spoor/hook.sock" } }
        expect: match
      - name: macOS kill switch
        event: { type: tool.pre, host: { os: darwin }, tool: { kind: shell, name: Bash }, target: { command: "sudo touch '/Library/Application Support/spoor/disabled'" } }
        expect: match
      - name: Windows per-user spool removed
        event: { type: tool.pre, host: { os: windows }, tool: { kind: shell, name: PowerShell }, target: { command: "Remove-Item -Recurse -Force $env:LOCALAPPDATA\\spoor" } }
        expect: match
      - name: Windows kill switch
        event: { type: tool.pre, host: { os: windows }, tool: { kind: shell, name: PowerShell }, target: { command: "New-Item -ItemType File -Path C:\\ProgramData\\spoor\\disabled" } }
        expect: match
      - name: reading the sensor config
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "cat /etc/spoor/spoor.yaml" } }
        expect: no_match
      - name: project build output removed
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "rm -rf ./bin ./dist" } }
        expect: no_match
      - name: sensor built in its own source tree
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "go build -o bin/spoor ./cmd/spoor && cp packaging/systemd/spoor.service /tmp/pkgroot/etc/systemd/system/" } }
        expect: no_match
      - name: installed location named in a script and a staging directory created
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "mkdir -p \"$V/bin/Program Files/spoor\"; bash -c 'C:/ProgramData/spoor/spoor.exe hook'; cp /etc/spoor/spoor.yaml /tmp/pkgroot/etc/spoor/" } }
        expect: no_match
      - name: package staging root that mirrors the installed layout
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "mkdir -p /tmp/pkgroot/etc/spoor && touch /tmp/pkgroot/etc/spoor/disabled && chmod 755 /tmp/pkgroot/usr/bin/spoor" } }
        expect: no_match
      - name: user spool directory removed
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "rm -rf ~/.local/state/spoor" } }
        expect: match
      - name: kill switch with a doubled separator
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "touch /etc//spoor/disabled" } }
        expect: match
      - name: data directory redirected with a doubled separator
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "echo 'data_dir: /dev/null' > /etc//spoor/spoor.yaml" } }
        expect: match
      - name: configuration edited in place with a doubled separator
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "sed -i 's/guard/off/' /etc//spoor/spoor.yaml" } }
        expect: match
      - name: binary replaced with a doubled separator
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "cp /bin/true /usr//bin/spoor" } }
        expect: match
      - name: binary removed with a doubled separator
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "rm -f /usr//bin/spoor" } }
        expect: match
      - name: state database truncated with a doubled separator
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "truncate -s0 /var//lib/spoor/state.db" } }
        expect: match
      - name: kill switch through dot segments
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "touch /etc/./x/../spoor/disabled" } }
        expect: match
      - name: kill switch through the process root
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "touch /proc/self/root/etc/spoor/disabled" } }
        expect: match
      - name: configuration removed through another process's root
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "rm -rf /proc/1/root/etc/spoor" } }
        expect: match
      - name: kill switch created relative to a cd
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "cd /etc/spoor && touch disabled" } }
        expect: match
      - name: configuration directory removed relative to a cd
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "cd /etc && rm -rf spoor" } }
        expect: match
      - name: Write tool on the kill switch with a doubled separator
        event: { type: tool.pre, tool: { kind: file_write, name: Write }, target: { path: /etc//spoor/disabled } }
        expect: match
      - name: Write tool on the configuration through the process root
        event: { type: tool.pre, tool: { kind: file_write, name: Write }, target: { path: /proc/self/root/etc/spoor/spoor.yaml } }
        expect: match
      - name: symlink to the configuration directory
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "ln -s /etc/spoor /tmp/s" } }
        expect: match
      - name: kill switch through a symlink made on the same line
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "ln -s /etc/spoor /tmp/s && echo x > /tmp/s/disabled" } }
        expect: match
      - name: kill switch through a bind mount made on the same line
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "mount --bind /etc/spoor /mnt/x && touch /mnt/x/disabled" } }
        expect: match
      - name: sensor CLI linked onto the PATH
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "ln -sf /usr/bin/spoor ~/.local/bin/spoor" } }
        expect: no_match
      - name: configuration linked into the project
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "ln -s /etc/spoor/spoor.yaml ./spoor.yaml" } }
        expect: match
      - name: log linked into a scratch directory
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "ln -sf /var/log/spoor/spoor.log /tmp/spoor.log" } }
        expect: no_match
      - name: bind mount of the configuration directory elsewhere
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "mount --bind /etc/spoor /mnt/ro-view" } }
        expect: match
      - name: configuration replaced by a link
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "ln -sf /tmp/evil.yaml /etc/spoor/spoor.yaml" } }
        expect: match
      - name: bind mount over the configuration directory
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "mount --bind /tmp/empty /etc/spoor" } }
        expect: match
      - name: binary on a merged-usr alias
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "cp /bin/true /bin/spoor" } }
        expect: match
      - name: Windows kill switch with dot segments
        event: { type: tool.pre, host: { os: windows }, tool: { kind: shell, name: PowerShell }, target: { command: "New-Item -ItemType File -Path C:\\ProgramData\\.\\spoor\\disabled" } }
        expect: match
      - name: Windows kill switch in an extended-length path
        event: { type: tool.pre, host: { os: windows }, tool: { kind: file_write, name: Write }, target: { path: "\\\\?\\C:\\ProgramData\\spoor\\disabled" } }
        expect: match
      - name: reading the sensor config with a doubled separator
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "cat /etc//spoor/spoor.yaml" } }
        expect: no_match
      - name: staging root reached by a cd
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "cd /tmp/pkgroot && mkdir -p etc/spoor && touch etc/spoor/disabled" } }
        expect: no_match
      - name: cd inside a subshell does not last
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "(cd /etc/spoor && ls); touch disabled" } }
        expect: no_match
      - name: an ordinary symlink
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "ln -sf /usr/bin/python3 ~/.local/bin/python" } }
        expect: no_match
      - name: kill switch through a one-character bracket glob
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "touch /etc/[s]poor/disabled" } }
        expect: match
      - name: kill switch through a question-mark glob
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "touch /etc/spo?r/disabled" } }
        expect: match
      - name: kill switch through a star glob in a parent directory
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "touch /e*/spoor/disabled" } }
        expect: match
      - name: every program in a bin directory made executable
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "chmod +x /usr/local/bin/*" } }
        expect: no_match
      - name: old logs removed
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "rm -f /var/log/*.gz /var/log/*/*.1" } }
        expect: no_match
      - name: kill switch relative to the session directory
        event: { type: tool.pre, session: { cwd: /etc/spoor }, tool: { kind: shell, name: Bash }, target: { command: "touch disabled" } }
        expect: match
      - name: state removed after a relative cd from the session directory
        event: { type: tool.pre, session: { cwd: /var/lib }, tool: { kind: shell, name: Bash }, target: { command: "cd spoor && rm -f state.db" } }
        expect: match
      - name: kill switch through dot segments from a project directory
        event: { type: tool.pre, session: { cwd: /home/u/proj }, tool: { kind: shell, name: Bash }, target: { command: "touch ../../../etc/spoor/disabled" } }
        expect: match
      - name: a file named disabled in a project
        event: { type: tool.pre, session: { cwd: /home/u/proj }, tool: { kind: shell, name: Bash }, target: { command: "touch disabled && rm -f state.db" } }
        expect: no_match
      - name: kill switch through a process root behind a variable
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "touch /proc/$$/root/etc/spoor/disabled" } }
        expect: match
      - name: kill switch created with install -d
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "install -d /etc/spoor/disabled" } }
        expect: match
      - name: Windows kill switch created with md
        event: { type: tool.pre, host: { os: windows }, tool: { kind: shell, name: PowerShell }, target: { command: "md C:\\ProgramData\\spoor\\disabled" } }
        expect: match
      - name: Windows kill switch created with cmd's mkdir
        event: { type: tool.pre, host: { os: windows }, tool: { kind: shell, name: cmd }, target: { command: "mkdir C:\\ProgramData\\spoor\\disabled" } }
        expect: match
      - name: Windows kill switch with a trailing dot Win32 drops
        event: { type: tool.pre, host: { os: windows }, tool: { kind: shell, name: PowerShell }, target: { command: "New-Item C:\\ProgramData\\spoor.\\disabled" } }
        expect: match
      - name: Windows configuration removed through the local admin share
        event: { type: tool.pre, host: { os: windows }, tool: { kind: shell, name: PowerShell }, target: { command: "Remove-Item -Recurse \\\\localhost\\C$\\ProgramData\\spoor" } }
        expect: match
      - name: Windows configuration removed by a root path without a drive
        event: { type: tool.pre, host: { os: windows }, session: { cwd: "C:\\Users\\u\\repo" }, tool: { kind: shell, name: PowerShell }, target: { command: "Remove-Item -Recurse \\ProgramData\\spoor" } }
        expect: match

  - id: SPR-EVADE-003
    title: Managed agent policy written or removed
    description: >-
      A tool or command writes or deletes a managed (administrator) policy
      file of an agent: /etc/claude-code/managed-settings.json,
      /etc/codex/requirements.toml, C:\ProgramData\ClaudeCode\... Managed
      policy is where an organisation pins its hooks and permission rules;
      an agent changing it is switching off its own supervision.
    kind: activity
    class: alert
    severity: critical
    confidence: high
    maturity: stable
    category: defense_evasion
    tags: [attack.t1685.007, atlas.aml.t0081, owasp.asi10]
    references:
      - "research/threats.md section 2 row 11: CVE-2026-35603 (world-writable managed-settings.json)"
      - "research/threats.md section 3 R36"
    falsepositives:
      - "An administrator deploying policy from an agent session"
    when:
      type: [tool.pre, process.exec]
    match:
      any:
        - shell.write_classes: agent_managed_policy
        - shell.delete_classes: agent_managed_policy
        - all:
            - tool.kind|in: [file_write, file_edit]
            - path.classes: agent_managed_policy
    response: ask
    dedup: [target.path, shell.writes, shell.deletes]
    evidence: [target.path, target.command, shell.writes, shell.deletes]
    remedy: Restore the managed policy from configuration management; it should only change through MDM or Fleet.
    tests:
      - name: managed settings overwritten
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "echo '{}' > /etc/claude-code/managed-settings.json" } }
        expect: match
      - name: managed settings deleted
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "rm /etc/claude-code/managed-settings.json" } }
        expect: match
      - name: Write tool on managed settings
        event: { type: tool.pre, tool: { kind: file_write, name: Write }, target: { path: /etc/claude-code/managed-settings.json } }
        expect: match
      - name: reading managed settings
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "cat /etc/claude-code/managed-settings.json" } }
        expect: no_match
      - name: user settings edited
        event: { type: tool.pre, tool: { kind: file_edit, name: Edit }, target: { path: /home/tester/.claude/settings.json } }
        expect: no_match
      - name: managed settings overwritten with a doubled separator
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "echo '{}' > /etc//claude-code/managed-settings.json" } }
        expect: match
      - name: managed settings overwritten through another process's root
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "echo '{}' > /proc/1/root/etc/claude-code/managed-settings.json" } }
        expect: match
      - name: managed settings deleted relative to a cd
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "cd /etc/claude-code && rm managed-settings.json" } }
        expect: match
      - name: Write tool on managed settings through dot segments
        event: { type: tool.pre, tool: { kind: file_write, name: Write }, target: { path: /etc/x/../claude-code/./managed-settings.json } }
        expect: match
      - name: Write tool on managed settings through the process root
        event: { type: tool.pre, tool: { kind: file_write, name: Write }, target: { path: /proc/self/root/etc/claude-code/managed-settings.json } }
        expect: match

  - id: SPR-EVADE-004
    title: Agent hook configuration edited from the shell
    description: >-
      A shell command rewrites an agent settings or hooks file (sed -i, jq
      ... > settings.json, deleting a hook script). Edits through the
      agent's own file tools are visible as diffs; shell rewrites of hook
      configuration are how a guard gets removed quietly.
    kind: activity
    class: finding
    severity: medium
    confidence: medium
    maturity: experimental
    category: defense_evasion
    tags: [attack.t1685.007, atlas.aml.t0081, owasp.asi10]
    references:
      - "research/threats.md section 3 R36 (removal of managed hook entries)"
    falsepositives:
      - "Scripts that update a settings file the user asked to change"
    when:
      type: [tool.pre, process.exec]
    match:
      any:
        - shell.defense_evasion: agent_hook_tamper
        - shell.delete_classes: agent_hook
    allow:
      shell.write_classes: agent_managed_policy
    dedup: [shell.writes, shell.deletes]
    evidence: [target.command, shell.writes, shell.deletes]
    remedy: Diff the settings file and confirm the hook entries are intact.
    tests:
      - name: sed deletes the spoor hook
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "sed -i '/spoor/d' ~/.claude/settings.json" } }
        expect: match
      - name: hook script removed
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "rm ~/.claude/hooks/spoor.sh" } }
        expect: match
      - name: reading settings
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "jq .hooks ~/.claude/settings.json" } }
        expect: no_match
      - name: editing project source with sed
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "sed -i 's/foo/bar/' internal/config/config.go" } }
        expect: no_match
      - name: hook settings linked into a dotfiles directory
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "ln -s ~/.claude/settings.json ~/dotfiles/claude-settings.json" } }
        expect: no_match
      - name: hook settings edited through a link made on the same line
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "ln -s ~/.claude/settings.json /tmp/c.json && echo '{}' > /tmp/c.json" } }
        expect: match

  - id: SPR-EVADE-005
    title: Operating-system security control disabled
    description: >-
      Gatekeeper, SIP, SELinux, Windows Defender, the host firewall or the
      audit subsystem is switched off.
    kind: activity
    class: finding
    severity: high
    confidence: high
    maturity: stable
    category: defense_evasion
    tags: [attack.t1685, attack.t1686, owasp.asi10]
    references:
      - "research/threats.md section 3 R37"
    falsepositives:
      - "Disposable lab machines"
    when:
      type: [tool.pre, process.exec]
    match:
      shell.defense_evasion|contains_any: [disable_gatekeeper, disable_sip, defender_tamper, firewall_disable, selinux_disable, audit_disable]
    dedup: [shell.defense_evasion]
    evidence: [target.command, shell.defense_evasion]
    remedy: Re-enable the control and find out what the agent was trying to get past.
    tests:
      - name: setenforce 0
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "setenforce 0" } }
        expect: match
      - name: Defender realtime off
        event: { type: tool.pre, tool: { kind: shell, name: PowerShell }, target: { command: "Set-MpPreference -DisableRealtimeMonitoring $true" } }
        expect: match
      - name: firewall status
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "ufw status verbose" } }
        expect: no_match
      - name: selinux mode query
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "getenforce" } }
        expect: no_match

  - id: SPR-EVADE-006
    title: Shell history or system logs cleared
    description: >-
      History is cleared or switched off (history -c, unset HISTFILE,
      deleting the history file) or system logs are vacuumed or deleted.
    kind: activity
    class: finding
    severity: medium
    confidence: high
    maturity: stable
    category: defense_evasion
    tags: [attack.t1070.003, attack.t1690, attack.t1685.006, atlas.aml.t0138]
    references:
      - "research/threats.md section 3 R37 (unset HISTFILE)"
    falsepositives:
      - "Disk clean-up on a build machine"
    when:
      type: [tool.pre, process.exec]
    match:
      shell.defense_evasion|contains_any: [history_clear, log_clear]
    dedup: [shell.defense_evasion]
    evidence: [target.command, shell.defense_evasion]
    remedy: Check what ran just before the clean-up.
    tests:
      - name: unset HISTFILE
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "unset HISTFILE" } }
        expect: match
      - name: journal vacuum
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "journalctl --vacuum-time=1s" } }
        expect: match
      - name: reading the journal
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "journalctl -u nginx --since today" } }
        expect: no_match
      - name: listing history
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "history | tail -20" } }
        expect: no_match

  - id: SPR-EVADE-007
    title: Sandbox switched off for a tool call
    description: >-
      The agent asked to run a shell command outside its sandbox
      (dangerouslyDisableSandbox). Users do allow this for Docker or network
      work, so it is a signal; after a refusal it is part of SPR-SEQ-003.
    kind: activity
    class: signal
    severity: medium
    confidence: high
    maturity: stable
    category: defense_evasion
    tags: [attack.t1685.007, owasp.asi10]
    references:
      - "research/threats.md section 2 row 24 (dangerouslyDisableSandbox after a deny)"
      - "research/threats.md section 3 R36"
    falsepositives:
      - "Commands that legitimately need network or file access outside the sandbox (package installs, docker)"
    when:
      type: tool.pre
    match:
      tool.input_keys: dangerouslyDisableSandbox
    evidence: [target.command, tool.input_keys]
    remedy: No action on its own.
    tests:
      - name: sandbox disabled
        event: { type: tool.pre, tool: { kind: shell, name: Bash, input_keys: [command, dangerouslyDisableSandbox] }, target: { command: "docker ps" } }
        expect: match
      - name: ordinary call
        event: { type: tool.pre, tool: { kind: shell, name: Bash, input_keys: [command, description] }, target: { command: "docker ps" } }
        expect: no_match
      - name: other tool
        event: { type: tool.pre, tool: { kind: file_read, name: Read, input_keys: [file_path] }, target: { path: /home/tester/project/a.go } }
        expect: no_match

  - id: SPR-EVADE-008
    title: Agent configuration written to disable hooks or the sandbox
    description: >-
      Content written to an agent or IDE control file switches hooks off
      (disableAllHooks), disables the sandbox or approves every tool. That
      removes the guard rails for every later session.
    kind: activity
    class: finding
    severity: high
    confidence: high
    maturity: stable
    category: defense_evasion
    tags: [attack.t1685.007, atlas.aml.t0081, owasp.asi10]
    references:
      - "research/threats.md section 3 R36, R08"
    falsepositives:
      - "A personal sandbox configured on purpose"
    when:
      type: tool.pre
    match:
      write.autorun_kinds|contains_any: [hooks_disabled, sandbox_disabled]
    dedup: [target.path]
    evidence: [target.path, write.autorun_kinds]
    remedy: Revert the setting; if it is wanted, set it in managed policy where it is reviewed.
    tests:
      - name: disableAllHooks written
        event:
          type: tool.pre
          tool: { kind: file_edit, name: Edit }
          target: { path: /home/tester/.claude/settings.json }
          content: { tool_input: { file_path: /home/tester/.claude/settings.json, old_string: "{", new_string: "{\"disableAllHooks\": true," } }
        expect: match
      - name: model setting written
        event:
          type: tool.pre
          tool: { kind: file_edit, name: Edit }
          target: { path: /home/tester/.claude/settings.json }
          content: { tool_input: { file_path: /home/tester/.claude/settings.json, old_string: "{", new_string: "{\"model\": \"sonnet\"," } }
        expect: no_match
      - name: same text in a source file
        event:
          type: tool.pre
          tool: { kind: file_write, name: Write }
          target: { path: /home/tester/project/docs/settings.md }
          content: { file_content: "Set disableAllHooks to true to turn hooks off." }
        expect: no_match

  - id: SPR-EVADE-009
    title: Control file path spelled to evade matching
    description: >-
      The target differs from an agent control file only by case, a
      trailing dot or space, an NTFS alternate data stream or an 8.3 short
      name. On Windows and macOS those name the same file, which is how
      .cUrsor/mcp.json and .mcp.json. slipped past approval checks.
    kind: activity
    class: alert
    severity: high
    confidence: high
    maturity: stable
    category: defense_evasion
    tags: [atlas.aml.t0081, owasp.asi05]
    references:
      - "research/threats.md section 2 row 5: CVE-2025-59944 (case bypass)"
      - "research/threats.md section 2 row 21: .mcp.json. trailing-dot bypass"
      - "research/threats.md section 3 R12"
    falsepositives:
      - "None known: a tool that means the control file uses its canonical name"
    when:
      type: tool.pre
    match:
      path.normalization_evasion: true
    response: ask
    dedup: [target.path]
    evidence: [target.path]
    remedy: Treat it as a write to the control file itself and review the content.
    tests:
      - name: case variant on Windows
        event: { type: tool.pre, tool: { kind: file_write, name: Write }, target: { path: "C:\\Users\\t\\project\\.cUrsor\\mcp.json" }, session: { cwd: "C:\\Users\\t\\project" }, host: { os: windows } }
        expect: match
      - name: trailing dot on Windows
        event: { type: tool.pre, tool: { kind: file_write, name: Write }, target: { path: "C:\\Users\\t\\project\\.mcp.json." }, session: { cwd: "C:\\Users\\t\\project" }, host: { os: windows } }
        expect: match
      - name: case variant on Linux is a different file
        event: { type: tool.pre, tool: { kind: file_write, name: Write }, target: { path: /home/tester/project/.cUrsor/mcp.json }, host: { os: linux } }
        expect: no_match
      - name: canonical name on Windows
        event: { type: tool.pre, tool: { kind: file_write, name: Write }, target: { path: "C:\\Users\\t\\project\\.cursor\\mcp.json" }, session: { cwd: "C:\\Users\\t\\project" }, host: { os: windows } }
        expect: no_match

  - id: SPR-EVADE-010
    title: Git hooks skipped
    description: >-
      git commit or push with --no-verify, HUSKY=0 or core.hooksPath
      pointed away. Very common on work-in-progress commits, so a signal
      that only matters next to other detections.
    kind: activity
    class: signal
    severity: low
    confidence: high
    maturity: stable
    category: defense_evasion
    tags: [owasp.asi02]
    references:
      - "research/threats.md section 3 R38"
    falsepositives:
      - "Work-in-progress commits on a local branch where hooks are slow or broken"
    when:
      type: [tool.pre, process.exec]
    match:
      shell.git_ops: commit_no_verify
    evidence: [target.command]
    remedy: No action on its own.
    tests:
      - name: no-verify commit
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "git commit --no-verify -m wip" } }
        expect: match
      - name: plain commit
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "git commit -m 'fix parser'" } }
        expect: no_match
      - name: status
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "git status --short" } }
        expect: no_match

  - id: SPR-EVADE-011
    title: Agent session log deleted or rewritten
    description: >-
      A command deletes, truncates or writes an agent transcript (Claude
      Code projects/*.jsonl, Codex rollouts, Copilot or Gemini session
      logs). The transcript is the second surface next to hooks; an agent
      erasing it is erasing its own tracks.
    kind: activity
    class: finding
    severity: high
    confidence: high
    maturity: stable
    category: defense_evasion
    tags: [attack.t1070.004, atlas.aml.t0138, owasp.asi10]
    references:
      - "research/threats.md section 2 row 25 (agent denied what it did)"
    falsepositives:
      - "Users cleaning up old sessions to save space"
    when:
      type: [tool.pre, process.exec]
    match:
      any:
        - shell.delete_classes: agent_transcript
        - shell.write_classes: agent_transcript
        - all:
            - tool.kind|in: [file_write, file_edit]
            - path.classes: agent_transcript
    dedup: [shell.deletes, shell.writes, target.path]
    evidence: [target.command, target.path, shell.deletes, shell.writes]
    remedy: Recover the log from backup if possible and review the session that removed it.
    tests:
      - name: transcript removed
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "rm -rf ~/.claude/projects/-home-x/abc.jsonl" } }
        expect: match
      - name: rollout truncated
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "truncate -s 0 ~/.codex/sessions/2026/11/rollout-x.jsonl" } }
        expect: match
      - name: transcript read for analysis
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "wc -l ~/.claude/projects/-home-x/*.jsonl" } }
        expect: no_match
      - name: project jsonl fixture written
        event: { type: tool.pre, tool: { kind: file_write, name: Write }, target: { path: /home/tester/project/testdata/session.jsonl } }
        expect: no_match

  - id: SPR-EVADE-012
    title: Symbolic link planted to a sensitive file
    description: >-
      ln -s creates a link whose target is an SSH key or authorized_keys,
      a shell profile, an agent settings file or a system credential file.
      An approval prompt shows the link's harmless name; the write lands on
      the target (GhostApproval).
    kind: activity
    class: finding
    severity: high
    confidence: medium
    maturity: experimental
    category: defense_evasion
    tags: [attack.t1098.004, owasp.asi05]
    references:
      - "research/threats.md section 2 row 17: GhostApproval CVE-2026-12958"
      - "research/threats.md section 2 row 16: DuneSlide symlink canonicalisation"
      - "research/threats.md section 3 R13"
    falsepositives:
      - "Dotfile managers that link profiles into place"
    when:
      type: [tool.pre, process.exec]
    match:
      any_command:
        name: ln
        all:
          - args|any_re: ["^-[a-zA-Z]*s", "^--symbolic"]
          - args|any_re: "(\\.ssh/|authorized_keys|/etc/(passwd|shadow|sudoers)|\\.aws/credentials|\\.(bash|zsh)rc|\\.zshenv|\\.profile|\\.claude/settings|\\.git-credentials|\\.netrc)"
    evidence: [target.command]
    remedy: Remove the link and check which tool was about to write through it.
    tests:
      - name: link to authorized_keys
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "ln -s ~/.ssh/authorized_keys project_settings.json" } }
        expect: match
      - name: link to a build directory
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "ln -sf ../shared/config ./config" } }
        expect: no_match
      - name: hard link of a source file
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "ln src/a.go src/b.go" } }
        expect: no_match
