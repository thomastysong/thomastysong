# spoor Fleet content: No spoor binary: Fleet's built-in ai_tools table (builtin profile).
# Tier 1 for fleetd hosts: inventory and configuration posture from Fleet's
# own table. No detections, no hook coverage, no history between queries.
#
# GENERATED by internal/fleetgen from the state table definitions and
# catalog 2026.11.11. Do not edit: regenerate with
#   go test ./internal/fleetgen -run TestGolden -update
# or write a copy for your hosts' paths with `spoor export fleet`.
# Heartbeat windows: sensor policy 30 minutes, every other spoor policy 24 hours.

- name: AI agents - no permission bypass (ai_tools)
  description: 'Fleet''s ai_tools table reports no agent configured or running with permission prompts skipped. Live view only: an agent that ran in bypass mode and exited is not seen.'
  resolution: Remove the switch from the launcher or alias that starts the agent and the bypass default from its settings; enforce the managed setting that disables bypass mode where the agent has one.
  query: |-
    SELECT 1 WHERE NOT EXISTS (SELECT 1 FROM ai_tools
      WHERE type = 'agents'
      AND (instr(',' || replace(risk_flags, ' ', '') || ',', ',bypass_permissions,') > 0
        OR instr(',' || replace(risk_flags, ' ', '') || ',', ',skip_permissions_runtime,') > 0));
  platform: darwin,linux,windows
  critical: false
- name: AI agents - no unpinned or plaintext-secret MCP server (ai_tools)
  description: Fleet's ai_tools table reports no MCP server with an unpinned dependency or a plaintext secret.
  resolution: Pin the package to an exact version and move secrets out of the configuration file.
  query: |-
    SELECT 1 WHERE NOT EXISTS (SELECT 1 FROM ai_tools
      WHERE type = 'mcp_server'
      AND (instr(',' || replace(risk_flags, ' ', '') || ',', ',unpinned_dependency,') > 0
        OR instr(',' || replace(risk_flags, ' ', '') || ',', ',plaintext_secret,') > 0));
  platform: darwin,linux,windows
  critical: false
