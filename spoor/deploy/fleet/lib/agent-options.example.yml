# spoor Fleet content: agent options example with ATC merged in.
#
# GENERATED by internal/fleetgen from the state table definitions and
# catalog 2026.11.11. Do not edit: regenerate with
#   go test ./internal/fleetgen -run TestGolden -update
# or write a copy for your hosts' paths with `spoor export fleet`.
# Heartbeat windows: sensor policy 30 minutes, every other spoor policy 24 hours.
#
# EXAMPLE: the ATC fragment merged into a typical base configuration
# (fleetgen.ExampleBaseAgentOptions). The darwin and windows overrides
# repeat the base options and decorators because Fleet does not merge
# overrides with config. Replace the base part with your own options.

config:
  auto_table_construction:
    spoor_agent_processes:
      query: SELECT pid, start_time, agent_id, user, exe, flags, session_ref, container_id, first_seen, last_seen, running FROM agent_processes
      path: /var/lib/spoor/state.db
      columns: [pid, start_time, agent_id, user, exe, flags, session_ref, container_id, first_seen, last_seen, running]
      platform: linux
    spoor_agents:
      query: SELECT asset_id, name, vendor, kind, catalog_id, version, install_path, owner, scope, running, pid, sha256, signer, confidence, evidence, risk_flags, hooks, transcript, native_otel, first_seen, last_seen, change FROM agents
      path: /var/lib/spoor/state.db
      columns: [asset_id, name, vendor, kind, catalog_id, version, install_path, owner, scope, running, pid, sha256, signer, confidence, evidence, risk_flags, hooks, transcript, native_otel, first_seen, last_seen, change]
      platform: linux
    spoor_coverage:
      query: SELECT agent_id, user, hooks, transcript, processes, state, updated FROM coverage
      path: /var/lib/spoor/state.db
      columns: [agent_id, user, hooks, transcript, processes, state, updated]
      platform: linux
    spoor_detections:
      query: SELECT event_id, ts, rule_id, title, severity, confidence, maturity, category, tags, agent_id, user, session_ref, integrity, response, enforced, count, dedup_key FROM detections
      path: /var/lib/spoor/state.db
      columns: [event_id, ts, rule_id, title, severity, confidence, maturity, category, tags, agent_id, user, session_ref, integrity, response, enforced, count, dedup_key]
      platform: linux
    spoor_extensions:
      query: SELECT asset_id, kind, name, parent, scope, owner, source_path, sha256, risk_flags, first_seen, last_seen, last_changed FROM extensions WHERE removed_at = ''
      path: /var/lib/spoor/state.db
      columns: [asset_id, kind, name, parent, scope, owner, source_path, sha256, risk_flags, first_seen, last_seen, last_changed]
      platform: linux
    spoor_health:
      query: SELECT sensor_version, mode, profile, started, heartbeat, last_scan, scan_complete, rules_count, rules_version, rules_hash, catalog_version, bundle_version, events_in, events_out, dropped, detections, errors, host_id, host_id_source FROM health
      path: /var/lib/spoor/state.db
      columns: [sensor_version, mode, profile, started, heartbeat, last_scan, scan_complete, rules_count, rules_version, rules_hash, catalog_version, bundle_version, events_in, events_out, dropped, detections, errors, host_id, host_id_source]
      platform: linux
    spoor_mcp_servers:
      query: SELECT asset_id, name, parent, scope, owner, source_path, transport, command, runner, ecosystem, package, version, pinned, url_host, env_keys, auth_mode, risk_flags, sha256, first_seen, last_seen, last_changed FROM mcp_servers WHERE removed_at = ''
      path: /var/lib/spoor/state.db
      columns: [asset_id, name, parent, scope, owner, source_path, transport, command, runner, ecosystem, package, version, pinned, url_host, env_keys, auth_mode, risk_flags, sha256, first_seen, last_seen, last_changed]
      platform: linux
    spoor_posture:
      query: SELECT check_id, title, severity, agent_id, asset_id, scope, subject, owner, actual, remedy, first_seen, last_seen FROM posture
      path: /var/lib/spoor/state.db
      columns: [check_id, title, severity, agent_id, asset_id, scope, subject, owner, actual, remedy, first_seen, last_seen]
      platform: linux
    spoor_sessions:
      query: SELECT session_ref, agent_id, user, started, last_event, permission_mode, tool_calls, detections, max_severity, sources, coverage FROM sessions
      path: /var/lib/spoor/state.db
      columns: [session_ref, agent_id, user, started, last_event, permission_mode, tool_calls, detections, max_severity, sources, coverage]
      platform: linux
  decorators:
    load:
      - SELECT uuid AS host_uuid FROM system_info;
      - SELECT hostname AS hostname FROM system_info;
  options:
    distributed_interval: 10
    distributed_plugin: tls
    distributed_tls_max_attempts: 3
    logger_tls_endpoint: /api/osquery/log
    logger_tls_period: 10
    pack_delimiter: /
