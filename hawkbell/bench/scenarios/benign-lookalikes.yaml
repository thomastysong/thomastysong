    description: Following a Shai-Hulud advisory, the agent searches the source tree for the worm's files.
    events:
      - { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "find ~/src -name setup_bun.js -o -name bun_environment.js" } }
    expect_none: true

  - name: ioc-hunt-grep-dependencies
    technique: attack.t1195.002
    description: The agent greps installed dependencies for the campaign name.
    events:
      - { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "grep -rl sha1-hulud node_modules" } }
    expect_none: true

  - name: ioc-hunt-github-repositories
    technique: attack.t1567.001
    description: The s1ngularity advisory's check for a leaked public repository in the user's account.
    events:
      - { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "gh repo list --limit 500 --json name -q '.[].name' | grep -i s1ngularity-repository" } }
    expect_none: true

  - name: ansible-inventory-in-tmp
    technique: attack.t1195.002
    description: A host list for a quick Ansible run saved as /tmp/inventory.txt (the s1ngularity file name, with no credential read before it).
    events:
      - { type: tool.pre, tool: { kind: file_write, name: Write }, target: { path: /tmp/inventory.txt }, content: { tool_input: { file_path: /tmp/inventory.txt, content: "web1\nweb2\n" } } }
    expect_none: true

  - name: pyc-cleanup-under-home
    technique: attack.t1485
    description: Compiled Python files removed from the whole home directory by name.
    events:
      - { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "find ~ -name '*.pyc' -delete" } }
    expect_none: true

  - name: old-logs-under-home
    technique: attack.t1485
    description: Logs older than a month removed under home.
    events:
      - { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "find ~/logs -mtime +30 -name '*.log' -delete" } }
    expect_none: true

  - name: sensor-config-inspected
    technique: attack.t1685
    description: The sensor's configuration and health are read, not changed.
    events:
      - { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "sudo cat /etc/hawkbell/hawkbell.yaml && sudo hawkbell doctor" } }
    expect_none: true

  - name: sensor-package-staging-root
    technique: attack.t1685.007
    description: Packaging work lays out the installed tree, kill switch included, under a staging root.
    events:
      - { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "mkdir -p pkgroot/etc/hawkbell && cp packaging/hawkbell.yaml pkgroot/etc/hawkbell/ && touch pkgroot/etc/hawkbell/disabled && chmod 755 pkgroot/usr/bin/hawkbell" } }
    expect_none: true

  - name: sensor-staging-root-after-cd
    technique: attack.t1685.007
    description: Packaging work creates the kill switch under a staging root it changed into; the cd is followed, so the path is the staging copy.
    events:
      - { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "cd /tmp/pkgroot && mkdir -p etc/hawkbell && touch etc/hawkbell/disabled" } }
    expect_none: true

  - name: sensor-cli-usage
    technique: attack.t1685
    description: The agent prints the usage of the sensor's uninstall subcommand (release benign replay, review:packaging).
    events:
      - { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "hawkbell hooks install --help; hawkbell hooks uninstall --help" } }
    expect_none: true

  - name: setgid-outbox-directory
    technique: attack.t1548.001
    description: A test creates an outbox directory and gives it the setgid mode hawkbell's own outbox uses (release benign replay, review:cli and fix:cli).
    events:
      - { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "rm -rf pt && mkdir -p pt/data/local pt/data/outbox && chmod 755 pt && chmod 700 pt/data/local && chmod 2750 pt/data/outbox" } }
    expect_none: true

  - name: glob-over-app-settings
    technique: attack.t1552.001
    description: The agent greps application settings files under ~/.config with a glob.
    events:
      - { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "grep -rn fontSize ~/.config/*/settings.json" } }
    expect_none: true

  - name: registry-metadata-fetch
    technique: atlas.aml.t0051.001
    description: Package metadata fetched from the registry before an edit of the agent's instructions file.
    events:
      - type: tool.post
        tool: { kind: shell, name: Bash }
        target: { command: "curl -s https://registry.npmjs.org/left-pad/latest" }
        content: { tool_output: "{\"name\":\"left-pad\",\"version\":\"1.3.0\"}" }
      - type: tool.pre
        tool: { kind: file_edit, name: Edit }
        target: { path: /home/tester/project/CLAUDE.md }
        content: { tool_input: { file_path: /home/tester/project/CLAUDE.md, old_string: "## Dependencies", new_string: "## Dependencies\nleft-pad is pinned to 1.3.0." } }
    expect_none: true

  - name: macos-nc-crlf-request
    technique: attack.t1059.004
    description: On macOS, nc -c only sends CRLF line endings; used to send a raw HTTP request.
    events:
      - { type: tool.pre, host: { os: darwin }, tool: { kind: shell, name: Bash }, target: { command: "nc -c example.com 80" } }
    expect_none: true
