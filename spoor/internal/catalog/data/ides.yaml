  - id: devin-desktop
    name: Devin Desktop
    vendor: Cognition
    kind: app
    # devin-cli: its binary is devin, this app's process is Devin.
    aliases: [windsurf, Windsurf, Codeium Windsurf, Cascade, devin-cli]
    binaries: [devin-desktop, windsurf]
    process_names: [Devin, Windsurf]
    packages: [cask:devin-desktop, scoop:windsurf]
    bundle_ids: [com.exafunction.windsurf]
    win_display: ["^Windsurf", "^Devin Desktop"]
    desktop_ids: [windsurf]
    install_paths:
      darwin: ["/Applications/Devin.app", "/Applications/Windsurf.app"]
    state_dirs:
      all: ["~/.codeium/windsurf", "~/.devin", "~/.windsurf"]
      darwin: ["~/Library/Application Support/Devin", "~/Library/Application Support/Windsurf"]
    mcp:
      - {paths: ["~/.codeium/windsurf/mcp_config.json"], format: mcpServers, scope: user}
    skills: ["~/.codeium/windsurf/skills"]
    rules: ["./.windsurfrules", "./.windsurf/rules"]
    transcript:
      format: windsurf-jsonl
      globs: ["~/.windsurf/transcripts/*.jsonl"]
    hooks:
      managed_paths:
        darwin: ["/Library/Application Support/Windsurf/hooks.json"]
        linux: ["/etc/windsurf/hooks.json"]
        windows: ['C:\ProgramData\Windsurf\hooks.json']
      user_paths: ["~/.codeium/windsurf/hooks.json"]
      notes: >-
        Cascade hooks; exit code 2 blocks pre_read_code, pre_write_code,
        pre_run_command and pre_mcp_tool_use. System hooks run first but user
        and workspace hooks also execute. No spoor dialect.
    api_hosts: [windsurf-stable.codeium.com, windsurf-stable.codeiumdata.com]
    capabilities: [executes_shell, edits_files, mcp_client, cloud_execution]
    notes: >-
      Windsurf was renamed Devin Desktop in 2026 and kept its bundle id; the
      Windows uninstall entry and the Scoop package still say Windsurf.
    sources:
      - https://raw.githubusercontent.com/Homebrew/homebrew-cask/master/Casks/d/devin-desktop.rb
      - https://raw.githubusercontent.com/ScoopInstaller/Extras/master/bucket/windsurf.json
      - https://raw.githubusercontent.com/fleetdm/fleet/main/ee/maintained-apps/outputs/apps.json
      - https://raw.githubusercontent.com/perplexityai/numbat/main/docs/deployment.md
      - research:agent-surfaces-b.md#1b
    unverified: [desktop_ids, rules, win_display]

