    events:
      - { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "ngrok http 3000 --log stdout" } }
    expect_none: true

  - name: kubectl-one-secret
    technique: attack.t1552.007
    description: kubectl get secret for one named secret.
    events:
      - { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "kubectl -n web get secret app-tls -o jsonpath='{.data.tls\\.crt}' | base64 -d | openssl x509 -noout -enddate" } }
    expect_none: true

  - name: security-engineer-nmap-localhost
    technique: atlas.aml.t0103
    description: A security engineer scans their own machine. HB-OFFSEC-001 fires unless the host is tagged offsec.
    events:
      - { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "nmap -sV -p 1-1024 127.0.0.1" } }
    expect_none: true

  - name: ci-container-bypass-agent
    technique: owasp.asi10
    description: A headless agent with approvals off inside a CI container (no lifecycle parent).
    events:
      - { type: agent.process.start, agent: { id: claude-code }, process: { name: claude, args: [claude, --dangerously-skip-permissions, -p, "fix the lint errors"], flags: [--dangerously-skip-permissions], ancestors: [bash, docker-init] }, labels: { headless: "true" } }
    expect_none: true

  - name: orchestrator-child-agent
    technique: atlas.aml.t0053
    description: An orchestrator starts a child agent with default permissions.
    events:
      - { type: agent.process.start, agent: { id: claude-code }, process: { name: claude, args: [claude, -p, "review the diff"], ancestors: [node, claude] }, labels: { headless: "true", parent_agent: claude-code } }
    expect_none: true

  - name: readme-emoji-and-rtl
    technique: attack.t1027.018
    description: README with emoji ZWJ sequences and Hebrew text.
    events:
      - type: tool.pre
        tool: { kind: file_write, name: Write }
        target: { path: /home/tester/project/README.md }
        content: { file_content: "# Team 👩‍💻👨‍🔬\nשלום — contributors welcome." }
    expect_none: true

  - name: claude-md-with-emoji
