# spoor catalog: AI IDEs, agentic editors and AI terminals.
# Provenance and conventions are described at the top of agents.yaml.
# macOS bundle ids and state paths come from the Homebrew cask of each app;
# Windows display names from Fleet's maintained-apps list
# (fleetdm/fleet ee/maintained-apps/outputs/apps.json); Windows executable
# names from the Scoop manifests.
version: "2026.11.11"

products:
  - id: cursor
    name: Cursor
    vendor: Anysphere
    kind: app
    # cursor-agent: the CLI shares ~/.cursor and the hook files.
    aliases: [cursor-agent]
    # "cursor" is the launcher shim (the cask installs the bundled bin/code
    # under that name).
    binaries: [cursor]
    process_names: [Cursor, Cursor Helper]
    packages: [cask:cursor, scoop:cursor, winget:Anysphere.Cursor]
    bundle_ids: [com.todesktop.230313mzl4w4u92]
    win_display: ["^Cursor"]
    desktop_ids: [cursor]
    install_paths:
      darwin: ["/Applications/Cursor.app"]
      windows: ['%LOCALAPPDATA%\Programs\cursor']
      linux: ["/opt/Cursor", "/usr/share/cursor"]
    state_dirs:
      all: ["~/.cursor"]
      darwin: ["~/Library/Application Support/Cursor"]
      linux: ["~/.config/Cursor"]
      windows: ['%APPDATA%\Cursor']
    env_markers: [CURSOR_TRACE_ID, CURSOR_AGENT, CURSOR_SANDBOX]
    mcp:
      - {paths: ["~/.cursor/mcp.json"], format: mcpServers, scope: user}
      - {project_paths: [".cursor/mcp.json"], format: mcpServers, scope: project}
    skills: ["~/.cursor/skills", "./.cursor/skills"]
    rules: ["./.cursor/rules", "./.cursorrules", "./AGENTS.md"]
    plugins: ["~/.cursor/plugins", "~/.cursor/extensions"]
    # Cursor also writes JSONL agent transcripts under
    # ~/.cursor/projects/<hash>/agent-transcripts/; the SQLite store is the
    # one uber/ADR and Fleet parse.
    transcript:
      format: cursor-sqlite
      globs:
        darwin: ["~/Library/Application Support/Cursor/User/globalStorage/state.vscdb"]
        linux: ["~/.config/Cursor/User/globalStorage/state.vscdb"]
        windows: ['%APPDATA%\Cursor\User\globalStorage\state.vscdb']
    hooks:
      dialect: cursor
      managed_paths:
        darwin: ["/Library/Application Support/Cursor/hooks.json"]
        linux: ["/etc/cursor/hooks.json"]
        windows: ['C:\ProgramData\Cursor\hooks.json']
      user_paths: ["~/.cursor/hooks.json"]
      project_paths: [".cursor/hooks.json"]
      notes: >-
        For local sessions every matching Enterprise, Team, trusted Project
        and User hook runs; priority only settles conflicting responses.
        Team hooks can also be distributed from the dashboard. Cloud agents
        do not load the user file and emit no sessionStart or sessionEnd.
        Exit code 2 or permission "deny" blocks; other failures fail open
        unless failClosed is set. subagentStart ignores a deny. cursor.com
        was unreachable when this was written: the paths are confirmed by
        two independent code bases, the semantics by neither vendor docs nor
        a test.
    risky_flags: [--force, --yolo]
    settings:
      - {file: ["~/.cursor/cli-config.json"], format: json, key: permissions.allow, op: exists, flag: cli_allowlist_present, severity: info}
    api_hosts: [downloads.cursor.com]
    signers: {darwin_team_id: VDXQ22DGB9}
    capabilities: [executes_shell, edits_files, mcp_client, cloud_execution]
    sources:
      - https://raw.githubusercontent.com/Homebrew/homebrew-cask/master/Casks/c/cursor.rb
      - https://raw.githubusercontent.com/ScoopInstaller/Extras/master/bucket/cursor.json
      - https://raw.githubusercontent.com/fleetdm/fleet/main/ee/maintained-apps/outputs/apps.json
      - https://raw.githubusercontent.com/perplexityai/numbat/main/docs/deployment.md
      - https://raw.githubusercontent.com/perplexityai/numbat/main/docs/agent-coverage.md
      - research:agent-surfaces-a.md#6
    # risky_flags and settings describe the cursor-agent CLI; the IDE's
    # auto-run switch lives in state.vscdb under a key we could not confirm.
    unverified: [risky_flags, settings, env_markers, signers, install_paths.windows, install_paths.linux, packages, plugins]

  - id: vscode
    name: Visual Studio Code
    vendor: Microsoft
    kind: app
    binaries: [code, code-tunnel]
    process_names: [Code, Code Helper]
    packages: [cask:visual-studio-code, scoop:vscode, winget:Microsoft.VisualStudioCode, snap:code]
    bundle_ids: [com.microsoft.VSCode]
    win_display: [Microsoft Visual Studio Code]
    desktop_ids: [code]
    install_paths:
      darwin: ["/Applications/Visual Studio Code.app"]
      windows: ['%LOCALAPPDATA%\Programs\Microsoft VS Code', '%ProgramFiles%\Microsoft VS Code']
      linux: ["/usr/share/code", "/snap/code"]
    state_dirs:
      all: ["~/.vscode"]
      darwin: ["~/Library/Application Support/Code"]
      linux: ["~/.config/Code", "~/.vscode-server"]
      windows: ['%APPDATA%\Code']
    mcp:
      - paths:
          darwin: ["~/Library/Application Support/Code/User/mcp.json", "~/Library/Application Support/Code/User/settings.json"]
          linux: ["~/.config/Code/User/mcp.json", "~/.config/Code/User/settings.json"]
          windows: ['%APPDATA%\Code\User\mcp.json', '%APPDATA%\Code\User\settings.json']
        format: vscode
        scope: user
      - {project_paths: [".vscode/mcp.json"], format: vscode, scope: project}
    plugins: ["~/.vscode/extensions", "~/.vscode-server/extensions"]
    rules: ["./.github/copilot-instructions.md", "./AGENTS.md"]
    settings:
      - file: &vscode_settings
          darwin: ["~/Library/Application Support/Code/User/settings.json"]
          linux: ["~/.config/Code/User/settings.json"]
          windows: ['%APPDATA%\Code\User\settings.json']
        format: jsonc
        key: '"chat.tools.global.autoApprove"'
        op: eq
        value: "true"
        flag: auto_approve_all_tools
        severity: high
      - {file: *vscode_settings, format: jsonc, key: '"chat.useHooks"', op: eq, value: "false", flag: hooks_disabled, severity: medium}
    signers: {darwin_team_id: UBF8T346G9, windows_publisher: Microsoft Corporation}
    capabilities: [executes_shell, edits_files, mcp_client]
    notes: >-
      Agent mode, Copilot Chat and third-party agent extensions run here.
      The Copilot harness loads the Copilot CLI hook files (see copilot-cli);
      enterprise policy ChatToolsAutoApprove controls the global auto-approve
      switch. Cursor and Kiro ship a launcher also named code.
    sources:
      - https://raw.githubusercontent.com/Homebrew/homebrew-cask/master/Casks/v/visual-studio-code.rb
      - https://raw.githubusercontent.com/ScoopInstaller/Extras/master/bucket/vscode.json
      - https://raw.githubusercontent.com/microsoft/vscode-docs/main/docs/enterprise/policies.md
      - research:agent-surfaces-a.md#4
    unverified: [signers, install_paths, packages]

