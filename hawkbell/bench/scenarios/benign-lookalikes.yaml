  - name: pinned-mcp-server
    technique: atlas.aml.t0109
    description: The scan finds a pinned, registry-hosted MCP server.
    events:
      - { type: inventory.asset, asset: { id: mcp-pinned, kind: mcp_server, name: filesystem, scope: user, mcp: { runner: npx, package: "@modelcontextprotocol/server-filesystem", version: "2026.1.14", pinned: true }, risk_flags: [remote_fetch_exec] } }
    expect_none: true

  - name: current-agent-version
    technique: atlas.aml.t0109
    description: The scan finds a current Claude Code release with managed policy.
    events:
      - { type: inventory.asset, asset: { id: ag-cur, kind: agent, name: Claude Code, catalog_id: claude-code, version: "2.1.287", risk_flags: [managed_policy_present], telemetry: { hooks: managed, transcript: tailing } } }
    expect_none: true

  - name: hook-runs-formatter
    technique: atlas.aml.t0081
    description: The scan finds a user hook that runs a formatter.
    events:
      - { type: inventory.asset, asset: { id: hook-fmt, kind: hook, name: PostToolUse, parent: claude-code, scope: user, path: /home/tester/.claude/settings.json } }
    expect_none: true

  - name: secret-read-used-locally
    technique: atlas.aml.t0086
    description: A token is read from .env and used against a local service only.
    events:
      - type: tool.post
        tool: { kind: file_read, name: Read }
        target: { path: /home/tester/project/.env }
        content: { tool_output: "LOCAL_API_TOKEN=Wq2eR5tY8uI1oP4aS7dF0gH3jK6lZ9xC\n" }
      - { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "curl -s -H 'Authorization: Bearer Wq2eR5tY8uI1oP4aS7dF0gH3jK6lZ9xC' http://localhost:8080/v1/me" } }
    expect_none: true

  - name: dig-txt-record
    technique: attack.t1071.004
    description: Checking a DMARC record.
    events:
      - { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "dig +short TXT _dmarc.example.com" } }
    expect_none: true

  - name: nc-port-check
    technique: attack.t1059.004
    description: Checking whether a local port is open.
    events:
      - { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "nc -zv localhost 5432" } }
    expect_none: true

  - name: ssh-bastion-proxyjump
    technique: attack.t1059.004
    description: ssh through a bastion with ProxyJump.
    events:
      - { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "ssh -J bastion.example deploy@10.0.3.7 'systemctl status app --no-pager'" } }
    expect_none: true

  # Added after the C4 review: the precision side of the fixes to the
