# spoor Fleet content: spoor on plain osquery (stock profile).
# For any osquery 5 host (fleetd or not) with the spoor sensor, reading
# spoor's tables through ATC or the spoor extension.
#
# GENERATED by internal/fleetgen from the state table definitions and
# catalog 2026.11.11. Do not edit: regenerate with
#   go test ./internal/fleetgen -run TestGolden -update
# or write a copy for your hosts' paths with `spoor export fleet`.
# Heartbeat windows: sensor policy 30 minutes, every other spoor policy 24 hours.

- name: spoor installed
  description: The spoor binary or its state database exists at the path a system install uses (binary or state database; exact paths, no wildcards). Uses only osquery's file table, so it works before any spoor table is available and can scope the rollout.
  query: |-
    SELECT 1 FROM file
    WHERE path IN ('/usr/bin/spoor', '/var/lib/spoor/state.db', '/usr/local/bin/spoor', '/Library/Application Support/spoor/state.db', 'C:\Program Files\spoor\spoor.exe', 'C:\ProgramData\spoor\state.db')
      AND CASE (SELECT build_platform FROM osquery_info)
        WHEN 'linux' THEN path IN ('/usr/bin/spoor', '/var/lib/spoor/state.db')
        WHEN 'darwin' THEN path IN ('/usr/local/bin/spoor', '/Library/Application Support/spoor/state.db')
        WHEN 'windows' THEN path IN ('C:\Program Files\spoor\spoor.exe', 'C:\ProgramData\spoor\state.db')
        ELSE 0 END
    LIMIT 1;
  label_membership_type: dynamic
- name: AI agents present
  description: spoor's inventory lists at least one AI agent, AI app or IDE extension, AI browser or local model runtime that has not been removed.
  query: |-
    SELECT 1 FROM spoor_agents WHERE change != 'removed' LIMIT 1;
  label_membership_type: dynamic
- name: spoor sensor unhealthy
  description: spoor is installed but its heartbeat is older than 30 minutes or missing. A host whose spoor tables are not loaded at all cannot answer this query; it appears in "spoor tables unavailable" instead.
  query: |-
    SELECT 1 FROM file
    WHERE path IN ('/usr/bin/spoor', '/var/lib/spoor/state.db', '/usr/local/bin/spoor', '/Library/Application Support/spoor/state.db', 'C:\Program Files\spoor\spoor.exe', 'C:\ProgramData\spoor\state.db')
      AND CASE (SELECT build_platform FROM osquery_info)
        WHEN 'linux' THEN path IN ('/usr/bin/spoor', '/var/lib/spoor/state.db')
        WHEN 'darwin' THEN path IN ('/usr/local/bin/spoor', '/Library/Application Support/spoor/state.db')
        WHEN 'windows' THEN path IN ('C:\Program Files\spoor\spoor.exe', 'C:\ProgramData\spoor\state.db')
        ELSE 0 END
      AND NOT EXISTS (SELECT 1 FROM spoor_health WHERE heartbeat >= strftime('%Y-%m-%dT%H:%M:%S.000000Z', 'now', '-1800 seconds'))
    LIMIT 1;
  label_membership_type: dynamic
- name: spoor tables unavailable
  description: 'spoor is installed but osquery has no spoor_health table: the extension is not loaded or the ATC agent options did not reach the host. Every spoor policy shows no response (neither pass nor fail) on such a host.'
  query: |-
    SELECT 1 FROM file
    WHERE path IN ('/usr/bin/spoor', '/var/lib/spoor/state.db', '/usr/local/bin/spoor', '/Library/Application Support/spoor/state.db', 'C:\Program Files\spoor\spoor.exe', 'C:\ProgramData\spoor\state.db')
      AND CASE (SELECT build_platform FROM osquery_info)
        WHEN 'linux' THEN path IN ('/usr/bin/spoor', '/var/lib/spoor/state.db')
        WHEN 'darwin' THEN path IN ('/usr/local/bin/spoor', '/Library/Application Support/spoor/state.db')
        WHEN 'windows' THEN path IN ('C:\Program Files\spoor\spoor.exe', 'C:\ProgramData\spoor\state.db')
        ELSE 0 END
      AND NOT EXISTS (SELECT 1 FROM osquery_registry
        WHERE registry = 'table' AND name = 'spoor_health' AND active = 1)
    LIMIT 1;
  label_membership_type: dynamic
