# nfpm configuration of the Linux packages (deb and rpm), for building them
# without goreleaser (`make package`). The release build (.goreleaser.yaml,
# nfpms) carries the same file list and scripts; packaging/packaging_test.go
# keeps the two in step. Paths are relative to the module root.
#
#   cp dist/linux_amd64/spoor dist/package/spoor   # the binary to package
#   VERSION=1.2.3 ARCH=amd64 nfpm package -f packaging/linux/nfpm.yaml -p deb -t dist/
#
# nfpm expands environment variables in arch and version but not in content
# sources, hence the fixed staging path dist/package/spoor.
#
# Install locations are fixed: deploy/fleet (install scripts, extension
# registration, policies) and the systemd unit expect /usr/bin/spoor.
name: spoor
arch: ${ARCH}
platform: linux
version: ${VERSION}
version_schema: semver
release: "1"
section: admin
priority: optional
# UNVERIFIED: placeholder maintainer address (.invalid is reserved); set the
# real contact before the first release.
maintainer: spoor maintainers <maintainers@spoor.invalid>
description: |-
  AI coding agent detection sensor.
  spoor collects what AI coding agents do (hooks, session transcripts,
  processes), detects risky behaviour on the endpoint, reports sensor health
  and hook coverage, and hands findings to Fluent Bit and Fleet/osquery.
vendor: spoor
homepage: https://github.com/thomastysong/thomastysong/tree/main/spoor
license: Apache-2.0
contents:
  - src: dist/package/spoor
    dst: /usr/bin/spoor
    file_info:
      mode: 0755
      owner: root
      group: root
  - src: packaging/systemd/spoor.service
    dst: /usr/lib/systemd/system/spoor.service
    file_info:
      mode: 0644
      owner: root
      group: root
  - src: LICENSE
    dst: /usr/share/doc/spoor/LICENSE
    file_info:
      mode: 0644
      owner: root
      group: root
  - src: NOTICE
    dst: /usr/share/doc/spoor/NOTICE
    file_info:
      mode: 0644
      owner: root
      group: root
  - src: THIRD_PARTY_LICENSES
    dst: /usr/share/doc/spoor/THIRD_PARTY_LICENSES
    file_info:
      mode: 0644
      owner: root
      group: root
scripts:
  preinstall: packaging/linux/preinstall.sh
  postinstall: packaging/linux/postinstall.sh
  preremove: packaging/linux/preremove.sh
  postremove: packaging/linux/postremove.sh
