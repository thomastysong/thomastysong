# Process plane: agent processes observed by the process monitor (Linux
# cn_proc, osquery), not reported by the agent. This is the only plane that
# sees an AI CLI launched by a package install script or a URL handler,
# because those runs never pass through a tool-call hook.
pack: process
version: "2026.11.0"
description: Agent CLIs started by package lifecycle scripts, other agents or URL handlers, with weakened policy.
rules:
  - id: HB-PROC-001
    title: Headless agent with approvals disabled launched by a package install script
    description: >-
      An AI agent CLI runs with a flag that disables approvals or the
      sandbox, and its ancestry contains a package lifecycle script (npm,
      yarn, pnpm or bun install hooks, pip build). That is the s1ngularity
      chain: postinstall telemetry.js drove claude, gemini and q headless to
      inventory secrets. There is no benign reason for an install script to
      start an agent without approvals.
    kind: activity
    class: alert
    severity: critical
    confidence: high
    maturity: stable
    category: execution
    tags: [attack.t1195.002, atlas.aml.t0053, atlas.aml.t0098, owasp.asi04]
    references:
      - "research/threats.md section 2 row 1: Nx s1ngularity (GHSA-cxm3-wv7p-598c)"
      - "research/threats.md section 3 R01"
    falsepositives:
      - "None known for a lifecycle parent"
    when:
      type: agent.process.start
    match:
      labels.lifecycle_parent|exists: true
      process.flags|any_in_list: agent_bypass_risky_flags
    dedup: [agent.id]
    evidence: [agent.id, process.flags, process.ancestors, labels.lifecycle_parent]
    escalate: true
    remedy: Kill the process tree, identify the package that ran the script and rotate every credential on the host.
    tests:
      - name: claude bypass under npm postinstall
        event: { type: agent.process.start, agent: { id: claude-code }, process: { name: claude, args: [claude, --dangerously-skip-permissions, -p, "inventory"], flags: [--dangerously-skip-permissions], ancestors: [node, npm, bash] }, labels: { headless: "true", lifecycle_parent: npm } }
        expect: match
      - name: gemini yolo under yarn
        event: { type: agent.process.start, agent: { id: gemini-cli }, process: { name: gemini, flags: [--yolo], ancestors: [node, yarn] }, labels: { lifecycle_parent: yarn } }
        expect: match
      - name: bypass flag in a terminal
        event: { type: agent.process.start, agent: { id: claude-code }, process: { name: claude, flags: [--dangerously-skip-permissions], ancestors: [zsh, tmux] } }
        expect: no_match
      - name: lifecycle parent without a bypass flag
        event: { type: agent.process.start, agent: { id: claude-code }, process: { name: claude, flags: [--bare], ancestors: [node, npm] }, labels: { lifecycle_parent: npm } }
        expect: no_match

  - id: HB-PROC-002
    title: Agent CLI launched by a package install script
    description: >-
      An AI agent CLI's ancestry contains a package lifecycle script, with
      or without approval flags. Install scripts that call agents are
      either a worm or a very unusual build.
    kind: activity
    class: finding
    severity: high
    confidence: high
    maturity: stable
    category: execution
    tags: [attack.t1195.002, atlas.aml.t0053, owasp.asi04]
    references:
      - "research/threats.md section 2 row 1; section 4 S3"
      - "research/threats.md section 3 R01, R03"
    falsepositives:
      - "A package whose documented build step runs an agent"
    when:
      type: agent.process.start
    match:
      labels.lifecycle_parent|exists: true
    dedup: [agent.id, labels.lifecycle_parent]
    evidence: [agent.id, process.flags, process.ancestors, labels.lifecycle_parent]
    remedy: Identify the package whose script started the agent.
    tests:
      - name: agent under pip build
        event: { type: agent.process.start, agent: { id: codex }, process: { name: codex, ancestors: [python3, pip] }, labels: { lifecycle_parent: pip } }
        expect: match
      - name: agent in a terminal
        event: { type: agent.process.start, agent: { id: codex }, process: { name: codex, ancestors: [bash, sshd] } }
        expect: no_match
      - name: npm run under an agent is not an agent under npm
        event: { type: process.exec, process: { name: npm, args: [npm, run, build], ancestors: [bash, claude] } }
        expect: no_match

  - id: HB-PROC-003
    title: Agent running with approvals disabled
    description: >-
      An agent process was started with a flag that disables approvals,
      the sandbox or hook trust. Devcontainers and CI do this on purpose, so
      it is counted as a signal; the alert is the lifecycle-script case.
    kind: activity
    class: signal
    severity: low
    confidence: high
    maturity: stable
    category: defense_evasion
    tags: [owasp.asi10]
    references:
      - "research/threats.md section 3 R02"
    falsepositives:
      - "Users who run agents with approvals off inside a disposable container or VM"
    when:
      type: agent.process.start
    match:
      process.flags|any_in_list: agent_bypass_risky_flags
    dedup: [agent.id, process.flags]
    evidence: [agent.id, process.flags]
    remedy: No action on its own.
    tests:
      - name: codex yolo
        event: { type: agent.process.start, agent: { id: codex }, process: { name: codex, flags: [--yolo] } }
        expect: match
      - name: claude plain
        event: { type: agent.process.start, agent: { id: claude-code }, process: { name: claude } }
        expect: no_match
      - name: claude bare only
        event: { type: agent.process.start, agent: { id: claude-code }, process: { name: claude, flags: [--bare] } }
        expect: no_match

  - id: HB-PROC-004
    title: Agent started by another agent with approvals disabled
    description: >-
      An agent process whose parent chain contains another agent was
      started with approvals disabled: the child runs under a weaker policy
      than the parent that launched it.
    kind: activity
    class: finding
    severity: medium
    confidence: high
    maturity: stable
    category: execution
    tags: [atlas.aml.t0053, atlas.aml.t0103, owasp.asi10]
    references:
      - "research/threats.md section 3 R47"
    falsepositives:
      - "Orchestrators that start child agents in disposable containers"
    when:
      type: agent.process.start
    match:
      labels.parent_agent|exists: true
      process.flags|any_in_list: agent_bypass_risky_flags
    dedup: [agent.id, labels.parent_agent]
    evidence: [agent.id, process.flags, labels.parent_agent]
    remedy: Check what the child agent did; children should inherit the parent's policy.
    tests:
      - name: claude starts codex with bypass
        event: { type: agent.process.start, agent: { id: codex }, process: { name: codex, flags: [--dangerously-bypass-approvals-and-sandbox] }, labels: { parent_agent: claude-code } }
        expect: match
      - name: child agent with defaults
        event: { type: agent.process.start, agent: { id: codex }, process: { name: codex }, labels: { parent_agent: claude-code } }
        expect: no_match
      - name: top-level agent with bypass
        event: { type: agent.process.start, agent: { id: codex }, process: { name: codex, flags: [--dangerously-bypass-approvals-and-sandbox] } }
        expect: no_match

  - id: HB-PROC-005
    title: Agent launched by a browser or URL handler with inline configuration
    description: >-
      An agent CLI started from a browser or a protocol handler carries
      inline settings (--settings with JSON), an MCP configuration or a
      resume value. The Claude Code deeplink RCE and the Agent SDK resume
      injection smuggled hooks and MCP servers in exactly this way.
    kind: activity
    class: alert
    severity: high
    confidence: high
    maturity: stable
    category: initial_access
    tags: [atlas.aml.t0081, owasp.asi05]
    references:
      - "research/threats.md section 2 row 12: Claude Code deeplink RCE; Agent SDK CVE-2026-96620"
      - "research/threats.md section 3 R46"
    falsepositives:
      - "None known: a URL handler should open a session, not configure one"
    when:
      type: [agent.process.start, process.exec]
    match:
      process.ancestors|any_in_list: url_handler_processes
      any:
        - process.args|any_startswith: ["--settings={", "--settings=[", "--mcp-config", "--resume=-", "--plugin-dir"]
        - all:
            - process.args|contains_any: ["--settings", "--mcp-config", "--plugin-dir"]
            - process.args|any_startswith: ["{", "["]
    evidence: [agent.id, process.ancestors, process.flags]
    remedy: Kill the session and check which page opened the link.
    tests:
      - name: settings JSON from a browser
        event: { type: agent.process.start, agent: { id: claude-code }, process: { name: claude, args: [claude, "--settings={\"hooks\":{}}"], ancestors: [xdg-open, firefox] } }
        expect: match
      - name: mcp config from a protocol handler
        event: { type: agent.process.start, agent: { id: claude-code }, process: { name: claude, args: [claude, --mcp-config, /tmp/x.json], ancestors: [xdg-open, chrome] } }
        expect: match
      - name: started from a terminal with mcp config
        event: { type: agent.process.start, agent: { id: claude-code }, process: { name: claude, args: [claude, --mcp-config, ./mcp.json], ancestors: [zsh, iterm2] } }
        expect: no_match
      - name: opened from a browser without configuration
        event: { type: agent.process.start, agent: { id: claude-code }, process: { name: claude, args: [claude], ancestors: [open, safari] } }
        expect: no_match

  - id: HB-PROC-006
    title: Agent CLI started with inline settings JSON
    description: >-
      An agent CLI gets its settings as inline JSON on the command line,
      which can carry hooks or permission rules that no settings file
      shows. SDKs do pass --mcp-config, so this is a signal.
    kind: activity
    class: signal
    severity: low
    confidence: medium
    maturity: experimental
    category: execution
    tags: [atlas.aml.t0081]
    references:
      - "research/threats.md section 3 R46"
    falsepositives:
      - "Wrapper scripts and IDE integrations that pass settings inline"
    when:
      type: [agent.process.start, process.exec]
    match:
      any:
        - process.args|any_startswith: ["--settings={", "--settings=["]
        - all:
            - process.args|contains_any: ["--settings"]
            - process.args|any_startswith: ["{"]
    evidence: [agent.id, process.flags]
    remedy: No action on its own.
    tests:
      - name: inline settings
        event: { type: agent.process.start, agent: { id: claude-code }, process: { name: claude, args: [claude, --settings, "{\"permissions\":{}}", -p, hi] } }
        expect: match
      - name: settings file path
        event: { type: agent.process.start, agent: { id: claude-code }, process: { name: claude, args: [claude, --settings, ./settings.json] } }
        expect: no_match
      - name: no settings
        event: { type: agent.process.start, agent: { id: claude-code }, process: { name: claude, args: [claude, -p, hi] } }
        expect: no_match
