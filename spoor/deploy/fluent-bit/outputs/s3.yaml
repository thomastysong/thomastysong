# Cold storage for everything, activity included, gzipped NDJSON per
# stream and hour. Query with Athena/BigQuery/DuckDB over the same schema.
pipeline:
  outputs:
    - name: s3
      alias: spoor_archive
      match: 'spoor.*'
      bucket: ${SPOOR_S3_BUCKET}
      region: ${AWS_REGION:-us-east-1}
      total_file_size: 50M
      upload_timeout: 5m
      compression: gzip
      use_put_object: on
      s3_key_format: /spoor/$TAG[1]/%Y/%m/%d/%H/$UUID.ndjson.gz
      store_dir: ${SPOOR_FLB_STATE:-/var/lib/fluent-bit}/s3
      store_dir_limit_size: 2G
      retry_limit: no_limits
      storage.total_limit_size: 2G
