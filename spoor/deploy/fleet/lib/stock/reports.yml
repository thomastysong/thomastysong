# spoor Fleet content: spoor on plain osquery (stock profile).
# For any osquery 5 host (fleetd or not) with the spoor sensor, reading
# spoor's tables through ATC or the spoor extension.
#
# GENERATED by internal/fleetgen from the state table definitions and
# catalog 2026.11.11. Do not edit: regenerate with
#   go test ./internal/fleetgen -run TestGolden -update
# or write a copy for your hosts' paths with `spoor export fleet`.
# Heartbeat windows: sensor policy 30 minutes, every other spoor policy 24 hours.

- name: spoor - detections
  description: 'spoor detections of the last 7 days, sent to the log destination as they appear (differential, removals ignored: rows that age out or are evicted are not news). Evidence values are never in the state database; join to the detection stream on event_id.'
  query: |-
    SELECT event_id, ts, rule_id, title, severity, confidence, maturity, category, tags, agent_id, user, session_ref, integrity, response, enforced, count, dedup_key
    FROM spoor_detections
    WHERE ts >= strftime('%Y-%m-%dT%H:%M:%S.000000Z', 'now', '-604800 seconds');
  interval: 900
  platform: darwin,linux,windows
  logging: differential_ignore_removals
  automations_enabled: true
  discard_data: false
  observer_can_run: false
- name: spoor - AI inventory (packed)
  description: 'One row per host: AI agents and apps, declared MCP servers (risky first) and extensions with risk flags, each list capped at 100 entries with the true totals alongside, so the host result stays far below Fleet''s 512 KiB limit.'
  query: |-
    WITH a AS MATERIALIZED (SELECT name, kind, catalog_id, version, owner, scope, hooks, running, risk_flags
        FROM spoor_agents WHERE change != 'removed'),
      m AS MATERIALIZED (SELECT name, parent, owner, scope, transport, runner, package, version, pinned, url_host, risk_flags
        FROM spoor_mcp_servers),
      x AS MATERIALIZED (SELECT kind, name, parent, owner, scope, risk_flags FROM spoor_extensions)
    SELECT
      (SELECT count(*) FROM a) AS agents_total,
      (SELECT json_group_array(json_object('name', substr(name, 1, 64), 'kind', substr(kind, 1, 64), 'catalog_id', substr(catalog_id, 1, 64), 'version', substr(version, 1, 64), 'owner', substr(owner, 1, 64), 'scope', substr(scope, 1, 64), 'hooks', substr(hooks, 1, 64), 'running', CAST(running AS INTEGER), 'risk_flags', substr(risk_flags, 1, 256))) FROM (SELECT a.* FROM a ORDER BY catalog_id, owner, name LIMIT 100)) AS agents,
      (SELECT count(*) FROM m) AS mcp_servers_total,
      (SELECT json_group_array(json_object('name', substr(name, 1, 64), 'parent', substr(parent, 1, 64), 'owner', substr(owner, 1, 64), 'scope', substr(scope, 1, 64), 'transport', substr(transport, 1, 64), 'runner', substr(runner, 1, 64), 'package', substr(package, 1, 64), 'version', substr(version, 1, 64), 'pinned', CAST(pinned AS INTEGER), 'url_host', substr(url_host, 1, 64), 'risk_flags', substr(risk_flags, 1, 256))) FROM (SELECT m.* FROM m ORDER BY risk_flags = '', parent, name LIMIT 100)) AS mcp_servers,
      (SELECT count(*) FROM x) AS extensions_total,
      (SELECT json_group_array(json_object('kind', substr(kind, 1, 64), 'name', substr(name, 1, 64), 'parent', substr(parent, 1, 64), 'owner', substr(owner, 1, 64), 'scope', substr(scope, 1, 64), 'risk_flags', substr(risk_flags, 1, 256))) FROM (SELECT x.* FROM x WHERE risk_flags != '' ORDER BY kind, name LIMIT 100)) AS flagged_extensions;
  interval: 14400
  platform: darwin,linux,windows
  logging: snapshot
  automations_enabled: true
  discard_data: false
  observer_can_run: false
- name: spoor - telemetry coverage
  description: Which telemetry surfaces deliver for each agent and user (covered, partial, blind, absent). Not collected must never read as clean.
  query: |-
    SELECT agent_id, user, hooks, transcript, processes, state, updated
    FROM spoor_coverage;
  interval: 3600
  platform: darwin,linux,windows
  logging: snapshot
  automations_enabled: true
  discard_data: false
  observer_can_run: false
- name: spoor - sensor health
  description: 'The sensor''s single health row: version, privacy profile, heartbeat, last scan, rule and bundle versions and counters.'
  query: |-
    SELECT sensor_version, mode, profile, started, heartbeat, last_scan, scan_complete, rules_count, rules_version, rules_hash, catalog_version, bundle_version, events_in, events_out, dropped, detections, errors, host_id, host_id_source
    FROM spoor_health;
  interval: 3600
  platform: darwin,linux,windows
  logging: snapshot
  automations_enabled: true
  discard_data: false
  observer_can_run: false
