# hawkbell Fleet content: hawkbell on plain osquery (stock profile).
# For any osquery 5 host (fleetd or not) with the hawkbell sensor, reading
# hawkbell's tables through ATC or the hawkbell extension.
#
# GENERATED by internal/fleetgen from the state table definitions and
# catalog 2026.11.11. Do not edit: regenerate with
#   go test ./internal/fleetgen -run TestGolden -update
# or write a copy for your hosts' paths with `hawkbell export fleet`.
# Heartbeat windows: sensor policy 30 minutes, every other hawkbell policy 24 hours.

- name: hawkbell installed
  description: The hawkbell binary or its state database exists at the path a system install uses (binary or state database; exact paths, no wildcards). Uses only osquery's file table, so it works before any hawkbell table is available and can scope the rollout.
  query: |-
    SELECT 1 FROM file
    WHERE path IN ('/usr/bin/hawkbell', '/var/lib/hawkbell/state.db', '/usr/local/bin/hawkbell', '/Library/Application Support/hawkbell/state.db', 'C:\Program Files\hawkbell\hawkbell.exe', 'C:\ProgramData\hawkbell\state.db')
      AND CASE (SELECT build_platform FROM osquery_info)
        WHEN 'linux' THEN path IN ('/usr/bin/hawkbell', '/var/lib/hawkbell/state.db')
        WHEN 'darwin' THEN path IN ('/usr/local/bin/hawkbell', '/Library/Application Support/hawkbell/state.db')
        WHEN 'windows' THEN path IN ('C:\Program Files\hawkbell\hawkbell.exe', 'C:\ProgramData\hawkbell\state.db')
        ELSE 0 END
    LIMIT 1;
  label_membership_type: dynamic
- name: AI agents present
  description: hawkbell's inventory lists at least one AI agent, AI app or IDE extension, AI browser or local model runtime that has not been removed.
  query: |-
    SELECT 1 FROM hawkbell_agents WHERE change != 'removed' LIMIT 1;
  label_membership_type: dynamic
- name: hawkbell sensor unhealthy
  description: hawkbell is installed but its heartbeat is older than 30 minutes or missing. A host whose hawkbell tables are not loaded at all cannot answer this query; it appears in "hawkbell tables unavailable" instead.
  query: |-
    SELECT 1 FROM file
    WHERE path IN ('/usr/bin/hawkbell', '/var/lib/hawkbell/state.db', '/usr/local/bin/hawkbell', '/Library/Application Support/hawkbell/state.db', 'C:\Program Files\hawkbell\hawkbell.exe', 'C:\ProgramData\hawkbell\state.db')
      AND CASE (SELECT build_platform FROM osquery_info)
        WHEN 'linux' THEN path IN ('/usr/bin/hawkbell', '/var/lib/hawkbell/state.db')
        WHEN 'darwin' THEN path IN ('/usr/local/bin/hawkbell', '/Library/Application Support/hawkbell/state.db')
        WHEN 'windows' THEN path IN ('C:\Program Files\hawkbell\hawkbell.exe', 'C:\ProgramData\hawkbell\state.db')
        ELSE 0 END
      AND NOT EXISTS (SELECT 1 FROM hawkbell_health WHERE heartbeat >= strftime('%Y-%m-%dT%H:%M:%S.000000Z', 'now', '-1800 seconds'))
    LIMIT 1;
  label_membership_type: dynamic
- name: hawkbell tables unavailable
  description: 'hawkbell is installed but osquery has no hawkbell_health table: the extension is not loaded (also when Fleet manages osquery extensions on a fleetd host) or the ATC agent options did not arrive. hawkbell policies get no response from such a host.'
  query: |-
    SELECT 1 FROM file
    WHERE path IN ('/usr/bin/hawkbell', '/var/lib/hawkbell/state.db', '/usr/local/bin/hawkbell', '/Library/Application Support/hawkbell/state.db', 'C:\Program Files\hawkbell\hawkbell.exe', 'C:\ProgramData\hawkbell\state.db')
      AND CASE (SELECT build_platform FROM osquery_info)
        WHEN 'linux' THEN path IN ('/usr/bin/hawkbell', '/var/lib/hawkbell/state.db')
        WHEN 'darwin' THEN path IN ('/usr/local/bin/hawkbell', '/Library/Application Support/hawkbell/state.db')
        WHEN 'windows' THEN path IN ('C:\Program Files\hawkbell\hawkbell.exe', 'C:\ProgramData\hawkbell\state.db')
        ELSE 0 END
      AND NOT EXISTS (SELECT 1 FROM osquery_registry
        WHERE registry = 'table' AND name = 'hawkbell_health' AND active = 1)
    LIMIT 1;
  label_membership_type: dynamic
