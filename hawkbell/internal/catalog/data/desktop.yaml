# hawkbell catalog: desktop AI assistants, agent orchestrator GUIs and other
# desktop AI apps. Provenance and conventions are described at the top of
# agents.yaml. Bundle ids and state paths come from each app's Homebrew cask.
version: "2026.11.11"

products:
  - id: claude-desktop
    name: Claude Desktop
    vendor: Anthropic
    kind: app
    # claude-code: on Windows both run as claude.exe.
    aliases: [claude-code, cowork, Claude Cowork]
    binaries: [claude-desktop]
    process_names: [Claude, Claude Helper]
    packages: [cask:claude, scoop:claude, apt:claude-desktop, winget:Anthropic.Claude]
    bundle_ids: [com.anthropic.claudefordesktop]
    win_display: ["^Claude$"]
    appx: [Claude_pzs8sxrjxfjjc]
    install_paths:
      darwin: ["/Applications/Claude.app"]
      windows: ['%LOCALAPPDATA%\AnthropicClaude']
    state_dirs:
      darwin: ["~/Library/Application Support/Claude"]
      linux: ["~/.config/Claude"]
      windows: ['%APPDATA%\Claude']
    env_markers: [CLAUDE_CODE_IS_COWORK]
    mcp:
      - paths:
          darwin: ["~/Library/Application Support/Claude/claude_desktop_config.json"]
          linux: ["~/.config/Claude/claude_desktop_config.json"]
          windows: ['%APPDATA%\Claude\claude_desktop_config.json']
        format: mcpServers
        scope: user
    transcript:
      format: cowork-audit
      globs:
        darwin: ["~/Library/Application Support/Claude/local-agent-mode-sessions/**/audit.jsonl"]
    api_hosts: [claude.ai, api.anthropic.com, downloads.claude.ai]
    signers: {darwin_team_id: Q6L2SF6YDW, windows_publisher: "Anthropic, PBC"}
    capabilities: [executes_shell, edits_files, browses, mcp_client, computer_use]
    notes: >-
      Includes Cowork and the Code tab. claude_desktop_config.json is also
      loaded into local Code sessions. Cowork on Linux runs a QEMU/KVM guest,
      so expect qemu-system-* children. On SSH remotes it leaves helpers
      under ~/.claude/remote/.
    sources:
      - https://raw.githubusercontent.com/Homebrew/homebrew-cask/master/Casks/c/claude.rb
      - https://raw.githubusercontent.com/ScoopInstaller/Extras/master/bucket/claude.json
      - https://raw.githubusercontent.com/fleetdm/fleet/main/ee/maintained-apps/outputs/apps.json
      - https://code.claude.com/docs/en/desktop-linux.md
      - https://raw.githubusercontent.com/perplexityai/numbat/main/docs/agent-coverage.md
      - research:agent-surfaces-b.md#1b
    unverified: [appx, signers, install_paths.windows, env_markers, packages]

  - id: chatgpt
    name: ChatGPT
    vendor: OpenAI
    kind: app
    # codex: the unified app shares ~/.codex with the Codex CLI and took
    # over the bundle id and process name of the former Codex.app.
    aliases: [chatgpt-desktop, codex-app, Codex desktop, codex]
    process_names: [ChatGPT, Codex]
    packages: [cask:chatgpt, cask:codex-app, scoop:chatgpt]
    bundle_ids: [com.openai.codex, com.openai.chat]
    win_display: ["^ChatGPT"]
    install_paths:
      darwin: ["/Applications/ChatGPT.app", "/Applications/Codex.app"]
    state_dirs:
      all: ["~/.codex"]
      darwin:
        - "~/Library/Application Support/Codex"
        - "~/Library/Application Support/com.openai.codex"
        - "~/Library/Application Support/OpenAI/Codex"
        - "/Library/Application Support/CodexComputerUseAuthorizationPlugin"
    mcp:
      - {paths: ["~/.codex/config.toml"], format: codex.toml, scope: user}
    api_hosts: [chatgpt.com, api.openai.com, persistent.oaistatic.com]
    signers: {darwin_team_id: 2DC432GLL2}
    capabilities: [executes_shell, edits_files, browses, mcp_client, computer_use, cloud_execution]
    notes: >-
      Since mid-2026 ChatGPT.app is the unified Chat, Work and Codex app and
      carries bundle id com.openai.codex; com.openai.chat is the older chat
      app. The computer-use helper is com.openai.sky.CUAService.
    sources:
      - https://raw.githubusercontent.com/Homebrew/homebrew-cask/master/Casks/c/chatgpt.rb
      - https://raw.githubusercontent.com/Homebrew/homebrew-cask/master/Casks/c/codex-app.rb
      - https://raw.githubusercontent.com/ScoopInstaller/Extras/master/bucket/chatgpt.json
      - research:agent-surfaces-b.md#1b
    unverified: [win_display, signers, api_hosts, mcp]

