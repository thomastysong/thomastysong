# hawkbell Fleet content: hawkbell on plain osquery (stock profile).
# For any osquery 5 host (fleetd or not) with the hawkbell sensor, reading
# hawkbell's tables through ATC or the hawkbell extension.
#
# GENERATED by internal/fleetgen from the state table definitions and
# catalog 2026.11.11. Do not edit: regenerate with
#   go test ./internal/fleetgen -run TestGolden -update
# or write a copy for your hosts' paths with `hawkbell export fleet`.
# Heartbeat windows: sensor policy 30 minutes, every other hawkbell policy 24 hours.

- name: hawkbell - sensor is reporting
  description: 'The hawkbell sensor wrote a heartbeat to its state database in the last 30 minutes. This is the policy to alert on: every other hawkbell policy only fails after 24 hours without a heartbeat, so that a laptop waking from sleep does not turn them all red.'
  resolution: Check that the hawkbell service is installed and running (`hawkbell doctor`) and that the state database path in the agent options matches the sensor's configuration.
  query: |-
    SELECT 1 WHERE EXISTS (SELECT 1 FROM hawkbell_health WHERE heartbeat >= strftime('%Y-%m-%dT%H:%M:%S.000000Z', 'now', '-1800 seconds'));
  platform: darwin,linux,windows
  critical: false
- name: hawkbell - managed hooks effective for every AI agent
  description: 'Every installed agent whose hook protocol hawkbell speaks (claude-code, codex, copilot-cli, cursor, cursor-agent, gemini-cli) has hawkbell''s managed hooks in place and unmodified. User-scope hooks do not count: the user can remove them. Fails closed: it also fails when the sensor has not written a heartbeat in 24 hours or its database is missing, because a missing database reads as empty tables.'
  resolution: Run `hawkbell hooks status` on the host, then `hawkbell hooks install --scope managed`. For 'shadowed', deliver the hooks through the higher-precedence policy source the agent reads.
  query: |-
    SELECT 1 WHERE EXISTS (SELECT 1 FROM hawkbell_health WHERE heartbeat >= strftime('%Y-%m-%dT%H:%M:%S.000000Z', 'now', '-86400 seconds')) AND NOT EXISTS (SELECT 1 FROM hawkbell_agents
    WHERE change != 'removed'
      AND catalog_id IN ('claude-code', 'codex', 'copilot-cli', 'cursor', 'cursor-agent', 'gemini-cli')
      AND hooks != 'managed');
  platform: darwin,linux,windows
  critical: false
- name: hawkbell - no high or critical agent detections in 24 h
  description: 'No hawkbell detection of severity high or critical was recorded on this host in the last 24 hours. Fails closed: it also fails when the sensor has not written a heartbeat in 24 hours or its database is missing, because a missing database reads as empty tables.'
  resolution: Review the detection in your SIEM (join on event_id) and the agent session it belongs to (session_ref); hawkbell_detections lists the rule and the user.
  query: |-
    SELECT 1 WHERE EXISTS (SELECT 1 FROM hawkbell_health WHERE heartbeat >= strftime('%Y-%m-%dT%H:%M:%S.000000Z', 'now', '-86400 seconds')) AND NOT EXISTS (SELECT 1 FROM hawkbell_detections
    WHERE severity IN ('high', 'critical')
      AND ts >= strftime('%Y-%m-%dT%H:%M:%S.000000Z', 'now', '-86400 seconds'));
  platform: darwin,linux,windows
  critical: false
- name: hawkbell - no AI agent in permission-bypass mode
  description: 'No AI agent ran with tool approvals switched off in the last 24 hours (command-line switches such as --dangerously-skip-permissions, --yolo, --dangerously-bypass-approvals-and-sandbox), none is configured to do so by default, and no session reported bypass mode. Fails closed: it also fails when the sensor has not written a heartbeat in 24 hours or its database is missing, because a missing database reads as empty tables.'
  resolution: Remove the switch from the launcher or alias that starts the agent and the bypass default from its settings; enforce the managed setting that disables bypass mode where the agent has one.
  query: |-
    SELECT 1 WHERE EXISTS (SELECT 1 FROM hawkbell_health WHERE heartbeat >= strftime('%Y-%m-%dT%H:%M:%S.000000Z', 'now', '-86400 seconds')) AND NOT EXISTS (SELECT 1 FROM hawkbell_agent_processes
    WHERE last_seen >= strftime('%Y-%m-%dT%H:%M:%S.000000Z', 'now', '-86400 seconds')
      AND (instr(',' || flags || ',', ',--allow-all,') > 0
        OR instr(',' || flags || ',', ',--allow-all-tools,') > 0
        OR instr(',' || flags || ',', ',--approval-mode yolo,') > 0
        OR instr(',' || flags || ',', ',--ask-for-approval never,') > 0
        OR instr(',' || flags || ',', ',--auto_run,') > 0
        OR instr(',' || flags || ',', ',--dangerously-bypass-approvals-and-sandbox,') > 0
        OR instr(',' || flags || ',', ',--dangerously-skip-permissions,') > 0
        OR instr(',' || flags || ',', ',--force,') > 0
        OR instr(',' || flags || ',', ',--permission-mode bypassPermissions,') > 0
        OR instr(',' || flags || ',', ',--yes,') > 0
        OR instr(',' || flags || ',', ',--yes-always,') > 0
        OR instr(',' || flags || ',', ',--yolo,') > 0
        OR instr(',' || flags || ',', ',-y,') > 0)
    UNION ALL
    SELECT 1 FROM hawkbell_agents
    WHERE change != 'removed'
      AND (instr(',' || risk_flags || ',', ',allow_all_tools_env,') > 0
        OR instr(',' || risk_flags || ',', ',approvals_disabled,') > 0
        OR instr(',' || risk_flags || ',', ',auto_approve_all_tools,') > 0
        OR instr(',' || risk_flags || ',', ',bypass_permissions_default,') > 0)
    UNION ALL
    SELECT 1 FROM hawkbell_sessions
    WHERE permission_mode = 'bypass'
      AND last_event >= strftime('%Y-%m-%dT%H:%M:%S.000000Z', 'now', '-86400 seconds'));
  platform: darwin,linux,windows
  critical: false
- name: hawkbell - no unpinned or inline-secret MCP server
  description: 'No MCP server declared in an agent configuration on this host launches an unpinned package or image, or carries a credential in its arguments, environment, headers or URL. Fails closed: it also fails when the sensor has not written a heartbeat in 24 hours or its database is missing, because a missing database reads as empty tables.'
  resolution: Pin the package to an exact version (or the image to a digest) and move secrets to the environment or a credential helper; hawkbell_mcp_servers lists the declaring file.
  query: |-
    SELECT 1 WHERE EXISTS (SELECT 1 FROM hawkbell_health WHERE heartbeat >= strftime('%Y-%m-%dT%H:%M:%S.000000Z', 'now', '-86400 seconds')) AND NOT EXISTS (SELECT 1 FROM hawkbell_mcp_servers
    WHERE (instr(',' || risk_flags || ',', ',unpinned_package,') > 0
        OR instr(',' || risk_flags || ',', ',inline_secret,') > 0
        OR instr(',' || risk_flags || ',', ',token_in_url,') > 0));
  platform: darwin,linux,windows
  critical: false
- name: hawkbell - no auto-run file planted in a project
  description: 'No project an agent worked in contains a control file that makes an agent or editor run something as soon as the folder is opened (project hooks, always-on rules, folder-open tasks, .git/config exec keys, workspace executable paths). Fails closed: it also fails when the sensor has not written a heartbeat in 24 hours or its database is missing, because a missing database reads as empty tables.'
  resolution: Inspect the file named in hawkbell_extensions.source_path; if nobody on the team added it, treat the repository as compromised.
  query: |-
    SELECT 1 WHERE EXISTS (SELECT 1 FROM hawkbell_health WHERE heartbeat >= strftime('%Y-%m-%dT%H:%M:%S.000000Z', 'now', '-86400 seconds')) AND NOT EXISTS (SELECT 1 FROM hawkbell_extensions
    WHERE kind = 'project_config'
      AND (instr(',' || risk_flags || ',', ',autorun_hook,') > 0
        OR instr(',' || risk_flags || ',', ',autorun_rule,') > 0
        OR instr(',' || risk_flags || ',', ',autorun_task,') > 0
        OR instr(',' || risk_flags || ',', ',git_exec_key,') > 0
        OR instr(',' || risk_flags || ',', ',ide_exec_path_in_workspace,') > 0));
  platform: darwin,linux,windows
  critical: false
- name: hawkbell - rules bundle is current
  description: 'The sensor has a signed content bundle of version 1 or later installed. Raise the minimum (`hawkbell export fleet --min-bundle-version`) each time you publish a bundle; remove this policy if you ship rules only with the binary. Fails closed: it also fails when the sensor has not written a heartbeat in 24 hours or its database is missing, because a missing database reads as empty tables.'
  resolution: Check the bundle URL and key in the sensor configuration and `hawkbell bundle pull` on the host.
  query: |-
    SELECT 1 WHERE EXISTS (SELECT 1 FROM hawkbell_health WHERE heartbeat >= strftime('%Y-%m-%dT%H:%M:%S.000000Z', 'now', '-86400 seconds')) AND NOT EXISTS (SELECT 1 FROM hawkbell_health
    WHERE bundle_version = ''
      OR CAST(bundle_version AS INTEGER) < 1);
  platform: darwin,linux,windows
  critical: false
- name: hawkbell - inventory scan complete and recent
  description: 'The last discovery scan finished without hitting its deadline, within the last 26 hours. Fails closed: it also fails when the sensor has not written a heartbeat in 24 hours or its database is missing, because a missing database reads as empty tables.'
  resolution: Look at the sensor's health stream for scan errors; a scan that keeps timing out usually means an unreachable or very large home directory.
  query: |-
    SELECT 1 WHERE EXISTS (SELECT 1 FROM hawkbell_health WHERE heartbeat >= strftime('%Y-%m-%dT%H:%M:%S.000000Z', 'now', '-86400 seconds')) AND NOT EXISTS (SELECT 1 FROM hawkbell_health WHERE CAST(scan_complete AS INTEGER) != 1 OR last_scan < strftime('%Y-%m-%dT%H:%M:%S.000000Z', 'now', '-93600 seconds'));
  platform: darwin,linux,windows
  critical: false
- name: hawkbell - no AI agent running unobserved
  description: 'No agent and user pair is in coverage state ''blind'' (a running agent with no telemetry surface delivering). Fails closed: it also fails when the sensor has not written a heartbeat in 24 hours or its database is missing, because a missing database reads as empty tables.'
  resolution: Check hook installation and transcript access for the listed agent and user.
  query: |-
    SELECT 1 WHERE EXISTS (SELECT 1 FROM hawkbell_health WHERE heartbeat >= strftime('%Y-%m-%dT%H:%M:%S.000000Z', 'now', '-86400 seconds')) AND NOT EXISTS (SELECT 1 FROM hawkbell_coverage WHERE state = 'blind');
  platform: darwin,linux,windows
  critical: false
- name: hawkbell - no high or critical agent configuration failure
  description: 'No posture check of severity high or critical is currently failing. Fails closed: it also fails when the sensor has not written a heartbeat in 24 hours or its database is missing, because a missing database reads as empty tables.'
  resolution: Apply the remedy column of the failing rows in hawkbell_posture.
  query: |-
    SELECT 1 WHERE EXISTS (SELECT 1 FROM hawkbell_health WHERE heartbeat >= strftime('%Y-%m-%dT%H:%M:%S.000000Z', 'now', '-86400 seconds')) AND NOT EXISTS (SELECT 1 FROM hawkbell_posture WHERE severity IN ('high', 'critical'));
  platform: darwin,linux,windows
  critical: false
