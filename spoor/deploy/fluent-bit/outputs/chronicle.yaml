# Google SecOps (Chronicle) unstructured log ingestion. Needs a parser on
# the SecOps side for the custom log type.
pipeline:
  outputs:
    - name: chronicle
      alias: spoor_chronicle
      match_regex: '^spoor\.(detection|summary|health|posture|inventory|parse_error)$'
      google_service_credentials: ${CHRONICLE_CREDENTIALS_FILE}
      customer_id: ${CHRONICLE_CUSTOMER_ID}
      log_type: ${CHRONICLE_LOG_TYPE:-SPOOR}
      region: ${CHRONICLE_REGION:-US}
      retry_limit: no_limits
      storage.total_limit_size: 512M
