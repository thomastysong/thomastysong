# Reviewed labels for sampled benign-replay hits (bench/results/benign-replay.md).
# Keyed by rule and transcript event id (deterministic: the same logs give the
# same ids). Labels: false_positive (ordinary work), red_team (a deliberate
# security experiment: an attack, tamper or evasion technique run on purpose to
# test a defence; a true positive without malice), rule_bug (the rule matched
# something it was not written to match), true_positive (the behaviour the rule
# describes, done for real, here with a benign intent).
# A hit that matches a case in the rule's own falsepositives list (installing
# or configuring the sensor, restarting osqueryd after a config change, a
# client pointed at a mock server, an official installer) is false_positive,
# whatever the role of the thread. One activity gets one label across rules
# unless the matched fact differs in kind.
# Each was decided by reading the full command in the transcript and the role
# of the agent thread (from the workflow journal labels). The release review
# (2026-11-12) applied the falsepositives rule and relabelled 21 entries; their
# reasons say what they were before.
# The corpora were recorded before the rename from the working name spoor to
# hawkbell. The replays read them with `benchrun -old-name`, which rewrites the
# old name in the session text as the repository was rewritten (RewriteOldName
# in internal/bench/oldname.go; the Corpus line of each report says so). Event
# ids and reasons refer to that text.
