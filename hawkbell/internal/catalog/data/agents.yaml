# hawkbell catalog: terminal and headless agents, wrappers and agent SDKs.
#
# Provenance. Fingerprints were checked on 2026-11-11 against the primary
# sources named in each entry's `sources` (vendor docs, Homebrew casks, the npm
# and PyPI registries, Scoop manifests, upstream source). Path and id tables
# were cross-checked with, and partly derive from, uber/ADR catalog.json
# (Apache-2.0), snyk/agent-scan well_known_clients.py (Apache-2.0),
# perplexityai/numbat docs/agent-coverage.md and docs/deployment.md
# (Apache-2.0) and karmine05/agentic-detector as vendored in fleetdm/fleet
# (MIT). Anything not verified is named in the entry's `unverified` list.
#
# `research:<file>` sources refer to the research notes kept with the design.
version: "2026.11.11"

# Process names that are not identity on their own. Each one collides with
# unrelated software (brew goose is a database migration tool, brew amp a text
# editor, q a DNS client, /usr/sbin/zed the ZFS event daemon, copilot the AWS
# ECS CLI, code the launcher shim that Cursor and Kiro also ship) or is an
# ordinary word. MatchProcess needs a second class of evidence for these.
ambiguous_names:
  [goose, amp, q, agent, gemini, zed, warp, forge, hermes, happy, vibe, coder,
   exo, nanobot, interpreter, mini, jan, copilot, air, dia, arc, comet, poe,
   foundry, grok, void, devin, code, kilo, omp, highlight, superset, conductor,
   factory, muse, cody, jules, letta, llm]

products:
  # ---------------------------------------------------------------- majors
  - id: claude-code
    name: Claude Code
    vendor: Anthropic
    kind: agent
    # claude-desktop: both run as claude(.exe) on Windows.
    aliases: [claude-desktop]
    binaries: [claude]
    # The npm package became a native binary with per-platform optional
    # packages; cli.js is the entry point of older releases.
    process_args:
      - '@anthropic-ai[/\\]claude-code(-[a-z0-9]+)*[/\\]'
    packages:
      - npm:@anthropic-ai/claude-code
      - cask:claude-code
      - cask:claude-code@latest
      - winget:Anthropic.ClaudeCode
      - scoop:claude-code
      - apt:claude-code
      - rpm:claude-code
      - apk:claude-code
    install_paths:
      posix: ["~/.local/bin/claude", "~/.local/share/claude/versions/*", "~/.claude/local"]
      darwin: ["~/.local/share/claude/ClaudeCode.app"]
      windows: ["~/.local/bin/claude.exe", "~/.local/share/claude/versions/*"]
    state_dirs: ["~/.claude"]
    home_env: [CLAUDE_CONFIG_DIR]
    # CLAUDE_PROJECT_DIR is not listed: Gemini CLI and Cursor set it too for
    # hook compatibility, so it does not mark a Claude Code child.
    env_markers: [CLAUDECODE, CLAUDE_CODE_CHILD_SESSION, CLAUDE_CODE_REMOTE]
    session_env: [CLAUDE_CODE_SESSION_ID, CLAUDE_CODE_REMOTE_SESSION_ID, CLAUDE_CODE_BRIDGE_SESSION_ID]
    mcp:
      - {paths: ["~/.claude.json"], format: claude.json, scope: user}
      - {project_paths: [".mcp.json"], format: mcpServers, scope: project}
      - paths:
          darwin: ["/Library/Application Support/ClaudeCode/managed-mcp.json"]
          linux: ["/etc/claude-code/managed-mcp.json"]
          windows: ['C:\Program Files\ClaudeCode\managed-mcp.json']
        format: mcpServers
        scope: managed
      - {paths: ["${CLAUDE_CONFIG_DIR:-~/.claude}/plugins/cache/**/.mcp.json"], format: mcpServers, scope: plugin}
    skills: ["${CLAUDE_CONFIG_DIR:-~/.claude}/skills", "./.claude/skills"]
    rules: ["${CLAUDE_CONFIG_DIR:-~/.claude}/CLAUDE.md", "${CLAUDE_CONFIG_DIR:-~/.claude}/rules", "./CLAUDE.md", "./.claude/CLAUDE.md", "./.claude/rules"]
    plugins: ["${CLAUDE_CONFIG_DIR:-~/.claude}/plugins"]
    subagents: ["${CLAUDE_CONFIG_DIR:-~/.claude}/agents", "./.claude/agents"]
    commands: ["${CLAUDE_CONFIG_DIR:-~/.claude}/commands", "./.claude/commands"]
    transcript:
      format: claude-jsonl
      globs:
        - "${CLAUDE_CONFIG_DIR:-~/.claude}/projects/*/*.jsonl"
        - "${CLAUDE_CONFIG_DIR:-~/.claude}/projects/*/*/subagents/agent-*.jsonl"
      home_env: CLAUDE_CONFIG_DIR
    hooks:
      dialect: claude
      managed_paths:
        darwin: ["/Library/Application Support/ClaudeCode/managed-settings.d/50-hawkbell.json"]
        linux: ["/etc/claude-code/managed-settings.d/50-hawkbell.json"]
        windows: ['C:\Program Files\ClaudeCode\managed-settings.d\50-hawkbell.json']
      user_paths: ["${CLAUDE_CONFIG_DIR:-~/.claude}/settings.json"]
      project_paths: [".claude/settings.json", ".claude/settings.local.json"]
      notes: >-
        Managed sources, highest first: server-managed (claude.ai admin console),
        MDM (macOS managed preferences domain com.anthropic.claudecode; Windows
        HKLM\SOFTWARE\Policies\ClaudeCode value Settings), then the files
        managed-settings.json and managed-settings.d/*.json. The default
        managedSourcesBehavior is first-wins, so a server-managed policy
        shadows a file deployed by Fleet unless it is set to merge. Managed
        hooks survive disableAllHooks and --safe-mode; allowManagedHooksOnly
        blocks user, project and plugin hooks. Plugins and skill/agent
        frontmatter can also declare hooks.
    risky_flags:
      - --dangerously-skip-permissions
      - --allow-dangerously-skip-permissions
      - --permission-mode bypassPermissions
      - --permission-mode dontAsk
      - --permission-mode auto
      - --permission-mode acceptEdits
      - --bare
      - --safe-mode
      - --no-session-persistence
      - --dangerously-load-development-channels
    settings:
      - &cc_user
        file: &cc_user_files ["${CLAUDE_CONFIG_DIR:-~/.claude}/settings.json", "./.claude/settings.json", "./.claude/settings.local.json"]
        format: json
        key: permissions.defaultMode
        op: eq
        value: bypassPermissions
        flag: bypass_permissions_default
        severity: high
      - {<<: *cc_user, op: in, value: "dontAsk,auto", flag: auto_approve_default, severity: medium}
      - {<<: *cc_user, key: skipDangerousModePermissionPrompt, op: eq, value: "true", flag: bypass_warning_accepted, severity: medium}
      - {<<: *cc_user, key: disableAllHooks, op: eq, value: "true", flag: hooks_disabled, severity: high}
      - {<<: *cc_user, key: sandbox.enabled, op: eq, value: "false", flag: sandbox_disabled, severity: medium}
      - {<<: *cc_user, key: sandbox.allowUnsandboxedCommands, op: eq, value: "true", flag: unsandboxed_commands_allowed, severity: low}
      - {file: *cc_user_files, format: json, key: env.ANTHROPIC_BASE_URL, op: exists, flag: api_base_url_override, severity: medium}
      - &cc_managed
        file:
          darwin: ["/Library/Application Support/ClaudeCode/managed-settings.json"]
          linux: ["/etc/claude-code/managed-settings.json"]
          windows: ['C:\Program Files\ClaudeCode\managed-settings.json']
        format: json
        key: allowManagedHooksOnly
        op: ne
        value: "true"
        flag: managed_hooks_not_exclusive
        severity: info
      - {<<: *cc_managed, key: permissions.disableBypassPermissionsMode, value: disable, flag: bypass_mode_not_locked, severity: low}
      - {file: {windows: ['HKLM\SOFTWARE\Policies\ClaudeCode']}, format: registry, key: Settings, op: exists, flag: managed_policy_present, severity: info}
      - {file: {darwin: ["/Library/Managed Preferences/com.anthropic.claudecode.plist"]}, format: plist, key: "*", op: exists, flag: managed_policy_present, severity: info}
      - {format: env, key: CLAUDE_CODE_SIMPLE, op: exists, flag: bare_mode_hooks_skipped, severity: high}
      - {format: env, key: CLAUDE_CODE_SAFE_MODE, op: exists, flag: safe_mode_user_hooks_skipped, severity: low}
      - {format: env, key: CLAUDE_CODE_SKIP_PROMPT_HISTORY, op: exists, flag: transcript_suppressed, severity: medium}
      - {format: env, key: CLAUDE_CONFIG_DIR, op: exists, flag: state_dir_relocated, severity: low}
      - {format: env, key: ANTHROPIC_BASE_URL, op: exists, flag: api_base_url_override, severity: medium}
    api_hosts: [api.anthropic.com, claude.ai, platform.claude.com, mcp-proxy.anthropic.com, downloads.claude.ai]
    signers: {darwin_team_id: Q6L2SF6YDW, windows_publisher: "Anthropic, PBC"}
    capabilities: [executes_shell, edits_files, mcp_client]
    sources:
      - https://code.claude.com/docs/en/hooks.md
      - https://code.claude.com/docs/en/managed-settings.md
      - https://code.claude.com/docs/en/env-vars.md
      - https://code.claude.com/docs/en/setup.md
      - https://registry.npmjs.org/@anthropic-ai/claude-code/latest
      - https://raw.githubusercontent.com/Homebrew/homebrew-cask/master/Casks/c/claude-code.rb
      - research:agent-surfaces-a.md#2
    # The team id is from memory; setup.md only names the signer
    # "Anthropic PBC". The plist path is the conventional location of the
    # documented managed-preferences domain.
    unverified: [signers.darwin_team_id]

  - id: codex
    name: Codex CLI
    vendor: OpenAI
    kind: agent
    # chatgpt: ChatGPT.app (bundle id com.openai.codex) shares ~/.codex and
    # the process name "Codex" of the former Codex.app.
    aliases: [codex-cli, chatgpt]
    binaries: [codex]
    packages: [npm:@openai/codex, cask:codex, scoop:codex]
    state_dirs: ["~/.codex"]
    home_env: [CODEX_HOME]
    env_markers: [CODEX_SANDBOX, CODEX_SANDBOX_NETWORK_DISABLED, CODEX_VERSION, CODEX_PERMISSION_PROFILE, CODEX_TOOL_CALL_ID, CODEX_CI]
    session_env: [CODEX_SESSION_ID, CODEX_THREAD_ID]
    mcp:
      - {paths: ["${CODEX_HOME:-~/.codex}/config.toml"], format: codex.toml, scope: user}
      - {project_paths: [".codex/config.toml"], format: codex.toml, scope: project}
      - paths:
          posix: ["/etc/codex/config.toml"]
          windows: ['%ProgramData%\OpenAI\Codex\config.toml']
        format: codex.toml
        scope: system
      - paths:
          posix: ["/etc/codex/requirements.toml", "/etc/codex/managed_config.toml"]
          windows: ['%ProgramData%\OpenAI\Codex\requirements.toml']
        format: codex.toml
        scope: managed
    skills: ["${CODEX_HOME:-~/.codex}/skills"]
    rules: ["${CODEX_HOME:-~/.codex}/AGENTS.md", "./AGENTS.md"]
    plugins: ["${CODEX_HOME:-~/.codex}/plugins"]
    transcript:
      format: codex-rollout
      globs:
        - "${CODEX_HOME:-~/.codex}/sessions/*/*/*/rollout-*.jsonl"
        - "${CODEX_HOME:-~/.codex}/sessions/*/*/*/rollout-*.jsonl.zst"
        - "${CODEX_HOME:-~/.codex}/archived_sessions/**/rollout-*.jsonl"
        - "${CODEX_HOME:-~/.codex}/archived_sessions/**/rollout-*.jsonl.zst"
      home_env: CODEX_HOME
    hooks:
      dialect: codex
      managed_paths:
        posix: ["/etc/codex/requirements.toml"]
        windows: ['%ProgramData%\OpenAI\Codex\requirements.toml']
      user_paths: ["${CODEX_HOME:-~/.codex}/hooks.json", "${CODEX_HOME:-~/.codex}/config.toml"]
      project_paths: [".codex/hooks.json", ".codex/config.toml"]
      notes: >-
        Managed hooks are the [hooks] table of requirements.toml, which hawkbell
        edits as a marked block rather than owning the file. On macOS the
        same content can arrive through the MDM domain com.openai.codex
        (requirements_toml_base64). allow_managed_hooks_only is honoured only
        in requirements.toml. Non-managed hooks need persisted trust unless
        --dangerously-bypass-hook-trust is given, and project .codex layers
        are ignored in untrusted projects. permissionDecision "ask" and a bare
        "allow" are unsupported and fail open; exit code 2 blocks.
    risky_flags:
      - --dangerously-bypass-approvals-and-sandbox
      - --yolo
      - --sandbox danger-full-access
      - --ask-for-approval never
      - --dangerously-bypass-hook-trust
      - --approve-for-me
      - --not-so-yolo
      - --full-auto
      - --ephemeral
      - --ignore-user-config
      - --ignore-rules
    settings:
      - &codex_user
        file: ["${CODEX_HOME:-~/.codex}/config.toml", "./.codex/config.toml"]
        format: toml
        key: approval_policy
        op: eq
        value: never
        flag: approvals_disabled
        severity: high
      - {<<: *codex_user, key: sandbox_mode, value: danger-full-access, flag: sandbox_disabled, severity: high}
      - {<<: *codex_user, key: "projects.*.trust_level", value: trusted, flag: project_trusted, severity: info}
      - {<<: *codex_user, key: history.persistence, value: none, flag: prompt_history_disabled, severity: low}
      - file:
          posix: ["/etc/codex/requirements.toml"]
          windows: ['%ProgramData%\OpenAI\Codex\requirements.toml']
        format: toml
        key: allow_managed_hooks_only
        op: ne
        value: "true"
        flag: managed_hooks_not_exclusive
        severity: info
      - {file: {darwin: ["/Library/Managed Preferences/com.openai.codex.plist"]}, format: plist, key: "*", op: exists, flag: managed_policy_present, severity: info}
      - {format: env, key: CODEX_HOME, op: exists, flag: state_dir_relocated, severity: low}
      - {format: env, key: OPENAI_BASE_URL, op: exists, flag: api_base_url_override, severity: medium}
    api_hosts: [api.openai.com, chatgpt.com]
    capabilities: [executes_shell, edits_files, mcp_client]
    sources:
      - https://raw.githubusercontent.com/openai/codex/main/codex-rs/core/config.schema.json
      - https://raw.githubusercontent.com/openai/codex/main/docs/config.md
      - https://registry.npmjs.org/@openai/codex/latest
      - https://raw.githubusercontent.com/Homebrew/homebrew-cask/master/Casks/c/codex.rb
      - research:agent-surfaces-a.md#3
      - research:os-telemetry.md#5
    # --full-auto no longer exists on main and is kept for older releases;
    # the layout under archived_sessions and the hosts are not confirmed.
    unverified: [api_hosts, skills, plugins, rules]

  - id: copilot-cli
    name: GitHub Copilot CLI
    vendor: GitHub
    kind: agent
    # github-copilot and github-copilot-app read the same ~/.copilot.
    aliases: [github-copilot-cli, github-copilot, github-copilot-app]
    binaries: [copilot]
    packages: [npm:@github/copilot, cask:copilot-cli, winget:GitHub.Copilot, scoop:copilot-cli]
    state_dirs: ["~/.copilot"]
    home_env: [COPILOT_HOME]
    # User-set switches that children inherit; Copilot documents no marker
    # of its own and no session id variable.
    env_markers: [COPILOT_ALLOW_ALL, COPILOT_MODEL]
    mcp:
      - {paths: ["${COPILOT_HOME:-~/.copilot}/mcp-config.json"], format: mcpServers, scope: user}
    skills: ["${COPILOT_HOME:-~/.copilot}/skills"]
    rules: ["./.github/copilot-instructions.md", "./AGENTS.md"]
    transcript:
      format: copilot-events
      globs: ["${COPILOT_HOME:-~/.copilot}/session-state/*/events.jsonl"]
      home_env: COPILOT_HOME
    hooks:
      dialect: copilot
      managed_paths:
        posix: ["/etc/github-copilot/policy.d/hawkbell.json"]
        windows: ['C:\ProgramData\GitHub\Copilot\policy.d\hawkbell.json']
      user_paths: ["${COPILOT_HOME:-~/.copilot}/hooks/*.json", "${COPILOT_HOME:-~/.copilot}/settings.json"]
      project_paths: [".github/hooks/*.json", ".github/copilot/settings.json", ".github/copilot/settings.local.json", ".claude/settings.json"]
      notes: >-
        Policy hooks (policy.d, or HKLM\Software\Policies\GitHub\Copilot
        subkeys with a Policy value) ignore disableAllHooks and folder trust
        and run outside the sandbox. The policy file must be root-owned and
        not group- or world-writable. A preToolUse command hook fails closed
        on a crash or non-zero exit, but a timeout (default 30 s) always
        fails open, even for policy hooks. The VS Code Copilot harness loads
        the same hook files.
    risky_flags: [--allow-all, --yolo, --allow-all-tools, --allow-all-paths, --allow-all-urls, --autopilot, --no-ask-user]
    settings:
      - {file: ["${COPILOT_HOME:-~/.copilot}/settings.json", "./.github/copilot/settings.json", "./.github/copilot/settings.local.json"], format: json, key: disableAllHooks, op: eq, value: "true", flag: hooks_disabled, severity: high}
      - {file: ["${COPILOT_HOME:-~/.copilot}/permissions-config.json"], format: json, key: "*", op: exists, flag: saved_approvals_present, severity: info}
      - file:
          darwin: ["/Library/Application Support/GitHubCopilot/managed-settings.json"]
          linux: ["/etc/github-copilot/managed-settings.json"]
          windows: ['%ProgramFiles%\GitHubCopilot\managed-settings.json']
        format: json
        key: permissions.disableBypassPermissionsMode
        op: ne
        value: disable
        flag: bypass_mode_not_locked
        severity: low
      - {file: {windows: ['HKLM\SOFTWARE\Policies\GitHubCopilot', 'HKLM\Software\Policies\GitHub\Copilot']}, format: registry, key: "*", op: exists, flag: managed_policy_present, severity: info}
      - {file: {darwin: ["/Library/Managed Preferences/com.github.copilot.plist"]}, format: plist, key: "*", op: exists, flag: managed_policy_present, severity: info}
      - {format: env, key: COPILOT_ALLOW_ALL, op: exists, flag: allow_all_tools_env, severity: high}
      - {format: env, key: COPILOT_HOME, op: exists, flag: state_dir_relocated, severity: low}
    api_hosts: [api.githubcopilot.com]
    signers: {darwin_team_id: VEKTX9H2N7}
    capabilities: [executes_shell, edits_files, mcp_client]
    sources:
      - https://raw.githubusercontent.com/github/docs/main/content/copilot/reference/hooks-reference.md
      - https://raw.githubusercontent.com/github/docs/main/content/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md
      - https://registry.npmjs.org/@github/copilot/latest
      - https://raw.githubusercontent.com/Homebrew/homebrew-cask/master/Casks/c/copilot-cli.rb
      - research:agent-surfaces-a.md#4
    # GitHub's team id is confirmed for Copilot for Xcode, not for this
    # binary. The env markers come from vercel/detect-agent, not GitHub.
    unverified: [api_hosts, env_markers, signers.darwin_team_id]

  - id: gemini-cli
    name: Gemini CLI
    vendor: Google
    kind: agent
    # gemini-app: the Gemini desktop app's process is also called Gemini.
    aliases: [gemini-app]
    binaries: [gemini]
    packages: [npm:@google/gemini-cli, brew:gemini-cli]
    # ~/.gemini is shared with the Antigravity products (their own
    # subdirectories) and with MacPaw's Gemini duplicate finder, so the
    # directory alone proves nothing.
    state_dirs: ["~/.gemini"]
    home_env: [GEMINI_CLI_HOME]
    env_markers: [GEMINI_CLI]
    # Set for hook processes only, not for shell tool children.
    session_env: [GEMINI_SESSION_ID]
    mcp:
      - {paths: ["${GEMINI_CLI_HOME:-~}/.gemini/settings.json"], format: mcpServers, scope: user}
      - {project_paths: [".gemini/settings.json"], format: mcpServers, scope: project}
      - paths: &gemini_system
          darwin: ["/Library/Application Support/GeminiCli/settings.json"]
          linux: ["/etc/gemini-cli/settings.json"]
          windows: ['C:\ProgramData\gemini-cli\settings.json']
        format: mcpServers
        scope: managed
    skills: ["${GEMINI_CLI_HOME:-~}/.gemini/skills", "~/.agents/skills", "./.gemini/skills", "./.agents/skills"]
    rules: ["${GEMINI_CLI_HOME:-~}/.gemini/GEMINI.md", "./GEMINI.md", "${GEMINI_CLI_HOME:-~}/.gemini/policies"]
    subagents: ["./.gemini/agents"]
    commands: ["${GEMINI_CLI_HOME:-~}/.gemini/commands"]
    transcript:
      format: gemini-chats
      globs:
        - "${GEMINI_CLI_HOME:-~}/.gemini/tmp/*/chats/**/*.jsonl"
        - "${GEMINI_CLI_HOME:-~}/.gemini/tmp/*/chats/*.json"
      home_env: GEMINI_CLI_HOME
    hooks:
      dialect: gemini
      managed_paths: *gemini_system
      user_paths: ["${GEMINI_CLI_HOME:-~}/.gemini/settings.json"]
      project_paths: [".gemini/settings.json"]
      notes: >-
        Hooks live under the hooks key of settings.json, so hawkbell merges into
        the system settings file instead of owning it. Hook arrays concatenate
        across system, user and project settings. There is no plist or
        registry policy, and GEMINI_CLI_SYSTEM_SETTINGS_PATH repoints the
        system file, so the managed tier is weaker than the others.
        hooksConfig.enabled false turns hooks off. Timeouts are in
        milliseconds (default 60000) and only produce a warning.
    risky_flags: [--yolo, --approval-mode yolo, --approval-mode auto_edit]
    settings:
      - {file: ["${GEMINI_CLI_HOME:-~}/.gemini/settings.json", "./.gemini/settings.json"], format: json, key: hooksConfig.enabled, op: eq, value: "false", flag: hooks_disabled, severity: high}
      - {file: *gemini_system, format: json, key: security.disableYoloMode, op: ne, value: "true", flag: yolo_mode_not_locked, severity: low}
      - {file: *gemini_system, format: json, key: admin.secureModeEnabled, op: ne, value: "true", flag: secure_mode_not_enforced, severity: info}
      - {format: env, key: GEMINI_CLI_SYSTEM_SETTINGS_PATH, op: exists, flag: managed_settings_path_overridden, severity: high}
      - {format: env, key: GEMINI_CLI_HOME, op: exists, flag: state_dir_relocated, severity: low}
    api_hosts: [generativelanguage.googleapis.com, cloudcode-pa.googleapis.com]
    capabilities: [executes_shell, edits_files, mcp_client]
    sources:
      - https://raw.githubusercontent.com/google-gemini/gemini-cli/main/docs/hooks/reference.md
      - https://raw.githubusercontent.com/google-gemini/gemini-cli/main/docs/reference/configuration.md
      - https://registry.npmjs.org/@google/gemini-cli/latest
      - research:agent-surfaces-a.md#5
    unverified: [api_hosts]

  - id: cursor-agent
    name: Cursor CLI
    vendor: Anysphere
    kind: agent
    # cursor: shares ~/.cursor and the hook files. grok-build: Grok Build
    # also installs a binary literally named "agent".
    aliases: [cursor-cli, cursor, grok-build]
    binaries: [cursor-agent, agent]
    packages: [cask:cursor-cli]
    install_paths:
      posix: ["~/.local/share/cursor-agent/versions/*", "~/.local/bin/cursor-agent"]
    state_dirs:
      all: ["~/.cursor"]
      posix: ["~/.config/cursor-agent", "~/.local/share/cursor-agent"]
    env_markers: [CURSOR_AGENT]
    mcp:
      - {paths: ["~/.cursor/mcp.json"], format: mcpServers, scope: user}
      - {project_paths: [".cursor/mcp.json"], format: mcpServers, scope: project}
    skills: ["~/.cursor/skills", "./.cursor/skills"]
    rules: ["./.cursor/rules", "./.cursorrules", "./AGENTS.md"]
    hooks:
      dialect: cursor
      managed_paths:
        darwin: ["/Library/Application Support/Cursor/hooks.json"]
        linux: ["/etc/cursor/hooks.json"]
        windows: ['C:\ProgramData\Cursor\hooks.json']
      user_paths: ["~/.cursor/hooks.json"]
      project_paths: [".cursor/hooks.json"]
      notes: >-
        Same hook files as the Cursor IDE. Whether the CLI honours every IDE
        hook event is not confirmed.
    risky_flags: [--force, --yolo]
    settings:
      - {file: ["~/.cursor/cli-config.json"], format: json, key: permissions.allow, op: exists, flag: cli_allowlist_present, severity: info}
    api_hosts: [downloads.cursor.com]
