# EXAMPLE, Fleet Premium only. Not validated against a server (the
# verification server runs Fleet Free); the Windows installer is a sketch
# (packaging/) and untested on hardware.
- url: https://downloads.example.com/hawkbell/0.1.0/hawkbell_0.1.0_windows_amd64.msi
  # Pin the package: Fleet refuses it when the download's hash differs.
  # hash_sha256: <SHA-256 of the package file>
  # Registers the osquery extension (tier 3; remove for tier 2). Fails on
  # hosts where Fleet manages osquery extensions, which rolls the install back.
  post_install_script:
    path: ../scripts/register-extension.ps1
