  - id: HB-DESTR-008
    title: Personal files deleted
    description: >-
      A command deletes in the user's Pictures, Documents, Desktop, Music,
      Movies, Videos or Downloads folder. Coding work rarely touches them;
      an agent cleaning up "duplicates" deleted 15,000 family photos.
    kind: activity
    class: finding
    severity: high
    confidence: medium
    maturity: experimental
    category: impact
    tags: [attack.t1485, atlas.aml.t0101, owasp.asi02]
    references:
      - "research/threats.md section 2 row 43: Cowork deleted 15k photos"
      - "research/threats.md section 3 R40"
    falsepositives:
      - "Clearing old installers out of Downloads at the user's request"
    when:
      type: [tool.pre, process.exec]
    match:
      shell.deletes|any_re: "(?i)^(~|\\$HOME|\\$\\{HOME\\}|/root|/home/[^/]+|/Users/[^/]+|c:\\\\users\\\\[^\\\\]+)[/\\\\](Pictures|Photos|Documents|Desktop|Music|Movies|Videos|Downloads)([/\\\\]|$)"
    dedup: [shell.deletes]
    evidence: [target.command, shell.deletes]
    escalate: true
    remedy: Stop the agent and restore from backup; check what it was asked to clean up.
    tests:
      - name: find delete in Pictures
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "find ~/Pictures -name '*.jpg' -size -2M -delete" } }
        expect: match
      - name: rm in Documents
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "rm -rf /Users/tester/Documents/old" } }
        expect: match
      - name: delete in the project
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "rm -rf ./docs/pictures" } }
        expect: no_match
      - name: listing Pictures
        event: { type: tool.pre, tool: { kind: shell, name: Bash }, target: { command: "ls ~/Pictures | wc -l" } }
        expect: no_match
