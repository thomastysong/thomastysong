# Generic HTTPS JSON endpoint (webhooks, custom collectors).
pipeline:
  outputs:
    - name: http
      alias: spoor_http
      match: 'spoor.*'
      host: ${SPOOR_HTTP_HOST}
      port: ${SPOOR_HTTP_PORT:-443}
      uri: ${SPOOR_HTTP_URI:-/}
      tls: on
      # A receiver whose certificate is issued by a private CA: give Fluent
      # Bit that CA's certificate (PEM) rather than switching tls.verify off.
      # tls.ca_file: /etc/fluent-bit/ca/receiver-ca.pem
      format: json_lines
      json_date_key: false
      header: Authorization Bearer ${SPOOR_HTTP_TOKEN}
      retry_limit: no_limits
      storage.total_limit_size: 512M
