# Any OpenTelemetry collector or OTLP endpoint (logs).
pipeline:
  outputs:
    - name: opentelemetry
      alias: spoor_otlp
      match: 'spoor.*'
      host: ${OTLP_HOST}
      port: ${OTLP_PORT:-4318}
      tls: on
      logs_uri: /v1/logs
      throttle: on
      retry_limit: no_limits
      storage.total_limit_size: 512M
